<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#dcd8cd;--sea:#cfe3ee;--bd:#fff;--acc:#b4442b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--ink:#e8e6e1;--mut:#9aa3b2;--line:#303744;--sea:#16293a;--bd:#14171d;--acc:#e8805f}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--ink:#e8e6e1;--mut:#9aa3b2;--line:#303744;--sea:#16293a;--bd:#14171d;--acc:#e8805f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:19px;margin:0}header small{color:var(--mut)}
#q{margin-inline-start:auto;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);min-width:220px;font:inherit}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 380px}
#mapw{position:relative;min-height:300px}#map{position:absolute;inset:0}
#era{position:absolute;top:10px;inset-inline-start:12px;max-width:60%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;box-shadow:0 2px 8px #0002}
#leg{position:absolute;bottom:10px;inset-inline-start:12px;max-width:min(300px,55%);max-height:42%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
#leg div{display:flex;gap:6px;align-items:center;margin:2px 0}#leg i{width:12px;height:12px;border-radius:3px;flex:none}
#reset{position:absolute;top:10px;inset-inline-end:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
aside{border-inline-start:1px solid var(--line);overflow:auto;padding:12px;background:var(--bg)}
aside h2{font-size:16px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.ev.on{border-color:var(--acc);box-shadow:0 0 0 2px #b4442b33}
.ev summary{cursor:pointer;list-style:none}.ev summary::-webkit-details-marker{display:none}
.d{color:var(--acc);font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--mut);font-weight:400;cursor:pointer}
.ev p{white-space:pre-line;margin:8px 0 2px;font-size:14px}
.go{margin-top:4px;border:0;background:none;color:var(--acc);cursor:pointer;padding:0;font:inherit;font-size:13px}
footer{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card)}
#yr{display:flex;align-items:baseline;gap:10px}#yr b{font-size:22px;color:var(--acc)}
#sl{width:100%;accent-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 0}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-inline-start:0;border-top:1px solid var(--line)}#q{margin:0;flex:1}}
</style>
</head>

<script>
const EV=[{"y": -323, "d": "10 ביוני 323 לפנה\"ס", "t": "(כל השנים להלן מתייחסות ללפנה\"ס)", "x": "(כל השנים להלן מתייחסות ללפנה\"ס) - מת אלכסנדר מוקדון, המכונה \"אלכסנדר הגדול\", מלך מוקדון ומגדולי המצביאים והמדינאים בכל הזמנים; נולד לאביו פיליפוס השני ובילדותו התחנך על ברכי אריסטו. בגיל 20 ירש את אביו והחל בתהליך של כיבושים נרחבים, לאור חזונו למזג את תרבות ההלניזם עם התרבויות המקומיות. בשנת 335 דיכא מרד בתבאי שביוון וב-333 הביס את דריווש, מלך פרס, בקרב איסוס. ב-331 כבש את בבל וייסד את אלכסנדריה שבמצרים, שנקראת על שמו. בשיא פארו השתרעה ממלכתו מיוון, דרך פרס, לאחר שהנחיל תבוסה לאימפריה הפרסית ועד תת היבשת ההודית. הוא מת בגיל 32 בבבל ונקבר בממפיס שבמצרים. בשנת 332 כבש אלכסנדר את ארץ ישראל והסביבה. הוא מוזכר לא פעם במקורות יהודיים, בכתבי יוספוס פלאביוס ובתלמוד. כך, מתאר התלמוד הבבלי מפגש שנערך בינו לבין שמעון הצדיק הכהן הגדול, שבמהלכו השתחווה אלכסנדר לשמעון (יומא, סט', א'). עוד מוזכר אלכסנדר בתלמוד כדמות המשקפת את הפילוסופיה והנהנתנות היוונית, כאנטיתזה להשקפה היהודית של חז\"ל.", "c": "Greece", "la": 39.0, "lo": 22.0}, {"y": -44, "d": "15 במרץ 44 לפנה\"ס", "t": "יוליוס קיסר, מנהיג צבאי ופוליטי, נרצח בסנאט ברומא", "x": "יוליוס קיסר, מנהיג צבאי ופוליטי, נרצח בסנאט ברומא. נולד בשנת 100 לפנה\"ס. קיסר הוא מחשובי מנהיגי הרפובליקה הרומית והאחרון שבה (לאחר מלחמת אזרחים שפרצה בעקבות מותו, הוקמה האימפריה הרומית). בתקופת שלטונו, הגדיל את שטחי הרפובליקה, האדיר את שמה וביסס את עצמו כדיקטטור לשארית חייו, תוך הרחבת סמכויותיו המדיניות. על פי מחזהו של ויליאם שייקספיר, מילותיו האחרונות של קיסר היו \"הגם אתה, ברוטוס?\" (בהתייחס למרקוס ברוטוס, אחד ממקורביו שנטל חלק ברצח). לאחר ההתנקשות הנציח הסנאט הרומי את שמו בלוח השנה שייסד, ועל שמו קרוי החודש החמישי (מרץ היה ראש השנה לחודשים בלוח הרומי), הלוא הוא חודש יולי (שנקרא בעבר קווינטיליוס). בנו המאומץ, יורשו, אוגוסטוס קיסר, בחר אף הוא להנציח את שמו בלוח השנה ועל שמו נקרא החודש השישי (שנקרא במקור סקסטיליוס), הלוא הוא חודש אוגוסט.", "c": "Italy", "la": 42.5, "lo": 12.5}, {"y": -30, "d": "12 באוגוסט 30 לפנה\"ס", "t": "המלכה הפרעונית קליאופטרה השביעית, מתאבדת בהכשת נחש", "x": "המלכה הפרעונית קליאופטרה השביעית, מתאבדת בהכשת נחש. קליאופטרה הייתה אחרונת מלכי בית תלמי, בתו של המלך תלמי ה-12. נולדה ב-69 לפנה\"ס. לאחר מות אביה, נישאה לאחיה , תלמי ה-13 ושלטו יחדיו. באותה העת, הייתה האימפריה הרומית שרויה במלחמת אזרחים בין יוליוס קיסר ותומכיו לפומפיי ותומכיו. כדי למצוא חן בעיני קיסר, הורה תלמי ה-13 להרוג את פומפיי עם הגיעו לאלכסנדריה שבמצרים. קיסר לא התרשם כלל וקלאופטרה ניצלה זאת עבור מינוף פוליטי, ובהוראתה הודח תלמי ונרצח. היא וקיסר הביאו לעולם ילד בשם קיסריון. שנים מספר לאחר רצח קיסר ב-44 לפנה\"ס, התחוללה מלחמה בין אוקטביוס (לימים אוגוסטוס), יורשו של יוליוס, לבין מרקוס אנטוניוס, מצביא ומושל הפרובינקיות המזרחיות של האימפריה, שתבע את הירושה. נפשו של מרקוס נקשרה בנפש קלאופטרה ולאחר שהובסו בקרב אקטיום נגד אוקטביוס, התאבדו זה אחר זה.", "c": "Egypt", "la": 27.0, "lo": 30.0}, {"y": -4, "d": "4 לפנה\"ס", "t": "לוח השנה היוליאני, שהונהג על ידי יוליוס קיסר, נכנס לתוקף ומחליף את לוח השנה הרומי", "x": "לוח השנה היוליאני, שהונהג על ידי יוליוס קיסר, נכנס לתוקף ומחליף את לוח השנה הרומי; בשונה מהלוח היוליאני, בלוח הרומי נמנו 355 ימים בשנה, בני 29 ו-31 ימים (מלבד פברואר, עם 28 ימים). הרומאים, שהאמינו כי מספר זוגי מביא ממזל רע, נמנעו מחודשים בעלי מספרים אלה; את החודשים החלו למנות ממרץ; כדי ליישר קו עם ימי שנות החמה (כ-365 יום), עוברה השנה מדי שנתיים בערך. לאחר מות יוליוס קיסר, שונה שמו של החודש השישי, קווינטיליוס, ליולי, על שמו.", "c": "Italy", "la": 42.5, "lo": 12.5}, {"y": 622, "d": "16 ביולי 622", "t": "לספירה", "x": "לספירה - הגירתו של מוחמד ממכה לאלמדינה (שנקראה אז ית'רב), במסע שמכונה ה\"הג'רה\", מסמנת את תחילת מניית השנים בלוח השנה המוסלמי; הלוח המוסלמי כולל 12 חודשים, ובשונה מהלוח העברי (לוח לונו-סולארי) והגרגוריאני (לוח סולארי), הוא מבוסס על חודשי הירח בלבד וללא עיבור השנים; שיטה זו יוצרת מצב שבו החודשים \"זזים\" עם עונות השנה וכל חודש נתון עשוי ליפול בכל אחת מעונות השנה. נכון להיום, הצטבר פער של 43 שנים במניין השנים בין הלוח המוסלמי ללוח הגרגוריאני. על פי הלוח, היום 28 בחודש ד'ו אל-חיג'ה, בשנת 1444. בנוסף, קיימים שמות ערביים מקבילים ללוח השנה הלועזי (לדוגמה, חודש יולי נקרא \"תמוז\" - تموز).", "c": "Saudi Arabia", "la": 24.0, "lo": 45.0}, {"y": 624, "d": "13 במרץ 624", "t": "צבאו של הנביא מוחמד נלחם מול אנשי מכה ב\"קרב בדר\"", "x": "צבאו של הנביא מוחמד נלחם מול אנשי מכה ב\"קרב בדר\". זהו אחד הקרבות המכוננים בתולדות האסלאם, בהיותו הניצחון הראשון של מוחמד, והיחיד שנקרא בשמו בקוראן. ב-622 היגר מוחמד ממכה – עיר מוצאו – לאל-מדינה (במסע שכונה ה\"הג'רה\" (الهجرة), המהווה נקודת ההתחלה של לוח השנה המוסלמי), על מנת לבסס את מעמדו, מפני שאנשי מכה רדפו אותו בגלל השקפותיו האקסצנטריות. משנחל הצלחה באל-מדינה (שנקראה תחילה ית'רב), החליט מוחמד להפיץ את אמונת האסלאם בקרב בני שבטו, קורייש, במכה, עיר הולדתו. חשיבותו של קרב זה נעוצה בכך שבעקבותו הצליח מוחמד לבסס את עצמו ככוח פוליטי וכשחקן מרכזי בזירה.", "c": "Saudi Arabia", "la": 24.0, "lo": 45.0}, {"y": 1099, "d": "15 ביוני 1099", "t": "לאחר מצור של למעלה מחודש, כובשים הצלבנים את ירושלים מידי המוסלמים וטובחים בתושביה היהודים והמוסלמים", "x": "לאחר מצור של למעלה מחודש, כובשים הצלבנים את ירושלים מידי המוסלמים וטובחים בתושביה היהודים והמוסלמים. כחלק ממסע הצלב הראשון, נכבשו אזורים נרחבים במזרח התיכון וערים רבים נפלו לידי הנוצרים בסדרת קרבות עקובים מדם. לאחר נפילת ירושלים, הוקמה \"ממלכת ירושלים\", שהגיעה לשיא גדולתה בשליש הראשון של המאה ה-12. ב-1187 הורם קרנם של המוסלמים, ושליט מצרים, צלאח א-דין, מקים השושלת האיובית, הנחיל תבוסה לצלבנים בקרב קרני חיטין. לאחר שנכבשה בשנית על ידי הצלבנים, שוב נפלה ירושלים ורוב שטחי הארץ, בקרב הירביה (1244), לידי האיובים. ב-1250 הדיחו הממלוכים, בהנהגת ביברס, את האיובים, וב-1291 הקיץ הקץ לאחיזת הצלבנים בארץ ישראל.", "c": "Israel", "la": 31.5, "lo": 34.9}, {"y": 1170, "d": "29 בדצמבר 1170", "t": "תומאס בקט, שכיהן כארכיבישוף של קנטרברי (עמד בראש הכנסייה האנגלית), נרצח בקתדרלת קנטרברי על ידי אבירי המלך הנרי", "x": "תומאס בקט, שכיהן כארכיבישוף של קנטרברי (עמד בראש הכנסייה האנגלית), נרצח בקתדרלת קנטרברי על ידי אבירי המלך הנרי השני. המלך ותומאס ניהלו בהתחלה קשרי ידידות, אך יחסיהם התערערו בגלל ניסיונות מצד המלך להחליש את כוחה של הכנסייה ול ותם מזכויותיהם והכריזו על צרפת כרפובליקה. ראשו של המלך נערף בגיליוטינה במעמד פומבי. אשת לואי, מארי אנטואנט, תוצא אף היא להורג. יום זה, המכונה \"יום הבסטיליה\", מהווה יום העצמאות הרשמי של צרפת, והוא נחגג ברחבי המדינה בתהלוכות ובפעילויות תרבותיות. נפילת הבסטיליה נחשבת לאירוע מכונן ולנקודת מפנה במהפכה הצרפתית. ביום זה נוהג נשיא צרפת להעניק חנינה לאסירים בעלי עבירות קלות.\nהבה נסקור בקצרה את תולדות צרפת למן העת העתיקה ועד היום. בשנים 58–50 לפנה\"ס, נכבש אזור גאליה, החופף לצרפת של ימינו, בידי האימפריה הרומית. לימים, יפלשו שבטים גרמאנים ופרנקים לגאליה ויביאו לנפילתה של האימפריה (המערבית). הפרנקים שלטו בצרפת, שכונתה אז \"פרנקיה\", ובשנת 800 ייסד קרל הגדול את השושלת הקרולינגית. קרל הוכתר על ידי האפיפיור כקיסר האימפריה הרומית הקדושה ואיחד את ממלכות הפרנקים. ב-843 חולקה האימפריה בידי נכדיו של קרל, לאזורים החופפים לצרפת וגרמניה של ימינו.\nבמאה ה-14, מת שארל ה-4 ללא בנים והוריש את המלוכה לשארית בשרו פיליפ ה-6, מייסד בית ולואה. אדוארד ה-3, מלך אנגליה ונכדו של שארל, טען לכתר הצרפתי, מה שהוביל ב-1337 לפרוץ מלחמת מאה השנים. דמות מפתח במלחמה היא הנערה ז'אן ד'ארק, שטענה כי שמעה בת קול משמיים המבטיחה את ניצחון צרפת על אנגליה. צרפת אכן הביסה את אנגליה ושטחה נותר על כנו.\nהרפורמציה הפרוטסטנטית של מרטין לותר במאה ה-16 הכתה שורשים בצרפת, ובין הפרוטסטנטים הצרפתים – ה\"הוגנטים\" – לקתולים התחוללו מלחמות דת, כשבשיאו \"טבח ליל ברתולומאוס הקדוש\". הן תמו בעקבות צו נאנט שהבטיח חופש דת להוגטים. מלחמת שלושים השנים (1618–1648) בין הפרוטסטנטים לקתולים בשטח האימפריה הרומית הקדושה הסתיימה עם חתימת \"שלום וסטפליה\", שכונן סדר גאופוליטי חדש ונקודת מפנה חוקתית. ב-1643 הוכתר המלך לואי ה-14, שמלך למשך התקופה הארוכה ביותר. תחת שלטונו, נהנתה צרפת מפריחה ושגשוג וגבולותיה הורחבו בזכות שורת מלחמות שניהל.\nבעקבות ריק שלטוני שהותיר קרלוס ה-2, מלך ספרד, שמת ללא יורשים, טענו אוסטריה (בית הבסבורג) וצרפת לכתר, מה שהוביל לפרוץ במלחמת הירושה הספרדית (1701–1715). במסגרת הסכם אוטרכט, הוכתר פליפה החמישי, נכדו של לואי ה-14 למלך ספרד. לאחר מלחמת הירושה האוסטרית, במהלכה איבדה שטחי ממלכה משמעותיים, אוסטריה – שנתמכה בידי צרפת טורפת, שרק החמירה עם המשבר הכלכלי העולמי של 1929. ב-1933 עלתה המפלגה הנאצית לשלטון, בהנהגת אדולף היטלר, שהבטיחה להשיב לגרמניה את כבודה. הנאצים, שדגלו בעליונות הגזע, הבטיחו לטהר את גרמניה מיהודים ולכונן בה חברה עילאית. ב-1938 סיפחה גרמניה את אוסטריה וחבל הסודטים ובאוגוסט 1939 נחתם הסכם אי תוקפנות בין ברית המועצות לגרמניה – הסכם ריבנטרופ-מולוטוב. המלחמה נערכה ביו בעלות הברית (ארצות הברית, ברית המועצות, בריטניה, צרפת ועוד) למדינות הציר (גרמניה, יפן, איטליה [עד 1943, כשערקה לצד השני] ועוד).\nהעילה הישירה לפלישה הייתה דגל כוזב שביימו הגרמנים, במסווה של תקיפה מבוימת של תחנת רדיו בגלייביץ. המערכה התרכזה תחילה בחזית המזרחית, כשגרמניה וברית המועצות (כעבור שבועיים) תוקפות את פולין במקביל ממזרח וממערב בהתאמה. ב-3 בספטמבר הכריזו צרפת ובריטניה מלחמה על גרמניה, שפתחה במתקפת בזק (בליצקריג) על החזית המערבית. ביוני 1940 פלשה גרמניה לצרפת, לאחר כיבוש בלגיה והולנד, וכוננה שם משטר נאצי וממשל בובות בהנהגת פיליפ פטן (צרפת של וישי). באותו הזמן חולצו למעלה מ-300,000 חיילים בריטים מדנקרק שבצרפת (מבצע דינמו). בקיץ הופצצה לונדון במערכה אווירית. ביוני 1941 פלשה גרמניה לברית המועצות במסגרת מבצע ברברוסה ונפתחה החזית המזרחית שכללה מצור גרמני כבד על העיר לנינגרד, שנמשך עד 1944. בחזית המזרחית רשמה לעצמה ברית המועצות הישגים מכריעים, כגון קרב קורסק – הקרב המשוריין הגדול בהיסטוריה – וקרב סטלינגרד, שהטו את הכף לטובת בעלות הברית.\nבשלהי 1941, לאחר תקיפה יפנית מסיבית על בסיס פרל הרבור, הצטרפה ארצות הברית למלחמה. בחזית אסיה והאוקיינוס השקט, נערכו קרבות ימיים, בעיקר בין ארצות הברית ובריטניה ליפן – ששלטה על מרבית איי האוקיינוס השקט– בהם קרב מידוויי והאיים האטוליים. בחזית צפון אפריקה התעמתו בעיקר איטליה, בריטניה וגרמניה, כשעל המערכה פיקד הפלדמרשל ארווין רומל; בריטניה הצליחה להדוף את איטליה ממצרים אך נהדפה בנמל טוברוק שבלוב, שהושמה במצור גרמני. בשלהי 1942 הסתמנה נקודת מפנה בקרב אל-עלמיין השני, כשהבריטים הביסו את הגרמנים במצרים והתישו את כוחם. במקביל, פלשו בעלות הברית לחופי מרוקו ותוניסיה, במסגרת מבצע ניצוץ.\nביוני 1944 הסתמנה נקודת מפנה, כשלמעלה מ-150,000 כוחות של בעלות הברית פשטו על חופי נורמנדי (במה שכונה D-day) במבצע הנחיתה הימי הגדול בהיסטוריה. הם התקדמו מזרחה בסדרה של קרבות, חלקם כושלים (כגון מבצע מארקט-גרדן) וסגרו על הגרמנים תוך עקיפת קו זיגפריד. בד בבד, התקדמו הרוסים מערבה ושחררו, במסגרת מבצע בגרטיון, את בלארוס. הניסיון האחרון של גרמניה למתקפה רחבת היקף התרחש בשלהי 1944 בקרב על הבליטה, שהפתיע תחילה את בעלות הברית, אך הוכרע בניצחון של האחרונה.\nהמלחמה ידעה את אחד הפרקים האפלים בתולדות האנושות, ברצח שיטתי של כ-6 מיליון יהודים, במסגרת \"השואה\", מרביתם במחנות השמדה ברחבי אירופה, הגדול שבהם מחנה אושוויץ בירקנאו. באפריל 1945 פתח הצבא האדום של ברית המועצות במתקפה על ברלין, מעוז הפיהרר. היטלר התאבד, יחד עם בת זוגו אווה בראון, וסמכויותיו הועברו לקרל דניץ. ב-8 במאי נכנעה גרמניה. ארצות הברית ריכזה מאמץ להכניע את יפן וכבשה מידה איים באוקיינוס השקט, כגון איוו ג'ימה. לאחר הטלת שתי פצצות אטום על יפן, נכנעה יפן, וב-2 בספטמבר 1945 תמה המלחמה באופן רשמי. מספר ההרוגים במלחמה נע בין 40,000,000 ל-50,000,000 איש והיא הכתיבה סדר עולמי גאופוליטי חדש.", "c": "Germany", "la": 51.0, "lo": 10.4}, {"y": 1941, "d": "13 בינואר 1941", "t": "מת ג'יימס ג'ויס, סופר ומשורר אירי, מגדולי הסופרים של המאה ה-20", "x": "מת ג'יימס ג'ויס, סופר ומשורר אירי, מגדולי הסופרים של המאה ה-20; נולד בדבלין ב-1882 למשפחה קתולית. למד רפואה בפריז. מספריו הידועים: יוליסס (1922) ודבלינאים (1914). מדי שנה ב-16 ביוני חוגגים מעריציו את חג בלומסדיי (ע\"ש גיבור הספר לאופלד בלום) - לציון האירועים הבדיוניים מהרומן יוליסס, המתרחשים ב-16 ביוני 1904. יום זה מצוין בפעילויות שונות ובהקראות פומביות של הספר.", "c": "Ireland", "la": 53.0, "lo": -8.0}, {"y": 1941, "d": "22 ביוני 1941", "t": "מלחמת העולם השנייה", "x": "מלחמת העולם השנייה; צבא גרמניה פולש במתקפת פתע לברית המועצות ונפתח מבצע ברברוסה. מטרות העל של גרמניה היו כיבוש מרכזי השלטון של ברית המועצות והשתלטות על משאביה הטבעיים. בפלישתה, הפרה גרמניה את הסכם ריבנטרופ–מולוטוב, הסכם אי-תוקפנות שנחתם באוגוסט 1939 בין המדינות. בסופו של דבר, לאחר שורה של תבוסות שהנחילו הגרמנים, הצליח הצבא האדום של ברית המועצות לבלום את התקדמות הגרמנים למוסקבה בקרבות עקובים מדם. מבצע הבזק הסב אבדות כבדים שרבורג, שיועדו לחיל הים הישראלי ועוכבו בצרפת בשל הטלת האמברגו הצרפתי על ישראל, מפליגות לישראל במבצע מילוט חשאי, נועז ומתוחכם, של חיל הים. באצטלה של חברת נפט ובאמצעות חברת קש נורווגית שהקימו, נרכשו הספינות והוברחו בחסות ההוללות של חגיגות חג המולד. הן עגנו בחופי חיפה ב-31 בדצמבר.\nיז' בטבת ה'תש\"ל (1969) - מבצע תרנגול 53: במהלך מלחמת ההתשה, בחסות החשיכה, חומקים כוחות צה\"ל, מתחת לרדאר, אל שטח מצרים בראס ע'אריב, משתלטים על מכ\"ם סובייטי, ומצליחים להביא אותו, בדרך לא דרך, באמצעות מסוק סופר פרלון, לישראל. הרמטכ\"ל דאז, חיים בר לב, כינה מבצע זה כ\"לקוחה מעולם הסרטים\".\nכ' בטבת ה'תשכ\"ב (1961) - ספינת המעפילים החשאית אגוז, ששימשה לעליית יהודי מרוקו לישראל, בניגוד למדיניות מרוקו שאסרה על כך, טובעת בים התיכון, וגובה את חייהם של כל 44 הנוסעים. ב-1992 הועלו עצמותיהן של כמה מהגופות לקבורה ממלכתית בישראל.\nכב' בטבת ה'תשס\"ג (2002) - מחבלים מארגון הג'יהאד האסלאמי חודרים ליישוב עתניאל, מתגנבים לישיבה דרך המטבח, כשהם מתחזים לחיילי צה\"ל, ופותחים באש לעבר 4 מבחורי הישיבה; הבחורים הספיקו לנעול את דלת המטבח מבפנים ובכך כלאו את עצמם עם המחבלים והצליחו למנוע מהמחבלים לחדור אל חדר האוכל, ובכך ניצלו חיי רבים.\nכד' בטבת ה'תקע\"ג (1812): נפטר רבי שניאור זלמן מלאדי, מייסד חסידות חב\"ד, המוכר בכינויו, \"אדמו\"ר הזקן\" ו\"בעל התניא\"; מתלמידיו של המגיד ממזריץ'; נולד ביח' באלול ה'תק\"ה (1745; אם כי יש חוקרים הנוקבים בתאריך אחר) בליוזנה, כיום בבלארוס בבלארוס. בצעירותו, התקבל כחבר בחברה קדישא בעיירת מגוריו. רבו היה רבי דב בער \"המגיד ממזריטש\", ולאחר מכן בנו, רבי אברהם \"המלאך\". ב-1798 נעצר בעוון בגידה במולדת, לאחר שעדת המתנגדים טפלה עליו עלילת שווא, אולם הוא שוחרר ביט' בכסלו, שלימים יהפוך ליום טוב בקרב חסידי חב\"ד. את עקרונות תורת חב\"ד הניח בספריו ומאמריו, ביניהם ספר התניא (1796), שנחשב לספר היסוד של חב\"ד. בערוב ימיו, בעקבות כיבושי נפוליאון, נמלט עם בני משפחתו מהעיירה לאדי והשתכן בקרמנצ'וג; נקבר בעיר הדיאץ', אוקראינה.\nכד' בטבת ה'תקצ\"ז (1837): רעידת אדמה עוצמתית פוקדת את אזור הגליל ולבנון, ופוגעת קשות בטבריה ובצפת. מוערך כי עוצמת הרעידה הייתה 7 בסולם ריכטר (דירוג זה טרם נוסח אז), וכי מספר ההרוגים נע בין 5,000 ל-7,000. הרעידה חוללה גלי צונאמי ממי מהכנרת אשר זרעו הרס נוסף; בעקבות הרעש, יהודים רבים השתכנו בירושלים והקימו שם קהילות. בתמונה, העיר העתיקה של צפת.\nבין רעידות האדמה הבולטות שהתרחשו בארץ ישראל, ניתן למנות את:\n1. רעידת האדמה ביהודה (130 לספירה) שהסב הרס רב לקיסריה;\n2. רעידת האדמה בגליל (363) שהפסיקה את עבודות בניית בית המקדש השלישי, שהתיר הקיסר יוליאנוס;\n3. רעש שביעית (749) – נקרא כך כי אירע, לפי חלק מהמקורות, בשנת השמיטה. הרעידה החריב יישובים בבקעת הירדן. התאריך העברי שבו אירע הרעש - כג' בשבט - נקבע ליום צום בקרב כמה קהילות יהודיות. נהרגו כ-20,000;\n4. רעידת האדמה בבקעת הירדן (1033) מעורכת ב-7.3 לפי סולם מגניטודה לפי מומנט. זוהי ככל הנראה רעידת האדמה החזקה ביותר שהתרחשה על אדמת ארץ ישראל. היא גבתה כ-70,000 הרוגים;\n5. רעידת האדמה ביריחו (1927) בעוצמה 6.2, שגבתה 285 הרוגים והסבה נזק כבד לערי המרכז.\nכד' בטבת ה'תש\"ט (1949) - מתקיימות הבחירות לכנסת הראשונה (האספה המכוננת). מספר בעלי זכות הבחירה עמד על 506,567 ושיעור ההצבעה עמד על 86.9%. שתי המפלגות המובילות שהתמודדו בבחירות היו מפא\"י (דוד בן גוריון) ומפ\"ם (יצחק טבנקין); בסופו של דבר, הצליחה מפא\"י לגרוף 46 מנדטים ומפ\"ם – 19; אף על פי כן, העדיף בן גוריון להקים ממשלה עם הגוש הדתי ולא ממשלת שמאל. הקואליציה נשענה על רוב של 73 ח\"כים עם 12 שרים. הייתה זו הממשלה הקטנה ביותר בתולדות המדינה.\nכד' בטבת ה'תשכ\"ח (1968): הצוללת אח\"י דקר טובעת במצולות ים, עם 69 מאנשי צוותה, שנספו; מיקומה של הצוללת נותר בגדר תעלומה, עד שנמצאו שרידיה ב-1999. הצוללת מדגם T -  שנכנסה לשירות לקראת תום מלחמת העולם השנייה - נרכשה על ידי צה\"ל מהצי הבריטי וטבעה עם הבאתה לישראל.\nכד' בטבת ה'תשל\"ד (1974): ישראל ומצרים חותמות על הסכם הפרדת הכוחות, שסיים את מלחמת יום הכיפורים; ההסכם נחתם בקילומטר ה-101 מקהיר, על ידי הרמטכ\"ל דוד אלעזר וגנרל גמאסי. בין היתר, סוכם על חילופי שבויים, המשך אספקה לארמייה השלישית של מצרים, שכותרה על ידי צה\"ל, והסרת ההסגר המצרי שהוטל על מצרי באב אל-מנדב; בנוסף, בכוח ההסכם, חזרה תעלת סואץ לפעילות בשליטה מצרית. בתמונה: משמאל, המשלחת הישראלית בראשות האלוף אהרן יריב, ומימין, המשלחת המצרית בראשות הגנרל גמאסי.\nכו' בטבת ה'תרע\"ז (1917) - אבשלום פיינברג, ממנהיגי ניל\"י, נרצח בהיתקלות עם בדואים מקומיים באזור רפיח; פיינברג נולד בגדרה ב-1889, עת ששלטו העות'מאנים בארץ ישראל; ב-1915, תקופת מלחמת העולם הראשונה, שילב כוחות עם האחים אהרונסון, ויחד איתם הקים את ארגון המחתרת ניל\"י, ששם לו למטרה לחתור תחת שלטון העות'מאנים ולספק שירותי מודיעין לבריטים (בחיל המשלוח המצרי), שנלחמו בעות'מאנים; על מנת לחזק את הקשר עם הבריטים, יצאו פיינברג ויוסף לישנסקי למצרים, אך תעו בדרך, ואבשלום נרצח. עצמותיו נמצאו כעבור שנים רבות, בזכות עץ תמר שככל הנראה צמח מגלעין שנשא פיינברג בכיסו, וב-1967, נקברו עצמותיו בטקס צבאי בהר הרצל. יוסף לישנסקי ונעמן בלקינד נתפסו על ידי הטורקים וניתלו בדמשק, ואילו שרה אהרונסון, שנתפסה אף היא ועברה מסכת עינויים, נפטרה מפצעיה שלושה ימים לאחר שניסתה לשים קץ לחייה.\nכז' בטבת ה'תרמ\"ט (1888) – נפטר הרב שמשון בן רפאל הירש (הרש\"ר הירש), רב ואינטלקטואל גרמני; נולד ב-1808; במקביל למאבקו החריף נגד תנועת ההשכלה והרפורמים, דגל במודרניזציה, על פי שיטתו \"תורה עם דרך ארץ\", לפיה, אין לסלוד מהקדמה ולסור מהקודים החברתיים המודרניים, אלא אדרבה, יש לאמצם לצורך ניהול אורח חיים יהודי תקין; זאת בניגוד לעמדתו של החתם סופר, ששלל פרוגרסיביות. את גישתו ביטא באמירה מהמשנה \"חדש אסור מן התורה\", כפרפרזה לאיסור חדש המתייחס לאחד מדיני החקלאות.\nכח' בטבת ה'תרפ\"ז (1927) - נפטר אשר צבי גרינברג, המוכר בכינויו אחד העם; מראשי הוגי הציונות; נולד ב-1856 בסקווירה, אוקראינה, למשפחה חסידית; בצעירותו, התרחק מהדת והיה מראשי תנועת חובבי ציון; ב-1922 עלה לישראל והשתכן בתל אביב; על פי השקפתו הרוחנית, כשם שהעץ וענפיו יונקים משורשיו וקיומם תלוי בהם, כך לא ניתן להפריד את החילוניות מהזיקה למסורת. זאת בניגוד גמור לגישתו של יוסף מיכה ברדיצ'בסקי, שראה בדת חלק נפרד מהלאום היהודי (יהדות כתרבות) וטען כי יש לשחררו מכבלי המסורת, תוך התהוות דמות של \"יהודי חדש\".\nכט' בטבת ה'תשט\"ו (1954) - אורי אילן מתאבד בשבי הסורי על מנת שלא להסגיר סודות מדינה. אילן נפל בשבי במהלך מבצע צרצר, במסגרתה, נשלחו 2 חיילים מגולני ו-3 מצנחנים לשטח סוריה, כדי לתחזק מכשיר הגנה לקו טלפון. בפתק שנמצא בנעלו, נמצא רשום, \"לא בגדתי, התאבדתי\".\nכט' בטבת ה'תשס\"ו (2006) - נפטר הרב יצחק כדורי, \"זקן המקובלים\". הרב כדורי נולד בבגדאד; ב-1922 עלה לארץ ישראל והתגורר בשכונת הבוכרים בירושלים, שם התפרנס ככורך ספרים; בהמשך, עמד בראש ישיבת \"נחלת יצחק\"; במרוצת השנים, פוליטיקאים ואישי ציבור רבים התדפקו על דלתו, לייעוץ ולברכה. נקבר בהר המנוחות.\nב' בשבט ג'תרפ\"ה (76 לפנה\"ס) - נפטר המלך אלכסנדר ינאי משולשת בית חשמונאי. נולד ב-126 לפנה\"ס, לאביו, יוחנן הורקנוס הראשון, בנו של שמעון התרסי. משמת אחיו, יהודה אריסטובולוס, ירש אותו אלכסנדר ינאי מתוקף מצוות ייבום, ונישא לאלמנתו, שלומציון המלכה. בשבתו על כס המלכות, יזם אלכסנדר ינאי מסעות כיבושים במצרים ובעבר הירדן והרחיב את שטחי ממלכתו. כצדוקי, הוא ניהל מאבק עיקש בעדת הפרושים ונטל סמכויות מהסנהדרין שהשתייכו לכיתה זו. מדיניותו הציתה מרי אזרחי נגדו ומסופר כי בחג סוכות אחד, \"רגמוהו כל העם באתרוגיהם\". כחלק ממאבקו נגד הפרושים, רצח ינאי המלך מאות מחכמי ישראל בשיטות הריגה מזעזעות. מסופר כי חתנו היה החכם שמעון בן שטח. בערוב ימיו, ניהל מלחמה בגולן ובעבר הירדן, עד שחלה ומת.\nד' בשבט ה'תשמ\"ד (1984) - נפטר רבי ישראל אבוחצירא \"הבאבא סאלי\", רב ומקובל מרוקאי, בנתיבות. נולד ב-1889 בריסאני שבמרוקו, נצר למשפחת אבוחצירא המיתולוגית; ב-1922 נסע, לראשונה, לארץ ישראל ולמד בירושלים. במהלך חייו התגורר עם משפחתו במרוקו ובצרפת, לפני שעבר להתגורר בישראל באופן קבוע, ב-1964. נודע כבעל מופתים, ורבים נהרו אליו לקבל את ברכתו; רבים פוקדים את קברו בימות השנה בכלל וביום ההילולה שלו בפרט.\nה' בשבט ה'תקמ\"ו (1786) - נפטר משה מנדלסון, פילוסוף והודה דעות גרמני, מאבות תנועת ההשכלה. נולד ב-1729 בעיר דסאו שבנסיכות אנהלט; נוסף על בקיאותו הרבה בלימודי הקודש, רכש השכלה בתחומי עניין רבים כגון פילוסופיה וספרות. על פי השקפת עולמו, שהייתה שנויה במחלוקת בקרב רבנים בגרמניה, האמין מנדלסון כי הניסיון להפגיש בין היהדות לתרבות המקומית רצוי ואף מבורך והוא דגל בהפרדת הדת מהממסד השלטוני. תרגם את חמשת חומשי התורה לגרמנית והציע פרשנות משלו; אחד מצאצאיו הוא המלחין הנודע פליקס מנדלסון, שהתנצר.\nה' שבט ה'תר\"ץ (1930) - החל גל העלייה החמישית שנמשך עד לפרוץ מלחמת העולם השנייה ב-1939. מרבית העולים הגיעו מאירופה וחלקם מאסיה; עם עליית הנאצים לשלטון ב-1931, הואץ קצב העלייה, והוא נחלש עם פרוץ המרד הערבי הגדול ב-1936. נוסף על כך, אחד הגורמים המרכזיים לעלייה זו נעוצה במינויו של הנציב העליון הבריטי החדש, ארתור ווקופ, שנודע בשל מדיניותו הפרו-ציוני ואשר נתן אישורי עלייה רבים, מדיניות שהוגבלה באופן דרסטי עם פרסום הספר הלבן על ידי שר המושבות מלקולם מקדונלד ב-1939.\nה' בשבט ה'תש\"ח (1948) - במהלך מלחמת העצמאות, לוחמי מחלקת הל\"ה (שמנו 20 אנשי פלמ\"ח ו-15 אנשי חי\"ש) נופלים בקרב, בדרכם לתגבר את יישובי גוש עציון המנותקים. לקראת חצות, יצאה מחלקה מחטיבת עציוני, בפיקודו של דני מס, אשר מנתה 38 לוחמים, לתגבר את יישובי הגוש. 3 מתוכם נשלחו בחזרה היות שאחד מהם נקע את רגלו. באשמורת הבוקר, הותקפה המחלקה על ידי ערבים והתנהל קרב עקוב מדם. משאזל מלאי התחמושת למחלקה, המשיכו להילחם בשארית כוחותיהם באמצעות חפצים שאלתרו, אולם איתרע מזלם והם נהרגו כולם. הם הובאו לקבורה לאחר המלחמה, עם מאות חללים נוספים. מחלקת הל\"ה הפכה לאחד המיתוסים של אותה מלחמה.\nח' בשבט ה'תשט\"ו (1955) - משה מרזוק ושמואל עזר מוצאים להורג במצרים, בעוון ריגול ופעולות חבלה במדינה, כחלק מפעילות \"העסק הביש\" (שנקרא במקור מבצע סוזנה). לאחר מהפכת הקצינים החופשיים במצרים ב-1952, בהנהגת מוחמד נגיב וגמאל עבד אל נאצר, החליטה ממשלת מצרים להלאים את תעלת סואץ ולנשלה מידי הבריטים והצרפתים שהחזיקו בה. ישראל, שחששה כי צעד זה יהווה עליה איום ביטחוני, החליטה לרקום מזימה והקימה במצרים חוליית ריגול במסווה של ארגון טרור, על מנת לערער את השלטון ולאלץ את המעצמות להשאיר בבעלותן את תעלת סואץ. בפועל, נחלה תוכנית זו כישלון, ורוב חבריה נתפסו; פרשייה זו עוררה סערה בפוליטיקה הישראלית, שהובילה להתפטרותו של פנחס לבון, שר הביטחון דאז.\nח' בשבט ה'תש\"ל (1970) - נפטרה לאה גולדברג, משוררת וסופרת, כלת פרס ישראל לספרות; נולדה ב-1911 בקניגסברג, גרמניה (ביום רוסיה); למדה פילוסופיה ושפות שמיות; ב-1935 עלתה לארץ ישראל, ומשחברה לה אמה ב-1940 התגוררו בתל אביב. ברקע הידיעות על הזוועות שביצעו הנאצים באירופה, כתבה את השיר 'האומנם (את תלכי בשדה)', המכיל את השורה \"את תלכי בשדה לבדך לא נצרבת בלהט השרפות בדרכים שסמרו מאימה ומדם\". לאחר מותה, הוענק לה פרס ישראל לספרות. כתבה שירים, ספרים וספרי ילדים שהפכו לקלאסיקות, ביניהם: איה פלוטו (1957) ודירה להשכיר.(1959)\nט' בשבט ה'קל\"ו (1376) - נפטר רבי ניסים בן ר' ראובן גרונדי הר\"ן, מגדולי חכמי ספרד. הר\"ן נולד בשנת ה'ע\"ה (1315 בקירוב). בברצלונה כיהן כרב ודיין וכתב פירוש על התלמוד הבבל ועל פסיקותיו ההלכתיות של הרי\"ף - רבינו יצחק אלפסי. רבי ניסים חי בעידן הדבר השחור (1347 - 1351) ואת הלך הרוח והאנטגוניזם שרחשו כלפי היהודים באותה תקופה הוא מתאר בכתביו.\nט' בשבט ה'תרכ\"ה (1865) - נפטר הרב יהוסף שוורץ, תלמיד חכם וגאוגרף, מראשוני חוקרי ארץ בעידן המודרני. נולד ב-1804 בממלכת בוואריה. בספרו \"תבואות הארץ\" - אשר זכה שלשבחים מפי מלך בוואריה בעצמו - מתאר הרב יהוסף את הגאוגרפיה של ארץ ישראל על שלל רבדיה. יתר על כן, שימש שד\"ר (שליח דרבנן - כינוי ליהודים שנשלחו לגייס תרומות למען היישוב היהודי בארץ ישראל).\nי' בשבט ה'תש\"י (1950) - נפטר רבי יוסף יצחק שניאורסון, אדמו\"ר הריי\"ץ, השישי בשושלת חסידות חב\"ד, בניו יורק. נולד ביב' בתמוז ה\"תר\"ם (1880) באימפריה הרוסית, לאביו, רבי שלום דובער – האדמו\"ר החמישי בשושלת חב\"ד. ב-1920, בעקבות פטירת אביו, ירש את כס הנשיאות. ב-1927 נאסר ברוסיה הסובייטית בגין הפצת יהדות ושוחרר ביג' בתמוז. ב-1929 ערך ביקור בארץ ישראל. ב-1940 נמלט לארצות הברית, שם תקע יתד וביסס את מרכז חסידות חב\"ד, עד פטירתו. שנה לאחר מכן בדיוק, עתיד חותנו, רבי מנחם מנדל שניאורסון – הרבי מליובאוויטש, לרשת את מקומו.\nי' בשבט ה'תשי\"א (1951) - שנה לאחר פטירת קודמו, רבי מנחם מנדל שניאורסון, הרבי מליובאוויטש, מוכתר כאדמו\"ר השביעי של חסידות חב\"ד, בבית מדרשו (שד' איסטרן פארקווי 770) שבברוקלין, ניו יורק; את מעמד ההכתרה פתח הרבי במאמרו על הפסוק משיר השירים \"באתי לגני אחותי כלה\", המבוסס על מאמר שניסח אדמו\"ר הריי\"ץ, ובו שיטח את עקרונותיו. תאריך זה נחוג בקרב חסידי חב\"ד בהתוועדות חסידית ולימוד תורת הרבי.\nי' בשבט ה'תשע\"ד (2014) - נפטר אריאל שרון, ראש ממשלת ישראל ה-11 מטעם הליכוד (ולאחר מכן קדימה). מילא שלל תפקידים מרכזיים בפוליטיקה ובמערכת הביטחון. בראשית ימי המדינה הקים את יחידה 101, יחידת קומנדו שנועדה לבצע פעולות תגמול בפדאיון (קבוצות טרור ערביות שקמו במטרה לבצע פעולות טרור בישראל). כיהן כאלוף פיקוד הדרום וכשׂר הביטחון במלחמת לבנון הראשונה (מתפקיד זה התפטר בעקבות טבח סברה ושתילה). ב-2005 הוציא לפועל את תוכנית ההתנתקות, במסגרתה פונו אלפי ישראלים מגוש קטיף. זמן מה לאחר מכן פרש מהליכוד והקים את מפלגת \"קדימה\", שזכתה לרוב קולות בבחירות 2006. בינואר 2006 לקה בשבץ מוחי ושקע בתרדמת עד מותו.\nיא' בשבט ה'תש\"ה (1945) - החלה צעדת המוות ממחנה הריכוז שטוטהוף שבפולין (כ-50,000 במספר). לקראת סוף המלחמה, עם נסיגתם מהחזיתות והתקרבות בעלות הברית, החלו הנאצים להצעיד את האסירים ממחנות הריכוז בחזיתות המזרחיות מערבה, כדי למנוע את שחרורם בידי בעלות הברית. אסירי שטוטהוף הנותרים הוצעדו , באפיסת כוחות, לעבר הים הבלטי בקור המחפיר של ינואר, ואלה שנעצרו נורו במקום.\nיא' בשבט ה'תש\"ט (1949) - מנורת שבעת הקנים, בעיצוב האחים גבריאל ומקסים שמיר, נבחרת כסמלה הרשמי של מדינת ישראל. מעט לאחר קום המדינה קמה ועדת הסמל והדגל בידי מועצת המדינה הזמנית (הגוף המחוקק של ישראל עד להקמת הכנסת בתחילת 1949), שנוסדה על מנת לבחור דגל וסמל למדינת ישראל. סמל זה נבחר מתוך 450 הצעות, והוא משמש עד היום. עיצוב הסמל הושפע מהמנורה שעל שער טיטוס ברומא ומתיאור הנבואה שניתנה לנביא זכריה: \"...וְהִנֵּה מְנוֹרַת זָהָב כֻּלָּהּ וְגֻלָּהּ עַל רֹאשָׁהּ וְשִׁבְעָה נֵרֹתֶיהָ עָלֶיהָ שִׁבְעָה וְשִׁבְעָה מוּצָקוֹת לַנֵּרוֹת אֲשֶׁר עַל רֹאשָׁהּ. וּשְׁנַיִם זֵיתִים עָלֶיהָ אֶחָד מִימִין הַגֻּלָּה וְאֶחָד עַל שְׂמֹאלָהּ\".\nיב' בשבט ה'תרפ\"ה (1925) - נפתח הטכניון בחיפה - שהיה לאוניברסיטה הראשונה בארץ ישראל; בניין הטכניון הראשון שכן בשכונת הדר הכרמל, עד אשר הועתק למיקומו הנוכחי ב-1953; בראשית דרכו התעורר ויכוח אשר לשפת ההוראה של הטכניון (במה שכונה \"מלחמת השפות\"), בין עברית לגרמנית, כאשר בסופו של דבר הוכרעה הכף לטובת העברית. כיום לומדים בטכניון למעלה מ-13,000 סטודנטים.\nיב' בשבט ה'תש\"ה (1945) - אבא ברדיצ'ב, מצנחני היישוב, מוצא להורג בידי הנאצים; במסגרת התנדבות היישוב [העברי] לצבא הבריטי במלחמת העולם השנייה - כדי לסייע במאמץ המלחמתי של בעלות הברית - התארגנה קבוצה של 37 צנחנים; 12 מחברי הקבוצה נפלו, מתוכם 7 הוצאו להורג, ביניהם חנה סנש המשוררת; אבא ברדיצ'ב צנח ביוגוסלביה. הוא נתפס בידי הנאצים ונרצח על ידם במחנה הריכוז מאוטהאוזן.\nיד' בשבט ה'תצ\"ח (1738) - יוזף זיסקינד אופנהיימר, בנקאי יהודי, ויועצו הפיננסי של הדוכס קרל מווירטמברג, מוצא להורג. לאחר מותו של הדוכס, הואשם יוזף במרידה במלכות – בין היתר על רקע רפורמות כלכליות שהנהיג בממלכה על דעתו – ובעוד שורות של עברות שאמינותן מוטלת בספק. דמותו היוותה מקור השראה לרומן בשם \"היהודי זיס\" (ליון פויכטוונגר, 1925), שעובד לסרט פרו-יהודי (1934), ולאחר מכן אף לסרט תעמולה אנטישמי בגרמניה הנאצית (1940).\nיד' בשבט ה'תקט\"ז (1756) - נפטר הרב יעקב יהושע פלק (נולד בה'תמ\"א - 1680), מחשובי האחרונים, רבן של כמה ערים באירופה ומחבר פירוש ה\"פני יהושע\" על התלמוד הבבלי. בהקדמה לפירושו כתב כי המניע לכתיבת הספר היה נס שחווה, במסגרתו קרס קיר המבנה שבו ישב ולמד, בעקבות \"פיצוץ מחסן חומר הנפץ בעיר\". בעודו מוטל בין ההריסות נדר כי אם יינצל, יעסוק כל חייו בלימוד תורה. הוא מספר כי מייד לאחר שסיים את נדרו, נפתח בפניו שביל בין העמודים שקרסו.\nטו' בשבט ה'תרע\"ח (1918) - מונחת אבן הפינה לאוניברסיטה העברית בבית אחוזת גריי היל. ב-1925 נערך טקס פתיחת האוניברסיטה באורח רשמי, בהר הצופים, ונכחו בו אישי ציבור נכבדים. עם קום המדינה ותחילת מלחמת העצמאות נותקה הגישה להר הצופים ובניין טרה סנטה הוחכר כקמפוס חליפי. ב-1958 נחנך הקמפוס בגבעת רם. עם כיבוש שטחי הר הצופים מידי הירדנים ב-1967, שב הקמפוס לפעול בהר הצופים. במרוצת השנים, הורחבה פעילות האוניברסיטה ונחנכו מספר קמפוסים ומוסדות השייכים לה. ב-1923, כחלק ממסע ביקורו בארץ ישראל, ביקר הפיזיקאי הדגול, אלברט איינשטיין - שפעל נמרצות, עם חיים ויצמן, להקמת המוסד - באוניברסיטה, ומסר שם הרצאה בתורת היחסות שהגה. למעשה, הייתה זו ההרצאה המדעית הראשונה במקום. את ההרצאה העביר בצרפתית.\nטו' בשבט ה'תש\"ט (1949) - מתכנסת האספה המכוננת – הכנסת הראשונה, בראשות בן גוריון, בבית המוסדות הלאומיים בירושלים. כיהנו בה שתי ממשלות, והיא נמשכה עד אוגוסט 1951. יוסף שפרינצק התמנה כיו\"ר הכנסת. במרץ 1950, לאחר שאספותיה נערכו במקומות שונים, השתכנה הכנסת בבית פרומין בירושלים, עד שעברה למשכנה הקבוע בגבעת רם ב-1966.\nיט' בשבט ה'תש\"י (1950) - מתחיל אירוע השלג הנרחב ביותר בארץ ישראל מאז החלו המדידות המטאורולוגית, במהלכו ירד שלג במישור החוף ובנגב. בירושלים נערם השלג לגובה של 65 ס\"מ ובתל אביב – 12 - 19 ס\"מ; שלג נערם אף בים המלח ובבקעה. לצד התרגשות הציבור, הכביד השלג הכבד על רבבות העולים החדשים לאחר קום המדינה, שהשתכנו במחנות אוהלים ובמעבורות.\nמאז קום המדינה, ידעה ישראל מערכות חורף חריגות, בהן:\n1. חורף 91'-92' – נרשם שיא משקעים ברחבי הארץ מאז תחילת המדידות המטאורולוגיות בארץ ישראל (1870). בירושלים נערם שלג חמש פעמים ובפסגת החרמון נערמו 6 מטרים של שלג. פתיתי שלג נצפו אף במישור החוף.\n2. חורף 2013 - מערכת חורף קיצונית הכתה במזרח התיכון; בירושלים, שלג נערם לגובה של למעלה מ-50 ס\"מ ובגוש עציון ל-120 ס\"מ. אלפי אנשים נתקעו בדרכם לירושלים בעקבות חסימת צירי התנועה לבירה. בתמונה: השלג בחרמון מחורף 92'\nיט' בשבט ה'תרס\"ב (1902) - נפתח בית החולים שערי צדק בירושלים, מהראשונים בעיר, שנוסד על ידי ד\"ר משה וולך; תחילה, שכן בית החולים ברחוב יפו, וב-1980 עבר למשכנו הנוכחי ליד שכונת בית וגן; בראשית דרכו נקבע כי האתיקה של בית החולים תונחה על פי כללי ההלכה היהודית. בתמונה: בניין שערי צדק הישן ברחוב יפו (פעל עד 1980 כשנחנך משכן בית החולים הנוכחי, ליד שכונת בית וגן. בהמשך, שימש כתחנת רשות השידור).\nיט' בשבט ה'תשס\"ה (2005) - נפטר אפרים קישון, סופר, סאטיריקן, מחזאי וקולנוען ישראלי. נולד ב-1924 בבודפשט. בנעוריו, זכה בתחרות כתיבה בבית הספר התיכון, אולם בשל יהדותו, נאסר עליו ללמוד באוניברסיטה. במלחמת העולם השנייה נשלח למחנה כפייה, ממנו הצליח להימלט. ב-1948 השלים לימודי צורפות וב-1949 עלה עם אשתו חווה לארץ ישראל. עם עלייתו למד את השפה העברית באולפן בירושלים והחל לכתוב טורים סאטיריים בעיתון \"דבר\", ולאחר מכן גם בעיתון \"מעריב\". ספרו הראשון \"העולה היורד לחיינו\" ראה אור ב-1951 והוא תורגם מהונגרית לעברית. בשנות ה-60 החל לביים סרטים; סרטו הראשון \"סאלח שבתי\" עלה לאקרנים ב-1964 והיה מועמד לאוסקר. כמו כן, ביים קישון מחזות שונים. חלק ניכר מכתביו מתאפיינים בביקורת סאטירית כלפי הממסד הישראלי. ב-2002 זכה בפרס ישראל. מיצירותיו הבולטות: סאלח שבתי (1964), תעלת בלאומילך (1969) והשוטר אזולאי (1971).\nכא' בשבט ה'תשט\"ו (1955) - מדינת ישראל רוכשת את מגילות ים המלח שנתגלו במערות קומראן. המגילות הראשונות נחשפו על ידי רועה צאן בדואי שהשליך אבן למערה, בניסיון לחלץ ממנה עז שהתחבאה, והיא פגעה באחד הכדים שבהם היו גנוזות המגילות. מציאת המגילות נחשבת לאחד הממצאים החשובים ביותר בארכאולוגיה, בארץ ישראל בפרט ובעולם בכלל, והן שופכות אור על אורח החיים של תושבי ארץ ישראל, בדגש על כת האיסיים, בתקופת בית שני. תוכן המגילות מכיל את כל ספרי המקרא (למעט מגילת אסתר) וספרים חיצוניים שלא נכללו בקאנון התנכ\"י (כגון ספר חנוך וספר בן סירא). חלק מהמגילות מוצגות כיום במוזיאון ישראל בירושלים.\nכא' בשבט ה'תשכ\"ה (1965) - המרגל הישראלי, אלי כהן, נעצר בסוריה. כהן גויס כסוכן ונשלח בשנות ה-60, בשליחות אגף המודיעין (ולאחר מכן \"המוסד\"), לסוריה לטובת ריגול. ב-1961 נשלח לארגנטינה, שם בנה סיפור כיסוי של סוחר ממוצא סורי בשם \"כמאל אמין ת'אבת\". ב-1962 עבר לדמשק והתברג לצמרת הפוליטית והצבאית. במהלך פעילותו בסוריה, הצליח כהן לספק מודיעין איכותי על התקפות סוריות מתוכננות וכן תרם לסיכול תוכנית הטיית מי הירדן. על פי הגרסה הרווחת, אלי כהן נחשף כשהוא משדר לישראל, משלא היה מודע לדממת האלחוט שהטיל הצבא הסורי כדי לבחון מכשירי קשר סובייטיים חדישים. הוא נידון למוות ונתלה בכיכר העיר ב-18 במאי 1965. בטרם עלה לגרדום, נשא וידוי עם רבה הראשי של דמשק, הרב נסים נדבו הכהן. מאמצי ישראל להציל את חייו לא עלו יפה.\nכא' בשבט ה'תשנ\"ה (1995) - שני מחבלים פלסטינים מבצעים פיגוע התאבדות כפול בצומת בית ליד. בשעת בוקר, פוצץ עצמו מחבל לבוש במדי צה''ל בתחנת אוטובוס מלאה בחיילים. שלוש דקות לאחר מכן פוצץ עצמו מחבל שני, ופגע בחיילים ועוברי אורח נוספים שהוזעקו לזירה. מחבל שלישי שהיה אמור להתפוצץ אף הוא, לא הגיע. בפיגוע – שמאחוריו עמד ארגון הג'האד האסלאמי – נרצחו 22 אזרחים וחיילים. תשעה חודשים לאחר הפיגוע, נורה פתחי שקאקי, מנהיג הגא\"פ, בדירתו במלטה. על פי דיווחים זרים, ישראל עמדה מאחורי החיסול.\nכד' בשבט ד'תק\"ח (748) או ד'תק\"ט (749) - רעש שביעית: רעידת אדמה עוצמתית מכה בארץ ישראל ופוגעת קשות ביישוב היהודי. האירוע מוזכר במקורות יהודיים, מוסלמיים ונוצריים, כולם מעידים על רבבות הרוגים. בנוסף, קיימות עדויות ארכאולוגיות להרס שהותירה הרעידה, בין היתר בבית שאן ובסוסיתא. להנצחת המאורע, חוברו פיוטים ואף נקבע צום לזכר ההרס והחורבן. פשר הכינוי \"רעש שביעית\" נעוץ בעיתוי הרעש, שהתרחש, על פי כמה מקורות, בשנת שמיטה. בתמונה: חורבות בית שאן (סקיתופוליס) - אחת הערים שניזוקו.\nכד' בשבט ה'תשל\"ו (1976) - נפטר הרב איסר יהודה אונטרמן, רבה הראשי האשכנזי של מדינת ישראל, ממנהיגי תנועת המזרחי; נולד ב-1886 בבריסק. למד בכולל של ישיבת וולוז'ין, שם הוסמך לרבנות. לפני שעלה לארץ ישראל כיהן כרב במספר קהילות יהודיות במזרח אירופה ולאחר מכן בליברפול, אנגליה. לאחר עלייתו, כיהן כרבה הראשי של תל אביב. הרב אונטרמן היה פעיל בתנועת המזרחי ושימש כציר בקונגרסים הציוניים מטעמה. ב-1964 הוכתר כרבה הראשי האשכנזי של מדינת ישראל, לצד הרב הראשי הספרדי, הרב יצחק ניסים. הוא החליף את קודמו בתפקיד, הרב יצחק אייזיק הלוי הרצוג. אחריו כיהן הרב שלמה גורן.\nכה' בשבט ה'תש\"ב (1942) - נרצח אברהם (יאיר) שטרן, לוחם מחתרת ומשורר, מייסד ומנהיג \"לוחמי חירות ישראל\" (לח\"י), על ידי הבריטים. נולד ב-1907 בסובאלק (כיום בפולין). ב-1925 עלה לארץ ישראל ולמד בגימנסיה העברית בירושלים. בשנות ה-30 הצטרף לשורות האצ\"ל, וב-1940 הקים את ארגון לח\"י, אליו הצטרפו לוחמים שפרשו מהאצ\"ל, משדרשו פעולות אסרטיביות יותר נגד הבריטים, נוכח נוקשותם כלפי היישוב היהודי. שטרן היה יעד מבוקש של הבריטים והמצוד אחריו התהדק לאחר מספר פעולות חבלה נגד מטרות בריטיות, שיוחסו ללח\"י. הוא נתפס בדירת מסתור בתל אביב, על ידי קצין בריטי בשם תומאס ג'יימס וילקין, ונורה במקום. יום הירצחו נקבע כיום הזיכרון לחללי הלח\"י.\nכו' בשבט ה'תשל\"ג (1973) - נפטר יעקב דורי, הרמטכ\"ל הראשון של צה\"ל ולאחר מכן נשיא הטכניון וסגן ראש עיריית חיפה. דורי נולד ב-1899 באודסה. ב-1905 עלה עם משפחתו לארץ ישראל והתחנך בבית הספר הריאלי בחיפה. במלחמת העולם הראשונה הצטרף לגדודים העבריים שלחמו לצד הבריטים. עם תום המלחמה למד הנדסה באוניברסיטת גנט בבלגיה. בשובו ארצה הצטרף לשורות ההגנה, ובין 1939 ל-1945 כיהן כרמטכ\"ל הארגון. לאחר קום המדינה התמנה לרמטכ\"ל צה\"ל, ממנו פרש ב-1949 מסיבות רפואיות.\nכח' בשבט ה'תשמ\"ב (1982) - נפטר גרשם שלום, חוקר קבלה ומיסטיקה. נולד ב-1897 בברלין. בנערותו, התקרב לדת והתחיל ללמוד זוהר וקבלה. את עבודת הדוקטורט שלו עשה על \"ספר הבהיר\". ב-1923 עלה לארץ ישראל וניהל את המחלקה היהודית בספרייה הלאומית (שנקרא אז בית הספרים הלאומי). במרוצת חייו היה למרצה לקבלה באוניברסיטה העברית, כתב ספרים וערך מחקרים רבים אודות הקבלה והחסידות, חלקם שנויים במחלוקת. ספרו הנחשב הוא \"זרמים ראשיים במיסטיקה היהודית\" (1941). על שמו קרוי אוסף ספרי קבלה וחסידות הניצב בספרייה הלאומית.\nכח' בשבט ה'תשנ\"ז (1997) - אסון המסוקים: תאונה קטלנית גובה את חייהם של 73 חיילים, כאשר שני מסוקי יסעור של חיל האוויר הישראלי מתנגשים מעל עמק החולה, בעת שהובילו לוחמים לפעילות מבצעית במוצבי צה\"ל בבופור ובדלעת בדרום לבנון. לאחר האסון הוכרז על יום אבל לאומי והוקמה ועדת חקירה שקבעה כי התקרית אירעה בשל טעות אנוש. עד 2002 (הפלת מסוק רוסי, בה נהרגו 127 איש) הייתה זו התאונה הקטלנית ביותר שבה היו מעורבים מסוקים. ב-2019 וב-2021 הוכרו שני חללים נוספים.\nל' בשבט ה'תרנ\"ו (1896) - ספרו של בנימין זאב הרצל, מדינת היהודים, יוצא לאור בווינה ובלייפציג, בגרמנית. הספר מהווה מניפסטו לחזונו של הרצל ובו שרטט את הקווים למדינה יהודית עצמאית, כפתרון ל\"שאלת היהודים\", אם כי לא הצביע קונקרטית על ארץ ישראל דווקא. הספר הוצא לאור על ידי מקס ברייטנשטיין, לאחר שכמה בתי דפוס השיבו את פניו ריקם, והפצתו נחשבת לאבן דרך בתולדות התנועה הציונית. כמה חודשים לאחר הפצתו נערך הקונגרס הציוני העולמי הראשון, שהתקיים בבזל.\nא' באדר ד'תתקכ\"ד (1164) או ד'תתקכ\"ז (1167) - נפטר רבי אברהם אבן עזרא, מגדולי פרשני מקרא, משורר ופילוסוף. נולד בטודלה, ספרד תחת שלטון המוסלמים. במרוצת חייו נדד בין מספר מדינות באפריקה ובאירופה. אין תמימות דעים בנוגע למקום קבורתו. במהלך חייו התיידד עם רבי יהודה הלוי (מחבר ספר הכוזרי). מאפיין מרכזי לפירושיו הוא סגנונו המתומצת והנטייה לפרשן על דרך הפשט, נוסף על חידודי לשון והעמקה בכללי הדקדוק העברי. זאת ועוד, עסק האבן עזרא רבות באסטרונומיה ובאסטרלוגיה (כששני תחומי הידע עדיין חפפו אחד את השני) ועל שמו נקרא מכתש על הירח. האבן עזרא נודע בשנינותו והוא חיבר פלינדרומים – טקסטים שניתן לקרוא משני הכיוונים. כך למשל, חיבר במתכונת פלינדרומית, שאלה המופנית לקב\"ה: \"אבי אל חי שמך, למה המלך משיח לא יבא\"; ועל כך התשובה המתקבלת היא: \"דעו מאביכם כי לא בוש אבוש, שוב אשוב אליכם כי בא מועד\". פלינדרום ריבועי, משוכלל וקסום, שמיוחס לו – במענה לשאלה הלכתית על אודות זבוב שנפל לתוך צנצנת דבש, האם כשר הוא – ניתן לקרוא אותו כמעט מכל כיוון אפשרי.\nא' באדר ה'ת\"ר (1840) - עלילת הדם בדמשק: השלטונות בדמשק מאשימים את היהודים בהריגת נזיר צרפתי נוצרי, לצורך אפיית מצות עם דמו, לאחר שנעדר עם משרתו המוסלמי. בעקבות השמועה, נאסרו ועונו כמה דמויות מפתח יהודיות באזור, ביניהם רב קהילת יהודי דמשק, יעקב ענתבי. התקרית עוררה דעת קהל ברחבי העולם היהודי, ובהתערבות נכבדים יהודים, בהם משה מונטיפיורי, הופעל לחץ פוליטי כבד, שנשא פרי, כאשר ממשלות בריטניה ואוסטריה דרשו ממוחמד עלי, שליט סוריה – שהיה בעל בריתן – לשחרר את העצורים.\nב' באדר ה'תשמ\"ו (1986) - נתן שרנסקי, פוליטיקא ופעיל זכויות אדם, משתחרר ממאסרו ברוסיה; נולד ב-1948 בדונצק (כיום באוקראינה); ב-1973 נדחתה בקשתו לקבל ויזה לישראל והיה למסורב עלייה; ב-1978 הורשע בבגידה והוא ריצה 9 שנות מאסר; בלחץ פוליטי כבדר הוא שוחרר; לאחר מכן הוענק לו דרכון ישראלי והוא עלה לישראל; ב-1996 רץ לכנסת תחת מפלגת ישראל בעלייה, שהקים, וכיהן כחבר הכנסת עד 2006. שרנסקי הפך לסמל המאבק על זכויות האדם ברוסיה הסובייטית בכלל והיהודים בפרט.\nיט' באדר ה'תל\"ז (1677) - נפטר ברוך שפינוזה, פוליסוף יהודי הולנדי, בן למשפחת אנוסים ממוצא פורטוגלי; נולד ב-1632 באמסטרדם; שפינוזה היה הוגה דעות רציונליסט שהשפיע רבות על הפילוסופיה המודרנית. בילדותו גילה בקיאות מרשימה במקורות היהודיים ונחשב לעילוי, אולם, בשל השקפותיו השנויות במחלוקת – כגון הטלת ספק באמיתות התנ\"ך – הוחרם ונודה על ידי הקהילה היהודית (והנוצרית), והוא שינה את שמו ל\"בנדיקטוס\" (ברוך בלטינית) והפך לסמל של כפירה וחילוניות.\nיט' באדר ה'תשל\"ג (1973) - טיסה 114 של ליביאן איירליינס מתרסקת לאחר שטועה בניווט, חודרת למרחב האווירי של ישראל מעל חצי האי סיני ומופלת על ידי חיל האוויר הישראלי. זמן מה לפני הנחיתה, נקלעה הטיסה, בקו טריפולי–קהיר, לסופת חול וטייסיה נאלצו להסתמך על מכשירי הניווט; מפאת הרוחות החזקות, נסחף המטוס מזרחה וטס מעל תעלת סואץ. צה\"ל, שהיה בכוננות גבוהה בעקבות התרעות מודיעיניות על ריסוק מטוס טעון בחומר נפץ בתל אביב, הבחין במטוס והזניק שני מטוסי F-4 פנטום על מנת ליירטו. בעקבות רצף של כשלים ותקשורת לקויה בין טייסי הפנטום לבין הטייסים הלוביים, נורו כנפי המטוס והוא פגע בדיונת חול, במהלך ניסיון לנחיתת אונס. 103 מתוך 118 הנוסעים נספו בתאונה.\nכא' באדר ה'תשל\"ח (1978) נפטר הרב שלמה יוסף זווין, עורך האנציקלופדיה התלמודית, מרבני הציונות הדתית, זוכה פרס ישראל; נולד ב-1885. בבחרותו למד בישיבת מיר ולאחר מכן כיהן ברבנות בקהילות רוסיה, ופעל לשימור הגחלת היהודית תחת השלטון הסובייטי; בשנות ה-30 עלה לארץ ישראל. הרב זווין כיהן כאב בית הדין הראשון של בית דין רבני חב\"ד והיה חבר מועצת הרבנות הראשית. הרבה לעסוק בסיפורי חסידים, אך גולת הכותרת שלו הייתה האנציקלופדיה התלמודית, מפעל שייסד יחד עם הרב מאיר בר אילן ב-1942.\nכה' באדר ה'ק\"ט (1349) - טבח שטרסבורג: כ-2,000 יהודים מועלים על המוקד ויתר תושביה היהודים מגורשים מהעיר, לאחר אולטימטום שהוטל עליהם, בין התנצרות למיתה; החל מ-1348, בתקופת הדבר השחור, גברה האיבה כלפי יהודי אירופה, שהואשמו בגרימת המגפה; במסגרת הלך הרוח אנטישמי זה, נערכו פוגרומים רבים ביהודים ורבים מהם נשרפו למוות וגורשו בכפייה; על יהודי שטרסבורג המגורשים הוטל צו איסור כניסה לעיר.\nל' באדר א' ה'תש\"ח (1948) - 12 נהרגים בפיגוע בבית המוסדות הלאומיים בירושלים; מבצע הפיגוע, ערבי נוצרי, נהג הקונסוליה האמריקאית, נהג להסיע מדי יום שתי מזכירות לבניין, והיה סוחר עם \"ההגנה\" באקדחים ורימונים; הוא ניצל את קשריו עם אנשי ההגנה למתן אישור כניסה לשטח המבנה; באותו בוקר, נכנס המחבל, שהיה אחד מאנשיו של עבד אל-קאדר אל-חוסייני, עם רכבו ונמלט; השומר, שהכירו, לא חשש ולא נקט פעולה כלשהי, מלבד הזזת הרכב לכניסה של אגף קרן היסוד; כעבור זמן מה התרחש הפיצוץ, בעקבותו התמוטטה הקומה השנייה של הבניין, נהרגו 8, בהם מנהל קרן היסוד לייב יפה, ונפצעו 44.\nל' באדר א' ה'תשס\"ח (2008) - מחבל ערבי פותח באש בישיבת מרכז הרב בירושלים, רוצח 8 ופוצע 9. המחבל, נהג הסעות ובעל עבר פלילי, הבריח את נשקו – רובה סער מסוג קלצ'ניקוב – לכתלי הישיבה בתוך קופסת קרטון. שוטרי סיור שנכחו במקום נמנעו מלחתור למגע עם המחבל. האירוע הסתיים כאשר אחד מאברכי הישיבה וקצין צה\"ל ירו למוות במחבל. הפיגוע גרר גינויים מרחבי העולם.\nא' באדר ב' ה'תשי\"ז (1957) - ישראל קסטנר, מראשי יהדות הונגריה, נורה על ידי 3 מתנקשים בתל אביב, לאחר שנטען כי שיתף פעולה עם הנאצים בשואה, ומת כעבור 11 ימים. מלכיאל גרינוולד, פובליציסט ירושלמי, טען בעיתון כי קסטנר שיתף פעולה פעולה עם הנאצים בהונגריה וכי העיד לטובת פושע נאצי במשפטי נירנברג. קסטנר הגיש תביעת דיבה נגד גרינוולד; המשפט נהפך לכתב אישום חמור נגד קסטנר ושופט בית המשפט המחוזי בירושלים קבע בפסק דינו כי הוא \"מכר את נשמתו לשטן\". קסטנר הגיש ערעור ובית המשפט פסק כי לא שיתף פעולה עם הנאצים, אך קבע כי העיד עדות שקר לטובת נאצי. המשפט עורר דעת קהל ברחבי הארץ ואף גרם למשבר ממשלתי.\nב' באדר ב' ה'תש\"ח (1948) - ארגון ההגנה משתמש לראשונה ב\"דוידקה\", מרגמה מתוצרת תעש מערכות, שפותחה על ידי דוד ליבוביץ. שימוש הבכורה נעשה בהתקפה על שכונת אבו כביר ביפו. הדוידקה לא ניחן בכושר טווח מזהיר, אך יעילותו הייתה בעיקר הרתעתית, שכן הרעש החזק שייצר הטיל מורא על הערבים, והניס אותם מעמדותיהם. בסה\"כ יוצרו 6 יחידות, אחת מהן מונצחת בכיכר מרכזית בשדרות יפו בירושלים.\nג'  באדר ב' ה'תשכ\"ה (1965) - המרגל הישראלי וולפגנג לוץ (בשמו העברי: זאב גור אריה) נתפס במצרים. וולפגנג פעל בשליחות המוסד במצרים בכסות של אזרח מערב גרמני, קצין לשעבר בוורמאכט. הוא רקם קשרים עם האליטה המצרית והצליח להתברג לצמרת השלטון. הוא סיפק מידע רב ערך על היערכות הצבא המצרי ועל המדענים הגרמניים (מרביתם אנשי אס-אס לשעבר, שעסקו בפיתוח טכנולוגיה צבאית מתקדמת לטובת המצרים). הוא נלכד, יחד עם אשתו, גם היא פעלה בשליחות המוסד, אולם הצליח לשמור על סיפור הכיסוי שלו וכך ניצל מעונש מוות; לאחר מלחמת ששת הימים שוחרר במסגרת חילופי שבויים.\nד' באדר ב' ה'תש\"ט (1949) - מלחמת העצמאות: צה\"ל פותח במבצע עובדה לשחרור דרום הנגב. המבצע הוא האחרון שנערך במסגרת המלחמה, ובמהלכו השתלט צה\"ל – בהשתתפות 3 חטיבות חי\"ר – על דרום הנגב, הערבה ואילת (שנקראה אם רשרש). כחלק מהמבצע, נכבשו אף עין גדי, מצדה וחלק מדרום הר חברון. המבצע הסתכם כמעט ללא אבדות, ושיאו הונצח בתצלום \"דגל הדיו\", שהפך לאחד מסמלי המערכה.\nד' באדר ב' ה'תשנ\"ב (1992) - נפטר מנחם בגין, ראש ממשלת ישראל ה-6; נולד ב-1913 בבריסק. את דרכו הפוליטית החל כראש תנועת בית\"ר בבלארוס. ב-1940 נעצר על ידי המשטרה החשאית הסובייטית - נ.ק.ו.ד, על פעילותו הציונות, אולם השתחרר כעבור שנה והתגייס לצבא פולין, במסגרת שירותו עלה לארץ ישראל ורקם קשרים עם ארגון האצ\"ל, עד כי הפך לעומד בראשו ב-1943. עם קום המדינה, נבחר לכנסת והקים את תנועת החרות. ב-1977 נבחר לראש הממשלה מטעם הליכוד, בבחירות שכונו \"המהפך\". במהלך כהונתו חתם על הסכם השלום עם מצרים, הורה על הפצצת הכור בעיראק ויצא למבצע \"שלום הגליל\". ב-1983, בצל מלחמת שלום הגליל, התפטר מהכנסת מתוך נימוק כי אינו יכול עוד, מבלי לפרט מדוע.\nד' באדר ב' ה'תשנ\"ז (1997) - הטבח בנהריים: חייל ירדני פותח באש מעמדתו ורוצח 7 תלמידות ישראליות באי השלום בנהריים ופוצע 6. הן ביקרו בנהריים – אתר הגובל בין ישראל לירדן, שלימים יועבר לשליטתה – במסגרת טיול שנתי של תלמידות מבית הספר אמית בבית שמש. כשהגיעו לאתר נשמע צרור יריות במשך דקות אחדות. כוחות ההצלה שביקשו להגיע לזירה עוכבו במעבר הגבול. בינתיים, פונו ההרוגות וחלק מהפצועות לבית חולים בירדן, והיתר, על גבי האוטובוס שהסיען, לבית החולים בטבריה. בעקבות הפיגוע, הביע חוסיין מלך ירדן התנצלות רשמית ואף ביקר את המשפחות השכולות.\nו' באדר ב' ה'תשל\"ח (1978) - צה\"ל פותח במבצע ליטני, במטרה לפגוע בתשתיות ארגוני הטרור הפלסטיניים בדרום לבנון. המניע למבצע היה הפיגוע בכביש החוף (אוטובוס הדמים) שבוצע על ידי אש\"ף, במהלכו נהרגו 35 ישראלים. במהלך המבצע – שנמשך 7 ימים – הצליח צה''ל לדחוק את פעילי הטרור אל מעבר לנהר הליטני. במבצע זה הודק הקשר בין צה\"ל לצבא דרום לבנון, העתיד לסייע לצה\"ל במלחמת לבנון הראשונה ב-1982. כעבור 6 ימים, התקבלה החלטה 425 של מועצת הביטחון של האו\"ם, שקראה לישראל לסגת מלבנון, ולהציב כוח צבאי מטעמם – יוניפי\"ל.\nו' באדר ב' ה'תשע\"א (2011) - 2 מחבלים פלסטיניים חודרים ליישוב איתמר ורוצחים, בדקירות סכין ובירי, זוג הורים למשפחת פוגל ו-3 מילדיהם; טרם הגיעם אליהם, פרצו המחבלים לבית ריק וגנבו משם נשק חם. על המחבלים, מזוהי החזית העממית לשחרור פלסטין, נגזרו 130 שנות מאסר; הפיגוע גרר גינויים מרחבי העולם, כולל מטעם הרשות הפלסטינית. ב-2002 אירע פיגוע דומה, במהלכו, נרצחה אם המשפחה ו-3 מילדיה, וכמו כן מפקדת כיתת הכוננות שחתרה למגע עם המחבל שהתבצר בבית.\nח' באדר ה'תשכ\"ט (1969) - נפטר לוי אשכול, ראש ממשלתה השלישי של ישראל. נולד ב-1895 באימפריה הרוסית. אשכול עלה לארץ ישראל ב-1914 והיה דמות מפתח ביישוב היהודי. הוא נבחר לכנסת לאחר קום המדינה, תחת מפלגת מפא\"י, ושימש כשר האוצר בממשלת בן גוריון במשך 11 שנים. עם פרישת בן גוריון מהכנסת ב-1963, מינה את אשכול לראש הממשלה. על רקע דרישתו של בן גוריון להקים ועדת חקירה בעקבות פרשת ה\"עסק ביש\" במצרים, התגלעה ביניהם מחלוקת, ובן גוריון פרש ממפלגת מפא\"י והקים את רפ\"י, מהלך שפגע ביוקרתו של האחרון; במהלך כהונתו ביטל את הממשל הצבאי על ערביי ישראל וניצח על מלחמת ששת הימים. עם מותו התמנה יגאל אלון לתפקיד ראש הממשלה.\nיב' באדר ה'תר\"פ (1920) - יוסף טרומפלדור נופל במאורעות תל חי. על פי הסכם סייקס-פיקו יועד אזור הגליל לצרפת, אולם למעשה הוא היווה שטח הפקר, והתעוררה שם תסיסה על רקע דתי ופוליטי. ועד ההגנה שיגר לשם את הקצין עטור התהילה – שנפל בשבי היפני במלחמת רוסיה-יפן ואיבד את זרועו השמאלית – יוסף טרומפלדור. טרומפלדור היה ממקימי גדוד נהגי הפרדות, הראשון מבין הגדודים העבריים, שלחמו במסגרת הצבא הבריטי במלחמת העולם הראשונה. בפיקודו של ג'ון פטרסון, הם נטלו חלק במערכת גליפולי, שנערכה בחצי האי גליפולי, בין האימפריה הבריטית לאימפריה העות'מאנית. באותו יום נכנסה כנופיית בדואים ליישוב, בתואנה שהם מחפשים צרפתים המתחבאים שם. בנסיבות שנויות במחלוקת, התפתח קרב בין היהודים לבדואים וטרומפלדור, שנחלץ להרגיע את הרוחות, נפצע. על פי עדות רופאו, מילותיו האחרונות היו (לפי גרסה אחת) \"אין דבר, טוב למות בעד ארצנו\", מפשט שהפך לאמרת כנף בתרבות הישראלית.\nיג' באדר ב' ה'תשמ\"ו (1986) - נפטר הרב משה פיינשטיין, מגדולי הפוסקים לאחר השואה, ראש מועצת גדולה התורה של אגודת ישראל בארצות הברית ומחבר השו\"ת אגרות משה. נולד ב-1895 בבלארוס. ב-1937 עזב את ברית המועצות והיגר לארצות הברית, שם כיהן כראש ישיבת \"תפארת ירושלים\" בניו יורק.\nיג' באדר ב' ה'תשנ\"ו (1996) - בפיגוע התאבדות בדיזינגוף סנטר נרצחים 13 ישראלים ונפצעים למעלה מ-100; הפיגוע בוצע על ידי מחבל ככל הנראה מזוהה חמאס; הפיגוע היה חלק מסדרת פיגועים (בהם שני פיגועי התאבדות בקו 18 בירושלים ובצומת אשקלון) שבוצעו לאחר חיסול המהנדס יחיא עייאש.\nיד' באדר ב' ה'תשמ\"ב (1982) - נפטר הרב צבי יהודה (הרצי\"ה) קוק, ראש ישיבת מרכז הרב ומחשובי מנהיגי הציונות הדתית; נולד ב-1891 בליטא, לאביו, הרב אברהם יצחק קוק; ב-1906 עלה לארץ ישראל ולמד בישיבת תורת חיים בירושלים. לאחר מכן נסע לגרמניה, שם שהה עד שחזר ארצה ושימש כמנהל הרוחני של ישיבת מרכז הרב שהקים אביו, וכראש ישיבה בפעול לאחר פטירתו; ברוח אביו, התייחס הרצי\"ה להקמת מדינת ישראל כאל \"ראשית צמיחת גאולתנו\" ו\"יסוד כסא ה' בעולם\"; הוא תמך בעיקרון ארץ ישראל השלמה, פעל רבות ליישוב הארץ וניהל מאבקים נגד מסירת שטחים ופינוי יישובים.\nיד' באדר ב' ה'תשנ\"ד (1994) - ברוך גולדשטיין, רופא יהודי מקריית ארבע, נכנס למערת המכפלה וטובח ב-29 מתפללים מוסלמים ופוצע למעלה מ-100, בעיצומה של תפילת יום שישי בחודש הרמדאן.\nכשבא להחליף מחסנית רביעית, התנפלו עליו המתפללים, פרקו אותו מנשקו והרגו אותו באמצעות מטפה. האירוע גרר שורת פיגועי נקמה מצד חמאס ובעקבותיו הוקמה ועדת שמגר, שקבעה כי גולדשטיין פעל על דעת עצמו. זהו הפיגוע החמור ביותר של טרור יהודי בישראל.\nטז' באדר ב' ה'תש\"ח (1948) - מלחמת העצמאות: שיירת יחיעם – שיירת אספקה מגדוד 21 של חטיבת כרמלי, שעשתה את דרכה מנהריה לקיבוץ יחיעם המנותק – מותקפת על ידי כנופיות ערביות ליד היישוב כאברי. מבין 87 אנשי השיירה, 47 הפלו בקרב, ויחיעם נותרה מנותקת עד מבצע בן עמי, אשר נקרא על שם מפקד גדוד 21, בן עמי פכטר.\nטז' באדר ב' ה'תש\"ח (1948) - מלחמת העצמאות: שיירת האספקה נבי-דניאל נתקלת במארב ומותקפת בדרכה חזור מגוש עציון לירושלים. על השיירה פיקד צבי זמיר; היא התעכבה בגוש בשל כמה גורמים, בהם העמסת פר ושתי פרדות. נוכח העיכוב, פשטה השמועה על השיירה הצפויה בקרב מאות כפריים ערביים, שהציבו מחסומים ונערכו למתקפה. כנשתקלו באחד מהמחסומים, נתקלו הכוחות באש חיה; חלקם הצליח לשוב על עקבותיהם, וחלקם התבצרו במבנה נטוש על אם הדרך; בקרב נפלו 15 חללים, ביניהם זרובבל הורוביץ, זכה לעיטור הגבורה על אומץ לבו.\nיז' באדר ב' ה'תשמ\"א (1981) - \"הנורה שתאיר את כל רמת גן\": שר הכלכלה, יעקב מרידור, מודיע בטלוויזיה כי מדען ישראלי הצליח לפתח נורה ביתית שבכוח האנרגיה שלה תהיה מסוגלת להאיר עיר שלמה כרמת גן, וכך לחסל את תלות העולם בנפט הערבי, נוכח משבר האנרגיה של 1973 בעקבות מלחמת יום הכיפורים; הידיעה כיכבה בכותרות הראשיות, אולם עד מהרה התברר כי \"המדען הממציא\" אינו אלא נוכל בשם דני ברמן שהורשע בפלילים; פרשת הנורה שמה את מרידור ללעג ולמעשה חיסלה את הקריירה הפוליטית שלו.\nיח' באדר ב' ה'תרע\"ח (1918) - זאב ז'בוטינסקי ויוסף טרומפלדור מקימים את הגדודים העבריים, כחלק מחזון להקמת צבא עברי בארץ ישראל. הרעיון להקמתם נזקף לזכותם של פנחס רוטנברג ודב בר בורוכוב. הגדודים פעלו במסגרת הצבא הבריטי במלחמת העולם הראשונה. התקיימו חמישה גדודים כאלה – אליהם התגייסו כ-10,000 יהודים (רק כמחציתם שירתו בפועל) – בהם גדוד נהגי הפרדות, שלחם לצד הבריטים בחזית גליפולי. לקראת סוף המלחמה התגייסו 3 גדודים נוספים, אלה פורקו לאחר המלחמה ומהם נבנה גדוד \"הראשון ליהודה\", שפעל עד 1921, עת שפורק על ידי הבריטים. לאחר מכן הוקם ארגון ההגנה.\nיח' באדר ב' ה'תשמ\"ח (1988) - פיגוע אוטובוס האמהות: 3 מחבלים פלסטיניים, שחדרו ממצרים, משתלטים על אוטובוס אזרחי באזור הנגב, ומחזיקים ב-11 בני ערובה שלא הצליחו להימלט. החוטפים, אנשי אש\"ף, דרשו לשחרר את כל פעילי אש\"ף הכלואים בבתי הכלא בישראל. במהלך המשא ומתן רצחו המחבלים את אחד מבני הערובה, או אז התסער כוח ימ\"ם על האוטובוס וחיסל את 3 החוטפים. במאמצי החילוץ נהרגו עוד 2 מבני הערובה. פעולה זו הייתה אחד המניעים העיקריים לחיסולו של אבו ג'יהאד – סגנו של ערפאת וראש הזרוע הצבאית של אש\"ף – בתוניסיה.\nיט' באדר ב' ה'תרצ\"ב (1932) - נפטר הרב יוסף חיים זוננפלד, ממנהיגי הקהילה החרדית ביישוב היהודי (הישן) בארץ ישראל; נולד ב-1848 ועלה לארץ ישראל בשנות ה-70 של המאה ה-19. פעל רבות ליישוב הארץ, אולם התנגד נחרצות לציונות. לאחר הקמת ארגון \"כנסת ישראל\" וייסוד הרבנות הראשית – בראשה עמדו הרב אברהם יצחק הכהן קוק והרב יעקב מאיר – נחלק הציבור החרדי ביחסו למוסדות הציוניים, והרב זוננפלד הוביל קו שתבע בידול מוחלט. באותה תקופה הונהגה הקהילה החרדית הלא ציונית על ידי \"ועד העיר האשכנזי\", ששימשה סניף של אגודת ישראל בארץ ישראל. ב-1936 התאחדו בתי הדין של \"הפרושים\" (כינוי לקהילת תלמידי הגר\"א שעלו לארץ ישראל) והחסידים והוקם ארגון העדה החרדית – שתפס את מקום \"ועד העיר האשכנזי\" – בראשו עמד הרב זוננפלד; בשל מחלוקות פנימיות פרשה ממנו קבוצת חרדים קנאית בראשות עמרם בלוי, המוכרת בשם \"נטורי קרתא\".\nכ' באדר ב' ה'תרצ\"ב (1932) - טקס המכביה הראשונה נפתח בתל אביב, בהשתתפות 390 ספורטאים יהודים מ-18 מדינות. הוגה רעיון המכביה, יוסף יקותיאלי, קיבל השראה מחוברת שהתגלגלה לידו – בה נכתב על יהודים רבים שהשתתפו במשחקי האולימפיאדה בסטוקהלם ב-1912 – וברוח \"יהדות השרירים\" שתבע מקס נורדאו. הוא הציע כי \"המכביה\" המתוכננת תיערך ב-1932, במלאות 1,800 שנה למרד בר כוכבא. הוא המריץ וגייס משלחת ספורטאים יהודים מרחבי העולם. כיום, מתקיימים משחקי המכביה אחת ל-4 שנים, בענפי ספורט שונים, כשהאחרונה התקיימה ביולי 2022. זכורה במיוחד היא המכביה ה-15 ב-1997, בה נהרגו 4 ספורטאים יהודים אוסטרליים מגשר שקרס למי נהר הירקון המזוהם.\nכ' באדר ב' ה'תש\"ל (1970) - נפטר נתן אלתרמן, משורר ועיתונאי ישראלי, חתן פרס ישראל לספרות לשנת 1968. נולד ב-1910 בוורשה. ב-1925 עלה עם משפחתו לארץ ישראל, שם התיישב בתל אביב ולמד בגימנסיה העברית הרצליה; בשנות ה-30 החל לפרסם טורים אקטואליים, פובליציסטים ואף סאטיריים, בעיתונים נפוצים בארץ ישראל, כגון \"דבר\" (הטור השביעי) ו\"הארץ\", ובד בבד נמנה עם \"חבורת יחדיו\" – חבורה ספרותית ההתקיימה בתל אביב, עמה נמנו משוררים עבריים מוכרים כגון לאה גולדברג, אברהם חלפי ואלכסנדר פן. אלתרמן היה מזוהה עם תנועת העבודה ומפא\"י (ואף ספג ביקורת על הערצתו הרבה לכאורה לבן גוריון). עם זאת, לאחר מלחמת ששת הימים נמנה עם מייסדי תנועת ארץ ישראל השלמה. אלתרמן נחשב לאחר המשוררים העבריים המוערכים והחשובים בעת המודרנית ורבים משיריו הפכו לנכסי צאן ברזל. מבין שיריו המוכרים ניתן למנות את \"מגש הכסף\", \"כלניות\", \"ליל חניה\" ו\"פגישה לאין קץ\".\nכא' באדר ב' ה'תשכ\"ח (1968) - צה\"ל פושט על מפקדת הפת\"ח במסגרת פעולת כראמה (או מבצע תופת), בעיירת כראמה בבקעת הירדן. לאחר כיבוש הגדה המערבית במלחמת ששת הימים, התבססה פעילות אש\"ף בירדן, והעומד בראשו, יאסר ערפאת, הכווין משם פיגועים נגד ישראל, כשהוא מרכז את מאמציו באזור שכונה \"ארץ המרדפים\". על המבצע פיקד אלוף פיקוד המרכז עוזי נרקיס. אחרית דבר, צה\"ל ספג 33 אבדות וכ-160 לארגונים הפלסטיניים וצבא ירדן שלחם לצדם. בעקבות המבצע, התחזקו ארגוני המחבלים בירדן, ומשהיוו אוים על המשטר, הם גורשו ללבנון, לאחר אירועי ספטמבר השחור. במקביל, נערכה פשיטה נוספת על בסיסי פת\"ח בירדן, במסגרת מבצע אסותא.\nכג' באדר ה'תש\"ח (1948) - מלחמת העצמאות: מבצע נחשון, שנועד לפרוץ את הדרך לירושלים להסיר ממנה את המצור, יוצא לדרך. הכוח העברי הורכב מיחידות שונות מחטיבות גבעתי, הראל, עציוני, אלכסנדרוני וקרייתי, של \"ההגנה\". המערכה נחלקה לשני צירים מרכזיים – מזרחית: שער הגיא – ירושלים, ומערבית: חולדה - רמלה. מבצע זה נחשב לנקודת מפנה ביחסי הכוחות במלחמה ובטקטיקת הלחימה וסימל מעבר מאסטרטגטיית מגננה לאסטרטגיית התקפה (במסגרת תוכנית ד'). המבצע נמשך 12 ימים, ונחל הצלחה בפריצת הדרך לירושלים לפרק זמן קצר. הוא נקרא על שם נחשון בן עמינדב, שהפך לסמל של חלוציות, על פי המסופר בסיפור יציאת מצרים.\nכג' באדר ה'תשל\"ה (1975) - בפיגוע במלון סבוי בתל אביב נרצחים 12. 8 המחבלים שביצעו את הפיגוע יצאו מלבנון ונחתו בחופי תל אביב בחסות החשכה. הם הסתערו על מלון סבוי – לא לפני ניסיון פריצה כושל לבית קולנוע – והחזיקו את אורחי בית המלון כבני ערובה, תמורת שחרור 20 מחבלים הכלואים בבתי כלא בישראל. המשא ומתן התנהל באמצעות כוכבה לוי, אחת מבני הערובה ששלטה בשפה הערבית, ובד בבד מסרה בחשאיות מידע חיוני לכוחות המחלצים. לפנות בוקר פרץ כח מסיירת מטכ\"ל למבנה, סיכל 7 מהמחבלים ושחרר את בני הערובה. הפיגוע תוכנן על ידי אבו ג'יהאד, בכיר באש\"ף, ובוצע כנקמה על מבצע אביב נעורים.\nכט' באדר ב' ה'תש\"ח (1948) - מלחמת העצמאות: הכפר הערבי דיר יאסין (כיום כפר שאול בירושלים), מותקף על ידי כוחות אצ\"ל ולח\"י. במקור, נועד המבצע להשתלטות על הכפר, אולם הוא התפתח – בנסיבות השנויות במחלוקת – לכדי קרב אשר הלך והסתבך, ועל פי הערכות שונות נהרגו בו בין 80 ל-120 איש (גם אלה שנויות במחלוקת), בהם נשים וילדים חפים מפשע. הפעולה זכתה לגינויים מאנשי היישוב, ושימשה ככלי תעמולה בידי מדינות ערב ומתנגדי מדינת ישראל נגדה.\nא' בניסן - על פי המקרא, ביום זה הוקם המשכן; \"וַיְהִי בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית בְּאֶחָד לַחֹדֶשׁ הוּקַם הַמִּשְׁכָּן\"; לאחר כניסת בני ישראל לארץ כנען שכן המשכן בשילה, במשך 369 שנה; לאחר שנחרב בתקופת השופטים, הוקם בנוב ולאחר מכן בגבעון, עד הקמת בית המקדש הראשון בהר המוריה בירושלים.\nב' בניסן ה'תר\"פ (1920) - נפטר רבי שלום דובער שניאורסון (האדמו\"ר הרש\"ב), האדמו\"ר החמישי בשושולת חסידות חב\"ד. נולד בכ' בחשוון ה'תרכ\"א (1860), להוריו, רבי שמואל שניאורסון (האדמו\"ר המהר\"ש - הרביעי בשושלת חב\"ד) ורבקה. נישא ב-1875. ב-1882 נפטר הרבי המהר\"ש, ועל אף שהסתמן כיורש לתפקיד אביו, את ההנהגה בפועל קיבל על עצמו רק כעבור 11 שנה. במשך חייו סבל ממצב בריאותי ירוד ואף נפגש עם הפסיכולוג זיגמונד פרויד בשל כך. ב-1897 ייסד את ישיבת \"תומכי תמימים\" בלובביץ', שהתייחדה בלימוד מעמיק של תורת החסידות (לימים, תועתק, בעקבות מלחמת העולם הראשונה, לרוסטוב), וב-1911 את ישיבת תורת אמת בחברון, כיום בירושלים. פעל למען יהודי רוסיה והתנגד בחריפות לתנועת ההשכלה ולציונות; במרוצת השנים חיבר והגה מאמרי חסידות רבים, עמוקים וקולחים, חלקם נאמרו בהמשכים במשך כמה שנים, על כן, בפי חסידי חב\"ד הוא מכונה \"הרמב\"ם של תורת החסידות\"; עם פטירתו, נטל לידיו בנו, רבי יוסף יצחק, את ההנהגה.\nד' בניסן ה'תש\"ח (1948) - מלחמת העצמאות: שיירת הדסה, שעשתה את דרכה להר הצופים הנצור, מותקפת על ידי פורעים ערביים בירושלים; עקב המצור, הגישה להר התאפשרה בשיירות משוריינות בלבד. השיירה, שכללה עובדי בית החולים הדסה, אנשי \"ההגנה\" ואזרחים, יצאה מלב ירושלים ונתקלה במחסום בשכונת שייח' ג'ראח, שנגרם בעקבות פיצוץ מטען; עם עצירתה, הותקפה השיירה משני עברי הכביש באש כבדה. כוחות \"ההגנה\" השיבו באש כמיטב יכולתם, עד שחולצו על ידי הבריטים בצהריים. 78 (לפי מקורות אחרים 80) מנוסעי השיירה נספו בתקרית.\nה' בניסן ה'תרע\"ז (1917) - אחמד ג'מאל פאשה, המושל הצבאי של ארץ ישראל במלחמת העולם הראשונה, חותם על צו המורה על גירוש כולל לתושבי יפו ותל אביב. עם פרוץ המלחמה, נאלצו תושבי היישוב, בעלי נתינות זרה לבחור בין התעת'מנות, שחייב גיוס חובה לצבא הטורקי, לבין אי-התעת'מנות שהיה כרוך בעזיבת הארץ; בפועל, הצו חל על יהודים בלבד וכ-10,000 מהם גורשו ועברו להתגורר ביישובים הסמוכים בתנאים מחפירים, שגבו את חייהם של מאות, עד ששבו לבתיהם לאחר תבוסת העות'מאנים במלחמה וכינון המנדט הבריטי בארץ ישראל.\nז' בניסן ה'תרפ\"ה (1925) - נחנכת האוניברסיטה העברית בהר הצופים בירושלים. עם קום המדינה ותחילת מלחמת העצמאות נותקה הגישה להר הצופים ובניין טרה סנטה הוחכר כקמפוס חליפי. ב-1958 נחנך הקמפוס בגבעת רם; עם כיבוש שחטי הר הצופים מידי הירדנים, שב הקמפוס לפעול בהר הצופים. במרוצת השנים, הורחבה פעילות האוניברסיטה ונחנכו מספר קמפוסים ומוסדות השייכים לה.\nח' בניסן ה'תש\"ה (1945) - אליהו חכים ואליהו בית צורי, לוחמי אצ\"ל ולח\"י, מועלים לגרדום לאחר שהתנקשו בחיי הלורד מוין, השר הבריטי לענייני המזרח התיכון, בקהיר. בתקופת המנדט נשפטו 12 מחברי אצ\"ל ולח\"י, אשר מכונים \"הרוגי מלכות\" ו\"עולי הגרדום\", למוות בתלייה. השניים נתפסו לאחר שנמלטו מזירת ההתנקשות ונידונו, בבית דין צבאי, לעונש מוות. הם הוצאו להורג בעודם שרים את \"התקווה\" ונקברו בבית העלמין היהודי בקהיר. ב-1975 הועלו גופותיהם לישראל ונקברו בחלקת עולי הגרדום בהר הרצל. למרבה הפלא, התברר כי גופותיהם נותרו שלמות כעבור למעלה מ-30 שנה.\nח' בניסן ה'תשל\"ג (1973) - צה\"ל יוצא למבצע אביב נעורים, במסגרתו פשטו כוחות מסיירת מטכ\"ל, חטיבת הצנחנים, שייטת 13 והמוסד, ללבנון, ותקפו מספר יעדי אש\"ף והחזית העממית לשחרור פלסטין בבירות ובצידון. הלוחמים הפליגו לחופי לבנון בעזרת סטי\"לים וחברו לשורות המוסד שנכחו במקום, הלה הובילו אותם ליעדים המבוקשים. במהלך המבצע פוצצו הושמדו מבנים ומפקדות בשני בסיסים. אחרית דבר, חוסלו כ-50 עד 100 מחבלים, כולל 3 מבכירי פת\"ח, ונפלו שניים מכוחות הביטחון.\nט' בניסן ה'תרס\"ג (1903) - מתרחשות פרעות קישינב נגד יהודי קישינב, מולדובה (אז חלק מהאימפריה הרוסית). הפרעות, שנמשכו יומיים, התבצעו על רקע הסתה מטעם העיתונות הרוסית, תוך עידוד גורמי מפתח, והלבשת עלילת דם לנרטיב; בפרעות נהרגו עשרות יהודים, מאות נפצעו ומספר רב של בתי עסק יהודיים נבזזו והושחתו. הפרעות השפיעו במידה רבה על הציונים החלוצים, בראשם בנימין זאב הרצל, להציע את תוכנית אוגנדה; בעקבות הטבח, חיבר המשורר חיים נחמן ביאליק את \"בעיר ההרגה\" ו\"על השחיטה\".\nי' בניסן ה'תשמ\"ד (1984) - פרשת קו 300: ארבעה מחבלים חוטפים אוטובוס של אגד ומחזיקים בנוסעים כבני ערובה, בדרישה לשחרר 500 אסירי פת\"ח; אחת הנוסעות, שהייתה בהיריון, שוחררה ומיד הזעיקה את כוחות הביטחון, שהגיעו לזירת החטיפה, בדיר אל-בלח, שברצועת עזה, ופתחו במשא ומתן. לאחר דין ודברים התסערה סיירת מטכ\"ל על האוטובוס, חיסלה 2 מהחוטפים ושחררה את בני הערובה. במהלך ההסתערות נהרגה חיילת. בהמשך, בהוראת ראש השב\"כ, הובלו 2 המחבלים הנותרים למקום מבודד והוכו עד מוות לציבור נמסר כי 4 המחבלים חוסלו במהלך ההסתערות, אולם בתצלום שהתפרסם בעיתון, נראה אחד המחבלים מובל על ידי אנשי השב\"כ בוועדת חקירה שכונסה בעקבות הפרשייה, התברר כי האחרונים העידו עדות שקר אשר לנסיבות מות 2 המחבלים, והיא הובילה למשבר חמור בין השירות לבין גורמים ממשלתיים, בסגה שנמשכה כשנתיים, במהלכה התפטר ראש השב\"כ אברהם שלום. בסופו של דבר העניק הנשיא, חיים הרצוג, חנינה למעורבים בפרשה.\nי' בניסן ה'תשנ\"ז (1997) - נפטר חיים הרצוג, הנשיא ה-6 של מדינת ישראל; נולד ב-1918 בבלפסט, בריטניה, בנו של יצחק אייזיק הלוי הרצוג, לימים הרב הראשי לישראל; ב-1935 עלה עם הוריו לארץ ישראל והצטרף לשורות \"ההגנה\"; לאחר מכן שב לבריטניה ללמוד משפטים, שם התגייס לצבא הבריטי ולחם במלחמת העולם השנייה; ב-1947 חזר לארץ ושירת במלחמת העצמאות. ב-1962 פרש משירות קבע בדרגת אלוף. לאחר מכן פיתח קריירה משפטית ומונה לשגריר ישראל באו\"ם; ב-1981 נבחר לכנסת מטעם מפלגת העבודה, וב-1983 נבחר לנשיא המדינה, בתפקיד זה כיהן עשור. הרצוג היה לנשיא הראשון שערך ביקור רשמי בארצות הברית ובגרמניה המערבית; עם תום כהונתו פרש מהחיים הפוליטיים.\nיג' בניסן ה'של\"ה (1575) - נפטר רבי יוסף קארו - בעל ה\"בית יוסף\" - מגדולי פוסקי ההלכה, מחבר השולחן ערוך והבית יוסף; נולד ב-1488 בטולדו, כיום בספרד. בילדותו, הוא ומשפחתו נמנו עם מגורשי ספרד (1492), והם היגרו לקושטא. ב-1536 עלה רבי יוסף לארץ ישראל והתיישב בצפת. הוא למד אצל רבי יעקב בירב (שפעל להחזיר את מוסד ה\"סמיכת חכמים\") והוסמך על ידו לרבנות. בצפת לימד תלמידים ושקד, במשך 32 שנה, על חיבור ה\"בית יוסף\". חיבור זה עוסק בבירור ההלכות שנכתבו בספרו של רבי יעקב בן אשר \"בעל הטורים\". את פסק ההלכה הכריע רבי יוסף על פי דעת הרוב בין הרמב\"ם, הרי\"ף והרא\"ש, וסיכום ההלכות רוכזו בחיבורו \"שולחן ערוך\". בנוסף, עסק גם בקבלה; במהלך חייו נישא 3 פעמים, ובנו השלישי נולד לו כשהיה בן 80.\nיג' בניסן ה'תרכ\"ו (1866) - נפטר רבי מנחם מנדל שניאורסון - אדמו\"ר הצמח צדק (על שם ספרו) - השלישי בשושלת חסידות חב\"ד, בלובביץ'; נולד ב-1789 בליוזנה, האימפריה הרוסית, לר' שלום שכנא ודבורה לאה, בתו של אדמו\"ר הזקן ואשת האדמו\"ר האמצעי. ב-1806 נישא לבת דודו וב-1829 (יש הגורסים שנים אחרות) התמנה לאדמו\"ר. במהלך כהונתו פעל רבות להצלת יהודים צעירים מגיוס בכפייה לצבא הרוסי (במה שנודע כגזירת הקנטוניסטים), עודד חקלאות בקרב חסידיו (על כך הוענק לו תואר של \"אזרח נכבד\" מטעם האימפריה הרוסית) וחיבר חיבורים בהלכה ובחסידות, החשוב שבהם הוא סדרת ספרי שו\"ת בשם \"צמח צדק\".\nיד' בניסן ה'תש\"ג (1943) - מתחיל מרד גטו ורשה, המרד היהודי הגדול ביותר במסגרת ההתנגדות היהודית בשואה. לאחר הגירוש הגדול למחנה ההשמדה טרבלינקה בקיץ 1942, החליטה קבוצת צעירים מהגטו להקים רשת ההתנגדות מזוינת בנאצים. בהשתתפות חברי תנועות נוער, בהם \"השומר הצעיר\", \"עקיבא\" ו\"הבונד\", הוקם הארגון היהודי הלוחם (אי\"ל), ומרדכי אנילביץ', חבר תנועת השומר הצעיר, מונה למפקד. כמו כן, הקימו חברי התנועה הרוויזיוניסטית בית\"ר את ארגון \"האיגוד הצבאי היהודי\" (אצ\"י), בפיקודו של פאוול פרנקל. בערב פסח, עם תחילת אקציית חיסול, פרץ הצרד, שחוסל כעבור חודש ימים. בשיא המרד החלו הנאצים בהצתה שיטתית של הגטו, ולאחר מכן גורשו רוב תושביו. כ-13,000 יהודים נספו במהלך המרד. המרד הפך לסמל ומופת של ההתנגדות היהודית בנאצים בזמן השואה.\nטו' בניסן ה'תשס\"ב (2002) - האינתיפאדה השנייה: לאחר שורה של פיגועים רצחניים, ששיאם הפיגוע במלון פארק בליל הסדר, בו נרצחו 30 בני אדם, צה''ל יוצא למבצע \"חומת מגן\" במטרה לפגוע בתשתיות הטרור הפלסטיני ולבלום את גל הטרור. במסגרת המבצע כבש צה''ל את ערי הרשות הפלסטינית, כיתר את המוקטעה, מקום מושבו של יאסר ערפאת, והתחוללו קרבות בשכם ובג'נין (בו נפלו 23 חיילי צה''ל ונהרגו למעלה מ-50 מחבלים). המבצע הוכתר בהצלחה ובעקבותיו ירד מספר הפיגועים וחוסלו רוב תשתיות הטרור. במבצע נפלו 30 לוחמי צה''ל ונהרגו מאות פלסטינים ונעצרו כ-7,000 חשודים בטרור.\nטז' בניסן ה'תרמ\"א (1881) - תחילת גל הפוגרומים \"הסופות בנגב\", שנערכו ביהודי דרום-מערב האימפריה הרוסית. הפרעות פרצו לאחר רצח הצאר אלכסנדר השני, על ידי התנועה המהפכנית המרקסיסטית \"נרודניה ווליה\", ולובו על ידי גורמים ועיתונים אנטישמיים. הפרעות הגבירו את גל ההגירה של יהודי רוסיה וחיזק את ההכרה בהקמת תנועה יהודית לאומית; במהלך הפרעות נטבחו עשרות עד מאות.\nטז' בניסן ה'תשס\"ה (2005) - נפטר עזר ויצמן, הנשיא ה-7 של מדינת ישראל. נולד ב-1924 בתל אביב; אחי אביו הוא חיים ויצמן, הנשיא הראשון של מדינת ישראל; את דרכו הצבאית החל בארגון \"ההגנה\". במלחמת העולם השנייה התנדב לצבא הבריטי ושירת כטייס בחיל האוויר המלכותי. עם שובו ארצה הצטרף לשורות האצ\"ל וכעבור זמן מה שב להגנה. ב-1958 מונה למפקד חיל האוויר ה-6. ב-1969 החל את דרכו הפוליטית ונבחר לכנסת מטעם תנועת החרות. תחת ממשלת בגין כיהן כשר הביטחון. ב-1984 הקים את מפלגת \"יחד\" שזכתה ל-3 מנדטים ואשר התמזגה לסייעת \"המערך\". ב-1992 נבחר לנשיא המדינה, בתפקיד זה כיהן עד התפטרותו ב-2000, בעקבות קבלת כספים בשווי עשרות אלפי שקלים, ללא דיווח.\nכו' באייר ה'תשכ\"ז (5 ביוני 1967) - ישראל מנחיתה מהלומה על מצרים ב\"מבצע מוקד\" ופותחת את מלחמת ששת הימים. בשלהי \"תקופת ההמתנה\" (1948–1967), גברו רוחות ההסתה והאיבה כלפי ישראל במצרים. נשיא מצרים, גמאל עבד אל-נאצר, הורה לסגור את מצרי טיראן לכלי שיט ישראליים וקידם כוחות משוריינים לחצי האי סיני. במכה מקדימה, הפציצו מטוסי חיל האוויר הישראלי בסיסי אוויר במצרים, ולאחר מכן בירדן, סוריה ועיראק. בעיצומן של ההפצצות, שיגר נאצר מסר כוזב לחוסיין, מלך ירדן, לפיו, ידה של מצרים על העליונה, ומתוקף כפיפות צבא ירדן לפיקוד המצרי, הצטרפה ירדן (על אף שלוי אשכול התרה בו שלא לחבור למתקפה מצרית) למלחמה. במהלך המתקפה, הושמדו 451 מטוסים, מול 46 בלבד של צה''ל. המבצע העניק לישראל עליונות אווירית והכשיר את הקרקע למתקפות נוספות במצרים, ירדן וסוריה. באותו יום, עם הישמע הפקודה \"סדין אדום\", פלשו שלוש אוגדות של צה''ל, לרצועת עזה וחצי האי סיני, במסגרת תוכנית הונאה. מאוחר יותר, בתגובה להפגזות ירדניות, תקפה ישראל (חטיבה 16) יישובים ערביים דרומית לירושלים, וכבשה את ארמון הנציב, צור באהר ועוד.\nכז' באייר ה'תשכ\"ז (6 ביוני 1967) - מלחמת ששת הימים – היום השני למלחמה: באישון לילה, הסתער כוח צה\"ל מחטיבה 55, בפיקודו של מוטה גור, לגבעת התחמושת, ונלחם עד אור הבוקר בקרב שהפך למיתוס במורשת הקרב הישראלית (37 חללים ישראלים ו-71 הרוגים ירדנים). לפנות בוקר, תקף מטוס עיראקי את נתניה ואת ובסיסים בצפון. הוא הופל, אך הסב אבידות בנפש. בבוקר, נכבשו מוזיאון רוקפלר ומאוחר יותר גבעת המבתר, הגבעה הצרפתית ושכונת אבו תור בירושלים המזרחית, והובשלו התנאים לשחרור העיר העתיקה. בחזית המצרית, כבשה ישראל את רוב רצועת עזה וצבא מצרים נסוג מערבה. כמו כן, הושלם כיבוש אל-עריש והוכרע קרב אום אל-כתף שהונהג על ידי אוגדה 38, בפיקודו של אריאל שרון, (43 חללים ישראלים ו-2,000 הרוגים מצרים) לטובת ישראל. בד בבד, פלש צה''ל לצפון השומרון ותקף את ג'נין לעומק הגדה, ובשעות הערב נכבשה העיר רמאללה.\nכח' באייר ה'תשכ\"ז (7 ביוני 1967) - מלחמת ששת הימים – היום השלישי למלחמה: בשעה 8:30, תקף חיל האוויר הישראלי את מתחם אוגוסטה ויקטוריה. בחלוף שעה, פרצו כוחות צנחנים מחטיבה 55 דרך שער האריות לעיר העתיקה וכבשו/שחררו את הר הבית ואת הכותל המערבי, תוך שמפקד החטיבה, מוטה גור, מודיע בקשר \"הר הבית בידינו\". מושל ירושלים הירדנית חתם על חוזה כניעה. תאריך זה נקבע לחג לאומי כ\"יום ירושלים\". בד בבד, נכבשה העיר טולכרם ולאחר מכן בית לחם, יריחו ושכם. בחזית המצרית, המשיכו כוחות צה''ל להתקדם דרומה בחצי האי סיני, ובחצות היום כבשו את שארם א-שייח' ואת מצרי טיראן. בחזית הצפונית, בתגובה לתקיפת חיל האוויר בסוריה בראשית המלחמה, ספגו יישובי אצבע הגליל שרשרת הפגזות סוריות, וצה\"ל הגיב בירי ארטילרי. את תצלום הצנחנים בכותל צילם דוד רובינגר.\nכט' באייר ה'תשכ\"ז (8 ביוני 1967) - מלחמת ששת הימים – היום הרביעי למלחמה: למחרת איחוד ירושלים, נכבשה חברון ללא כל התנגדות והושלם כיבוש יהודה ושומרון. בין ישראל לירדן נחתם הסכם הפסקת אש. בחזית המצרית, התקדמו כוחות צה''ל מערבה וכבשו את שדה התעופה בביר גפגפה ואת קנטרה שבקרבת תעלת סואץ. באותו היום, הותקפה אוניית הביון USS Liberty בשוגג על ידי צה''ל, מצפון לסיני, ונהרגו 34 מלחים. עמדתה הרשמית של מדינת ישראל הוטלה בספק בקרב בכירים ב-CIA וסביב התקרית התפתחו תאוריות קונספירציות.\nא' בסיוון ה'תשכ\"ז (9 ביוני 1967) - מלחמת ששת הימים – היום החמישי למלחמה: בשעה 7 בבוקר ניתנה ההוראה מפי שר הביטחון משה דיין לכבוש את רמת הגולן (על אף שהיסס על כך בראשית המלחמה); חטיבה 8 רשמה ניצחון בקרב על קלע וזעורה. במקביל, לפנות ערב, כבשה חטיבת גולני את תל עזזיאת ואת תל פאחר בקרב, ומרבית המוצבים הסורים ננטשו. בחזית המצרית, נכבשה העיירה ראס סודר שמדרום לסואץ, בשעות הצהריים, הגיע צה''ל עד גשר פרדאן שבגדת תעלת סואץ. בכך, תם כיבוש חצי האי סיני. ישראל ומצרים חתמו בו ביום על הפסקת אש.\nב' בסיוון ה'תשכ\"ז (10 ביוני 1967) - מלחמת ששת הימים – היום השישי למלחמה: עם שוך הקרבות בחזית הירדנית, יכלה ישראל להפנות את משאביה לחזית הצפונית; יהודה ושומרון וחצי האי סיני נכבשו. בבוקר אותו היום, נכבשה העיר קוניטרה (שנמסרה בחזרה לסורים במלחמת יום הכיפורים) ונשלמה המערכה לכיבוש דרום הגולן. לקראת ערב, נכבשה העיירה הדרוזית מַסעדה ובשעה 18:30 הושגה הפסקת אש, ובכך תמה המלחמה. ב-12 ביוני כבשה ישראל את החרמון ללא התנגדות. ישראל, אפופת הילת הניצחון, הרחיבה את שטחה לפי שלושה. ירושלים המזרחית סופחה מיד לשטח הריבוני של מדינת ישראל ואילו יהודה ושומרון נותרו במעמד של \"שטחים מוחזקים\" ושנויים במחלוקת. בשנות ה-80 נמסר חצי האי סיני וב-2005 פונתה התיישבות חבל עזה מתושביה.\nיא'  בסיון ה'תשס\"א (2001) - 21 איש נרצחים בפיגוע התאבדות בדולפינריום בתל אביב. הפיגוע אירע בליל שבת, בכניסה לדיסקוטק, שהיה פופולרי בקרב עולים מברית המועצות; את הפיגוע ביצע המחבל סעיד אל-חוטארי מקלקיליה, ששירת בעבר בצבא ירדן ונכנס ליהודה ושומרון. הוא נעצר על ידי הרשות הפלסטינית לזמן מה בשל מעורבותו של חברו הקרוב בפיגוע אחר, אך שוחרר. את האחריות על הפיגוע נטל ארגון חמאס. ראש הממשלה אריאל שרון החליט לנהוג באיפוק ולהימנע מתגובה צבאית, מהלך שעורר ביקורת ציבורית קשה מצד חוגים ימניים.\nיב' בסיון ה'תשנ\"א (1991) - נשלם מבצע שלמה להעלאת יהודי אתיופיה; המבצע נמשך 36 שעות, ובמהלכו פונו למעלה מ-14,000 יהודים מקהילת \"ביתא ישראל\" במבצע רכבת אווירית; בתקופת טרום המבצע הידקה ישראל את יחסיה עם אתיופיה ועם שליט אתיופיה, מנגיסטו, וסייעה לו להיאבק במורדים, בתמורה להעלאת יהודי המדינה; במהלך המבצע נקבע שיא של מספר האנשים הרב ביותר במטוס ג'מבו, עם 1,086 נוסעים ועוד 2 שהגיחו לאוויר העולם במהלך הטיסה. קדם למבצע זה \"מבצע משה\", במהלכו עלו לישראל למעלה מ-6,000 מיהודי אתיופיה.\nיג' בסיון ה'תשכ\"ג (1963) - נפטר מרטין בובר, פילוסוף, חוקר ומחנך יהודי ישראלי-אוסטרי. נולד ב-1878 בווינה, האימפריה האוסטרו-הונגרית. בצעירותו, למד פילוסופיה ומקצועות נוספים באוניברסיטת וינה. לקראת סוף המאה ה-19 הצטרף בובר לתנועה הציונית והתיידד עם בנימין זאב הרצל. עם עליית הנאצים לשלטון בגרמניה עלה לארץ ישראל ומונה לפרופסור מן המניין באוניברסיטה העברית (אף שהתנגד להקמתה בהתחלה). כמו כן, עיבד מחדש סיפורי חסידים. בובר היה ממפתחי הפילוסופיה של הדיאלוג, הרואה בעיקרון הדיאלוג קדימות רבת משקל על פני יתרון האינדיווידואליזם. מבחינה אידיאולוגית, דגל בסוציאליזם וצידד במדינה דו-לאומית בארץ ישראל.\nיג' בסיון ה'תשמ\"ב (1982) - שגריר ישראל בבריטניה, שלמה ארגוב, נורה על ידי מחבלים פלסטינים מארגון אבו נידאל – ארגון טרור שהתפצל מפת\"ח – והוא נותר משותק לשארית חייו, עד מותו ב-2003; פעולת ההתנקשות הובילה למבצע שלום הגליל, לאחר שורה של הפגזת יישובי הגליל בידי אש\"ף, בתגובה להפצצת ביירות בידי ישראל יום למחרת ניסיון ההתנקשות. לפני כן, כיהן ארגוב כשגריר ישראל בהולנד ובמקסיקו.\nיג' בסיון ה'תשנ\"ט (1999) - שרידי הצוללת אח\"י דקר נמצאים בין כריתים לקפריסין, כעבור 31 שנה, לאחר שנעלמו עקבותיה בים התיכון ב-25 בינואר 1968. הצוללת יצאה לדרכה מחופי בריטניה לישראל ב-9 בינואר 1968, עם 69 אנשי צוות. בסה\"כ נערכו 26 מבצעי חיפוש אחריה, כשב-1971 אותר מצוף הצוללת ליד חופי ח'אן יונס. זמן מה לאחר היעדרותה, הכריז משה דיין, שר הביטחון, על אנשי הצוות נעדרים, והרב שלמה גורן, הרב הראשי לצה\"ל, הכריז עליהם כחללים. הועלו מספר השערות אשר לנסיבות התאונה, המקובלת שבהן היא תקלה טכנית באחת ממערכות הצוללת. בתמונה: שרידי הצוללת במוזיאון חיל הים בחיפה.\nטו' בסיון ה'תש\"ח (1948) - \"אלטלנה\", אוניית הנשק של האצ\"ל, מופגזת על ידי צה''ל ועולה על שרטון ליד חופי תל אביב. ההפגזות גבו את חייהם של 16 אנשי אצ\"ל ו-3 חיילי צה''ל. האוניה הגיעה לחופי ישראל בהפוגה הראשונה של מלחמת העצמאות (10 ביוני – 8 ביולי), זמן מה לאחר שאצ\"ל פורק מנשקו והתמזג אל תוך צה\"ל. בתקופת טרום הגעתה, התנהל משא ומתן בין מנחם בגין, ראש האצ\"ל לנגיצי ממשלת ישראל והתגלעו חילוקי דעות בנושא העברת הציוד. תחילה הוסכם כי 20% מאספקת הנשק, שנרכש מידי צרפת, יועבר לידי האצ\"ל, אולם בן גוריון ראה בחימוש קבוצה שאינה תחת פיקוד צה\"ל איום על ריבונות המדינה. עם עגינת האוניה בחוף ויתקין כיתרו אותה כוחות מחטיבת אלכסנדרוני, על מנת ליצור הרתעה, ובפני אנשי האצ\"ל הוצב אולטימטום למסור את הנשק כולו לידי צה''ל. משדחה האצ\"ל את האולטימטום, פרצו חילופי אש בין כוחות צה''ל לאצ\"ל. האוניה נמלטה לחופי תל אביב, מתוך תקווה ששם יוכלו אנשי האצ\"ל לפרוק את הסחורה בבטחה. עם חידוש חילופי האש, ניתנה ההוראה להפגיז את האוניה והיא עלתה באש. הפרשה נחשבת לציון דרך בתולדות מדינת ישראל ובקרע שבין הימין לשמאל, והיא איימה לחולל מלחמת אחים. בן גוריון כינה את התותח שהבעיר את האוניה \"מבורך\". שרידי האוניה הוטבעו באופן מבוקר כשנה לאחר התקרית. פירוש השם \"אלטלנה\" הוא נדנדה באיטלקית.\nטו' בסיון ה'תשמ\"ב (1982) - צה\"ל פותח במבצע שלום הגליל (או מלחמת לבנון הראשונה בשמו העממי) במטרה לחסל את פעילות אש\"ף בלבנון, להגביל את מעורבות סוריה במדינה, לרקום קשר עם הפלגים הנוצרים ולהבטיח שקט ביישובי הגליל. במהלך המבצע הגיע צה''ל עד ביירות וחיסל את מרבית הכוח של הארגונים הפלסטיניים. המבצע הוביל להגליית צמרת אש\"ף, בהנהגת יאסר ערפאת, לתוניס. את החלל שנוצר בעקבות עזיבת אש\"ף ועוד מילא הארגון השיעי \"חזבאללה\", שקם בעקבות המלחמה. המבצע סימן את תחילת שהיית כוחות צה''ל בלבנון באופן קבוע, עד לנסיגה בשנת 2000. במלחמה נפלו 654 חללי צה\"ל ונמתחה ביקורת פנימית רבה על מהלכי המלחמה כגון טבח סברה ושתילה, שאף הובילה למשבר פוליטי.\nטו' בסיון ה'תשע\"ד (2014) - שלושה נערים נחטפים בצומת גוש עציון ונרצחים בידי מחבלי חמאס. שלושת הנערים, אייל יפרח, גיל-עד שער ונפתלי פרנקל, תלמידי ישיבות, עלו על טרמפ במכונית יונדאי i35 גנובה בצומת אלון שבות בחמישי בלילה. לאחר כמה דקות טלפן גיל-עד למוקד המשטרה ולחש \"חטפו אותי\" כשברקע נשמע אחד החוטפים צועק \"ראש למטה\" וקולות ירי עמומים. צה''ל, מג\"ב ושב\"כ יצאו במבצע חיפוש רחב היקף בשם \"שובו אחים\". לאחר 18 ימי חיפוש, נמצאו גופות הנערים באזור חברון. מבצעי הפיגוע, מרוואן קוואסמה ועאמר אבו עישה חוסלו בחילופי אש בפעילות משותפת עם צה''ל, שב\"כ והימ\"מ, לאחר שאותרו בבית בחברון. השתלשלות האירועים מאז החטיפה הובילה למבצע צוק איתן.\nיח' בסיון ה'תש\"ו (1946) - ליל הגשרים (מבצע מרכולת): במסגרת תנועת המרי העברי, מפוצצים אנשי הפלמ\"ח 11 גשרים (2 מתוכם נכשלו) בגבולות ארץ ישראל על מנת לנתק את נתיבי האספקה של הבריטים. פיצוץ גשר א-זיב (אכזיב) השתבש כשארע מוקדם מהצפוי, וגבה את חייהם של 14 לוחמי פלמ\"ח. בעקבות המבצע, ערך השלטון הבריטי סדרת פעולות כנגד היישוב היהודי, ביום שבת, שכּונה בפי אנשי היישוב \"השבת השחורה\", במסגרתן, הוטלו עוצרים ובוצעו מעצרים למכביר. בתמונה: גשר הרכבת אל חמה שנהרס בליל הגשרים.\nיח' בסיון ה'תשל\"ב (1972) - 3 מחבלים יפניים, חברי הצבא האדום היפני – ארגון טרור שפעל בהשראת קוריאה הצפונית וסין העממית – מבצעים טבח בנמל התעופה בלוד ורוצחים 24 בני אדם. המחבלים פעלו בהכוונת החזית העממית לשחרור פלסטין - מבצעים חיצוניים. 2 מחבלים חוסלו והשלישי, קוזו אוקומוטו, נתפס ונדון למאסר עולם. הוא שוחרר ב-1985 וגורש ללבנון (שם הוא חי עד היום) בעסקת ג'יבריל, במסגרתה שוחררו למעלה מ-1000 מחבלים תמורת 3 חיילי צה''ל שבויים. ממשלת יפן הביעה את התנצלותה על הפיגוע ואף שילמה פיצויים למשפחות הקורבנות.\nיט' בסיון ה'תש\"ו (1946) - במסגרת תנועת המרי העברי, אנשי ארגון לח\"י תוקפים את בתי המלאכה של הרכבת במפרץ חיפה ומסבים להם נזק רב. ההתקפה באה בהמשך לתקיפות הגשרים יממה קודם לכן ב\"ליל הגשרים\", בתגובה לסירובם של ארנסט בווין וקלמנט אטלי, חברי ממשלה בריטים, להעניק אישורי עלייה לעקורים יהודים לאחר השואה. עם הסתערות הכוחות, פתחו עליהם כוחות בריטים באש חיה ו-2 נהרגו. בדרכם חזור נתקלו במחסום בריטי ונפתחה עליהם אש תופת שהרגה במקום 9 נוספים. הנותרים נכלאו בכלא עכו ונידונו למוות, שהומתק למאסר עולם.\nיט' בסיון ה'תשמ\"ב (1982) - יקותיאל (קותי) אדם, סגן הרמטכ\"ל, נהרג במלחמת לבנון הראשונה. נולד ב-1927 בתל אביב. בגיל 15 היה יקותיאל פעיל ב\"הגנה\" ומאז קום המדינה נטל חלק משמעותי במערכות ישראל. עם פרוץ מלחמת יום הכיפורים מונה לסגן מפקד פיקוד הצפון, יצחק חופי, ולאחר העלאתו לדרגת אלוף, מונה למפקד פיקוד הדרום. קותי היה ממתכנני מבצע יונתן. מעט לפני נפילתו יועד לתפקיד ראש המוסד. יקותיאל הוא הקצין בעל התפקיד הרם ביותר שנפל בקרב. בנו אודי אדם היה מפקד פיקוד הצפון במלחמת לבנון השנייה. היישוב גבע בנימין, המכונה \"אדם\", קרוי על שמו.\nתענית כ' בסיון: בכמה מקהילות פולין וליטא נהגו לצום ביום זה, לזכר עלילת הדם בבלואה, צרפת, בשנת 1171, בה עלו על המוקד כ-30 יהודים. רבינו תם, שקביעת התענית מיוחסת לו, אף התבטא כי צום זה \"גדול יותר מצום גדליה\". עם השנים התרופף המנהג, אולם הוא חוּדש לאחר פרעות רינדפלייש ב-1298, בהן נהרגו אלפי יהודים. הוא הונהג בשלישית על ידי ועד ארבע ארצות, המוסד המרכזי של יהדות פולין, לזכר יהודי נמירוב שנטבחו במאורעות ת\"ח-ת\"ט (1348–1349 בקירוב). במרוצת השנים, נקבע יום זה לתענית לזכר מאורעות נוספים שהתרחשו, אולם כיום אין נוהגים לצום בו, למעט כמה קהילות מהמגזר הליטאי.\nכ' בסיון ה'תשכ\"ז (1967) - מדינת ישראל מספחת את מזרח ירושלים (והשכונות הצפוניות), בעקבות כיבוש הגדה המערבית במלחמת ששת הימים, לאחר 19 שנות שלטון ירדני. על סיפוח הגדה המערבית הכריזה ירדן ב-1950, והוא זכה להכרה בינלאומית מצומצמת כמו כן רוב שכונות ירושלים המאוחדת כיום לא נכללו בשטח העירוני של ירושלים הירדנית. עד 1988, עת הכריזה ירדן על \"ניתוק הזיקה\", שאפה ירדן להשיב לידה את הגדה המערבית ויזמה תוכניות מדיניות כגון \"תוכנית הקונפדרציה\" (הקמת קונפדרציה ירדנית-פלסטינית בהינתן נסיגה ישראלית מקווי 67) ונוצרו אף מגעים חשאיים בין ישראל לירדן בנושא (הסכם לונדון - לפיו ירדן תשלוט באוכלוסייה הפלסטינית ביהודה ושומרון תמורת חוזה שלום). כיום, למרבית מתושבי מזרח העיר ניתן מעמד של תושב קבע, המקנה להם זכויות סוציאליות על פי חוק ביטוח לאומי, אולם ללא זכות הצבעה בבחירות לכנסת; המעמד הריבוני של מזרח ירושלים שנוי במחלוקת בקרב הקהילה הבינלאומית.\nכ' בסיון ה'תשמ\"ב (1982) - מלחמת לבנון הראשונה: נערך קרב סולטאן יעקובּ, קרב משוריין בין כוחות צה''ל לכוחות סורים. הקרב התרחש בצומת דרכים ליד הכפר סולטאן יעקובּ במחוז בקעא בלבנון, והסב אבדות כבדות לצה\"ל, עם 21 הרוגים, למעלה מ-30 פצועים, 2 שבויים ו-2 נעדרים. צה''ל לא השיג את מטרתו בפריצת הדרך בכביש ביירות-דמשק, ואופן ניהול הקרב נחשב לאחד הכישלונות הגדולים במלחמה. גופתו של זכריה באומל, אחד הנעדרים בקרב, הוחזרה לישראל במרץ 2019.\nכב' בסיון ה'תשמ\"ה (1985) - אסון הבונים: 22 בני אדם, מתוכם 19 תלמידים, נהרגים בהתנגשות בין רכבת לאוטובוס, במפגש מסילת ברזל סמוך למושב הבונים. האסון אירע בשעות הבוקר כשנהגת האוטובוס החליטה לחצות את המסילה, שלא הוצבה בה מחסום או רמזור, מבלי ששמה לב לרכבת המתקרבת. הרכבת פגעה בחלקו האחורי של האוטובוס במהירות של 75 קמ\"ש והעיפה אותו למרחק 40 מ'. היא סטתה מהפסים, אולם לא היו בה נפגעים רבים. התבטאותו של שר הפנים מטעם ש\"ס, שקשר את התאונה עם חילול השבת בקולנוע היכל בפתח תקווה, חולל קרע בין דתיים לחילונים. זהו אסון הרכבת החמור בתולדות מדינת ישראל.\nכג' בסיון ה'תרצ\"ג (1933) - חיים ארלוזורוב נרצח בתל אביב. נולד ב-1899 ברומני, אימפריה הרוסית (כיום באוקראינה). בנעוריו, התעניין בשירה וספרות ונחשף לראשונה לתנועה הציונית. בהמשך, למד כלכלה באוניברסיטת פרידריך וילהלם בברלין. ב-1924 עלה לארץ ישראל, נטל חלק בהנהגת מפלגת הפועל הצעיר ונישא לסימה. בהמשך, מונה לראש המחלקה המדינית של הסוכנות היהודית. באותו ביום יצאו הזוג ארלוזורוב לטייל לאורך החוף כשפתאום הבחינה סימה בשני גברים שהלכו בעקבותיהם, כאשר בסופו של דבר, שלף אחד מהם אקדח וירה בארלוזורוב. הוא הובהל לבית החולים אך מת מפצעיו כעבור מספר שעות. שני חשודים בר
