צח, אברהם סטבסקי וצבי רוזנבלט, אנשי התנועה הרוויזיוניסטית, נעצרו, אולם בהמשך זוכו. ב-1982 החליט מנחם בגין להקים ועדת חקירה ממלכתית (ועדת בכור) לנסיבות הרצח, שקבעה כי השניים לא רצחו את ארלוזורוב וכי לא ניתן לקבוע מי אלה היו. נסיבות הרצח נותרו עד היום בגדר תעלומה.\nכג' בסיון ה'תש\"ח (1948) - מאיר טוביאנסקי, קצין בצה\"ל, נידון למוות בבית דין שדה, לאחר שנחשד בריגול. טוביאנסקי היה פעיל בארגון \"ההגנה\" ובמלחמת העולם השנייה שירת כקצין בחיל ההנדסה הבריטי. במלחמת העצמאות נפגעו כמה מתקנים אסטרטגיים של ייצור חשמל, ומאיר טוביאנסקי, שעבד בחברת החשמל וניהל יחסים טובים עם הבריטים, נחשד במסירת מידע לאויב. הוא הובל על ידי איסר בארי, ראש מחלקת המודיעין בצה\"ל לשדה לעריכת משפטו. בדיעבד התברר כי טוביאנסקי היה חף מפשע והוצא להורג על לא עוול בכפו. איסר בארי הועמד לדין צבאי והורשע ברצח וחריגה מסמכויותיו. הוא נידון למאסר סמלי \"מהזריחה ועד השקיעה\" וקנס של לירה אחת. בפועל, בארי קיבל חנינה מנשיא המדינה חיים ויצמן. טוביאנסקי הוא הישראלי היחידי שהוצא להורג בישראל.\nכה' בסיון ה'תרצ\"ג (1933) - נפטר יוסף (יוס'לה) רוזנבלט מגדולי החזנים האשכנזיים בכל הזמנים. במרוצת חייו הלחין ועיבד מאות יצירות, רבים מהן נחשבות לקלאסיקות בעולם החזנות. נולד ב-1882 בבילה צרקווה, כיום באוקראינה. הוא נודע כחזן בעל שם עולמי ומוקד פעילותו היה בארצות הברית ובאירופה. הוא אף תרם את קולו לפסקול הסרט \"זמר הג'אז\" של האחים וורנר מ-1927, מהסרטים הראשונים ששילבו תמונה ופסקול יחדיו.\nכה' בסיון ה'תשס\"ט (2009) - נפטר הרב מרדכי אליהו, הראשון לציון והרב הראשי לישראל (1983–1993). נולד בה'תרפ\"ט (1929) בירושלים, לאביו, רבי סלמאן אליהו, מתלמידי ה\"בן איש חי\", ואמו. בילדותו התבלט בכישרונותיו ומדי ערב היה לומד בהיכל ישיבת פורת יוסף בעיר העתיקה. לאחר קום המדינה נמנה עוד קבוצת \"ברית קנאים\", קבוצה מחתרתית ששאפה לכונן מדינת הלכה בישראל. ב-1953 נישא לצביה וב-1960 השלים את לימודיו והתמנה, מטעם מועצת הרבנות הראשית, לדיין הצעיר ביותר בארץ. ב-1983 נבחר לרב הראשי הספרדי, עם תום כהונת הרב עובדיה יוסף. לצדו כיהן הרב הראשי האשכנזי, אברהם שפירא. בפסיקותיו ההלכתיות נטה להחמיר (בניגוד לרב עובדיה יוסף) והן גובשו לסדרת שו\"ת בשם \"מאמר מרדכי\".\nכו' בסיון ה'תר\"ף (1920) - מוקם ארגון ההגנה, הארגון הצבאי המרכזי של היישוב היהודי בארץ ישראל. לאחר פירוק הגדודים העבריים שלחמו לצד הבריטים במלחמת העולם הראשונה, עלה הרעיון להקים כוח חמוש מחתרתי להגנה פסיבית על היישוב נגד מתקפות ערביות (ראו ערך פרעות תר\"פ, תרפ\"א ותרפ\"ט). בראשית דרכו, פעל ארגון ההגנה בחסות הסתדרות העובדים ולאחר מכן תחת מרות המוסדות הלאומיים. במרוצת השנים התרחב הארגון והוקמו יחידות שונות, ביניהן הפלמ\"ח (פלוגות מחץ - הכוח הצבאי המגויס), גדנ\"ע (גדודי נוער עברי) וש\"י (שירות ידיעות - מודיעין). ב-1931 פרשו כמה ממפקדי ההגנה, המזוהים עם תנועה הרוויזיוניסטית בעיקר, שדרשו פעולות נחרצות נגד הערבים, והקימו את האצ\"ל (ב-1940 הוקם הלח\"י, על אותו משקל, אולם עיקר מאבקם היה נגד הבריטים). במלחמת העולם השנייה לחמו כוחות ההגנה לצד הבריטים. כמו כן פעלה ההגנה למאמץ ההתיישבות וההעפלה. לאחר המלחמה, פעלו ההגנה, אצ\"ל ולח\"י תחת מסגרת-גג שנקראה \"תנועת המרי העברי\", נגד הבריטים. עם הקמת המדינה הפך הארגון לצה\"ל והשתלבו בו אנשי אצ\"ל ולח\"י.\nכח' בסיון ה'תש\"ז (1947) - אבשלום חביב, יעקב וייס ומאיר נקר, מעולי הגרדום, נידונים למוות בתלייה. הנזכרים לעיל הואשמו בפריצה לכלא עכו ב-4 במאי, במהלכה נמלטו 41 אסירי אצ\"ל ולח\"י, מתוכם 6 נהרגו ו-8 נוספים נתפסו והוחזרו לכלא. בפעולת הפריצה נמנו 34 לוחמים, מתוכם 3 נהרגו, כולל מפקד הפעולה דב כהן. בנקמה לגזר הדין של השלושה, חטפו כוחות אצ\"ל 2 סרג'נטים (מקביל לדרגת סמל) בריטים ואיימו כי אם יוצאו השלושה להורג, ייתלו החיילים הבריטים. לאחר ביצוע גזר הדין נתלו 2 הסרג'נטים בחורשה בנתניה. יש אומרים כי פעולה זו זירזה במידה ניכרת את עזיבתם של הבריטים מארץ ישראל.\nכח' בסיון ה'תש\"י (1950) - מתקבלת בכנסת החלטת הררי. במגילת העצמאות נקבע כי האספה המכוננת (הכנסת הראשונה) תחוקק חוקה למדינת ישראל, אולם בעקבות חילוקי דעות שהתגלעו – בין היתר מתוך נימוק כי גלי העלייה ישנו את המאזן הדמוגרפי וכי המשפט החוקתי הבריטי, שהמשפט הישראלי בראשית דרכו התבסס עליו, אינו כולל חוקה – יזם חבר הכנסת, יזהר הררי, פשרה, לפיה לעת עתה לא תחוקק חוקה למדינת ישראל, אלא יגובשו לפרקים חוקים בעלי מעמד חוקתי, הקרויים \"חוקי יסוד\". ב-1958 נקבע חוק יסוד: הכנסת, חוק היסוד הראשון שחוקק במדינת ישראל. עד היום חוקקו בישראל 13 חוקי יסוד, האחרון, חוק יסוד: ישראל - מדינת הלאום של העם היהודי, חוקק ב-2018.\nכט' בסיון ה'תרפ\"ד (1924) - יעקב ישראל דה האן נרצח. דה האן, סופר ועיתונאי הולנדי, נולד למשפחה דתייה, אך בצעירותו עזב את הדת ודגל במרקסיזם. בהמשך, נשבה בקסמה של התנועה הציונית, חזר בתשובה ועלה לארץ ישראל ב-1919. דה האן שאף להשתלב במוסדות הציוניים, אולם משהשיבו את פניו ריקם, הצטרף לחוג הקנאים של העדה החרדית האנטי-ציונית ופעל נגדם. הוא עמד לימין הרב יוסף זוננפלד. בו ביום, כשיצא מבית הכנסת, נורו לעברו שלוש יריות והרוצח נמלט. זהות הרוצח לא נתבררה והמשטרה הבריטית סגרה את תיק הרצח מחוסר ראיות. החשוד העיקרי ברצח היה אברהם תהומי, פעיל הגנה וממקימי האצ\"ל. אישים נוספים ששמם נקשר ברצח הם יוסף הכט ויצחק בן צבי, לימים נשיא מדינת ישראל. הירצחו נחשב לרצח הפוליטי הראשון בארץ ישראל בעת החדשה.\nב' בתמוז ה'תש\"ח (1948) - מלחמת העצמאות: מתחיל מבצע דקל, לשחרור הגליל התחתון, במסגרתו כבש צה''ל שטחים נרחבים בגליל. את המערכה הובילה חטיבה 7 של צה\"ל, בפיקודו של בן דונקלמן, ונערך בעיקר נגד צבא ההצלה בפיקודו של פאוזי קאוקג'י. הוא נמשך 11 ימים, במהלך \"קרבות עשרת הימים\" שנערכו בין ההפוגה הראשונה (שנמשכה כחודש) להפוגה השנייה (שנמשכה כ-3 חודשים) במלחמה. בקרבות עשרת הימים נערך גם מבצע ברוש (משמר עמק הירדן) ומבצע דני (לוד, רמלה ופרוזדור ירושלים). בסיום המבצע החזיקה ישראל בכל שטחי הגליל העליון ומרבית הגליל התחתון ונכבשו בו ערים מרכזיות, בהן נצרת ושפרעם.\nב' בתמוז ה'תשי\"ט (1959) - מתחילים אירועי ואדי סאליב – סדרת מחאות ומהומות בעקבות האפליה והקיפוח על רקע עדתי כלפי עולי צפון אפריקה, וקריאת תיגר על ממסד מפא\"י – שנערכו בשכונת ואדי סאליב בחיפה. האירועים הוצתו בעקבות שמועות שווא על אדם שנורה למוות בבית קפה על ידי המשטרה, בעקבות קטטה מקומית שפרצה שם. למחרת הפגינו מאות מול תחנת המשטרה והמחאה נפוצה כאש בשדה קוצים לשאר חלקי הארץ; בעקבות האירועים הוקמה ועדת עציוני לחקירת נסיבות האירועים. אירועי ואדי סאליב נחשבים לאבן דרך ונקודת מפנה בשד העדתי בישראל.\nג' בתמוז ה'תשמ\"ט (1989) - הפיגוע בקו 405: מחבל פלסטיני מרצועת עזה מתנפל על נהג אוטובוס אגד בקו 405 מתל אביב לירושלים באזור נווה אילן ומדרדרו לתהום. בפיגוע נהרגו 16 ונפצעו 27. עד להגעת צוותי מגן דוד אדום, נרתמו תלמידי ישיבה מקריית יערים בפינוי הפצועים. האירוע נחשב לפיגוע ההתאבדות הראשון בישראל. המחבל נידון ל-16 מאסרי עולם, אולם שוחרר ב-2011 בעסקת שליט.\nג' בתמוז ה'תשנ\"ד (1994) - נפטר הרב מנחם מענדל שניאורסון - הרבי מליובאוויטש - האדמו\"ר השביעי לשושלת חסידות חב\"ד ומגדולי המשפיעים היהודים בעת החדשה. נולד ב-1902 במיקולאייב, האימפריה הרוסית (כיום באוקראינה) להוריו, הרב לוי יצחק, ששימש כרב עיר, וחנה. בילדותו ונערותו, למד מפי מלמדים פרטיים. מאוחר יותר השלים את לימודי הבגרות, בהכוונת ישראל בר-יהודה, לימים חבר כנסת. ב-1929 נישא לחיה מושקא, בת הרב יוסף יצחק שניאורסון, האדמו\"ר השישי בשושלת חב\"ד, והם התגוררו בברלין, שם למד באוניברסיטת ברלין כשומע חופשי. לאחר מכן עבר הזוג לפריז, שם השלים את לימודיו בבית הספר המיוחד לעבודות ציבוריות, וקיבל תואר בהנדסת חשמל. בהמשך נרשם לסורבון. בד בבד, שקד בלימוד התורה, ניהל קשרים עם רבני ישראל (בהם הרוגוצ'ובר) ורשם חידושי תורה (שגובשו מאוחר יותר לסדרת ספרים בשם \"רשימות\"). ב-1941 נמלטו מאימת הנאצים לניו יורק והשתכנו שם. בניו יורק מונה על ידי חותנו לנהל את מוסדות חב\"ד, לצד משרה בצי האמריקני. ב-1951 הוכתר כאדמו\"ר השביעי של חב\"ד. במרוצת הזמן הרחיב את פעילות חב\"ד והקים את מפעל בתי חב\"ד, שתפס תאוצה בשנות ה-80. על אף שלא ביקר בישראל, נועד עם פוליטיקאים ישראלים רבים בסוגיות ביטחוניות ומדיניות. בתחילת שנות ה-90 גבר הלהט המשיחי בקרב חסידיו וב-1992, חווה אירוע מוחי, ממנו לא התאושש עד לפטירתו ב-94'. בערוב ימיו, התפתח סביב דמותו פולמוס המשיחיות בקרב חסידיו. לאחר פטירתו, החליט הקונגרס האמריקאי להעניק לו את מדליית הזהב של הקונגרס, אחד משני העיטורים הגבוהים ביותר שניתנים לאזרחים בארצות הברית. משנת הרבי מתועדת במאות ספרים שיצאו לאור במהלך השנים, בהם ליקוטי שיחות, אגרות קודש ותורת מנחם - התוועדויות.\nד' בתמוז ד'תתקל\"א (1171) - נפטר רבי יעקב מאיר, הנודע בכינויו רבנו תם, מבעלי התוספות. נולד ברמרו, צרפת. בצעירותו, למד אצל אחיו הגדול, רבי שמואל (רשב\"ם), גם הוא מבעלי התוספות. למחייתו, התפרנס מייצור יין. מסופר כי במסע הצלב השני כמעט נהרג. רבנו תם התיידד עם גדולי ישראל, בהם ר' אברהם אבן עזרא, והיה לבעל השפעה מכריעה על יהדות אשכנז. במקביל לעמלו בתורה, רשם פיוטים ועסק בדקדוק העברי. רבנו תם הוא נכדו של רבנו שלמה יצחקי (רש\"י), מגדולי מפרשי התורה והתלמוד. מלבד פירושיו על התלמוד, כתב מספר ספרים, בהם \"ספר הישר; בין רש\"י לר\"ת קיימת מחלוקת בנוגע לסדר הפרשיות בתפילין, והלכך יש הנוהגים להניח שני זוגות תפילין ביום.\nד' בתמוז ה'תש\"א (1941) - השואה: מתחילים אירועי הדמים בעיר יאשי שברומניה, בהנחיית מנהיג רומניה, יון אנטונסקו, בעל בריתו של היטלר. בפוגרום, שנמשך שלושה ימים, נטבחו למעלה מ-13,000 יהודים (אומדנים מסוימים מצביעים על למעלה מ-14,000 ואף 20,000), כשליש מתושבי העיר היהודים, ונשדדו ונבזזו חנויות רבות של יהודים. הוא החל ימים ספורים לאחר פלישת הנאצים לברית המועצות, במסגרת מבצע ברברוסה, כאשר כוחות גרמנים רבים היו פרוסים באזור יאשי ונטל בו חלק \"דרג אופרטיבי מס' 1\", יחידה צבאית שפעלה במסגרת השירות החשאי הרומני. אלה מאירועי הדמים החמורים שחוותה יהדות מזרח אירופה.\nה' בתמוז ה'תש\"ו (1946) - פוגרום קיילצה: 47 יהודים שורדי השואה נרצחים בקיילצה, פולין, בעקבות עלילת דם שנפוצה בעיר, לפיה, יהודים הרגו ילד נוצרי כדי להשתמש בדמו לשם אפיית מצות. שארית הפליטה היהודית הועברה ללודז'. את מסע ההלוויה הובילה יחידה מיוחדת של צבא פולין, ועשרות פולנים נידונו בבית דין צבאי, על 9 מהם נגזר עונש מוות.\nו' בתמוז ה'תשי\"ג (1953) - יוליוס ואתל רוזנברג, זוג יהודי אמריקאי, מוצאים להורג בעוון ריגול לטובת ברית המועצות. הזוג רוזנברג הכיר בתנועת הנוער הקומוניסטית בארצות הברית ונישאו ב-1940. יליוס עבד בחיל הקשר האמריקאי, אך משנודע כי היה חבר בתנועה הקומוניסטית, פוטר מתפקידו. כמה שנים לפני כן, גיוס על ידי הנקוו\"ד, שירות הביון של ברית המועצות, ושימש כמרגל. במרוצת הזמן, מסרו הזוג רוזנברג אלפי מסמכים סודיים לברית המועצות וסיפקו מידע על פצצת האטום. ב-1950 נחשף הזוג, עם מעורבים נוספים, וב-1951 נשפטו. אישי ציבור מוכרים הביעו חמלה עם הזוג וטענו כי העונש שנגזר עליהם אינו פרופורציונלי. מסמכים שנחשפו בשנות ה-90 מטילים את מעורבותה של אתל בספק.\nו' בתמוז ה'תשל\"ו (1976) - מבצע יונתן (\"כדור הרעם\" במקור): במבצע נועז, פושטים כוחות סיירת מטכ\"ל של צה\"ל על נמל התעופה באנטבה, אוגנדה, ומשחררים 105 בני ערובה יהודים, ישראלים וצוות המטוס, של אייר פראנס (טיסה 139), שנחטף בדרכו מנתב\"ג לפריז. המטוס נחטף לאחר נחיתת ביניים באתונה והוסט לאפריקה. לפני הגעתו לאנטבה, עצר בבנגאזי לזמן מה. עם הנחיתה באנטבה, שוחררו יתר הנוסעים הלא-יהודים. 7 החוטפים, בתמיכת שליט אוגנדה, אידי אמין, דרשו לשחרר 53 אסירים תמורת החטופים. ישראל החלה במשא ומתן, כשבד בבד רקחה מבצע הצלה. על המבצע פיקד דן שומרון, לימים הרמטכ\"ל. על כוח הפריצה פיקד יונתן (יוני) נתניהו, מפקד סיירת מטכ\"ל, שנפל במבצע. לפני עזיבתם, השמיד הכוח 8 מטוסי מיג שחנו בטרמינל. 3 בני ערובה נהרגו במהלך הפשיטה. המבצע זכה לתגובות בינלאומיות נלהבות.\nז' בתמוז ה'תשכ\"ה (1965) - נפטר משה שרת, ראש הממשלה השני של ישראל. נולד ב-1894 בחרסון. ב-1906 עלה עם משפחתו לארץ ישראל. במלחמת העולם הראשונה התגייס לצבא העות'מאני ושרת כקצין. ב-1920 יצא ללונדון וסיים שם לימודי תואר ראשון בכלכלה מדינית. ב-1933, לאחר רצח ארלוזורוב, התמנה לראש המחלקה המדינית של הסוכנות היהודית, בתפקיד זה כיהן עד 1948. עם הקמת המדינה, כיהן כשר החוץ בממשלת בן גוריון. שרת נקט בקו מדיני מתון מתוך דוקטרינה של הבלגה, דבר שהעיב על היחסים בינו לבין בן גוריון. ב-1954, לאחר פרישתו של האחרון, התמנה לראש הממשלה, עד 1956, כשהקים ב\"ג ממשלה חדשה. בעקבות חילוקי דעות סביב מבצע קדש, נאלץ שרת להתפטר מהממשלה. ב-1961 נבחר ליו\"ר ההסתדרות הציונית העולמית, בתפקיד זה כיהן עד מותו.\nז' בתמוז ה'תשנ\"ב (1992) - נפטר הרב שמחה בונים אלתר – ה\"לב שמחה\" (על שם ספרו) – האדמו\"ר ה-6 בשושולת חסידות גור. נולד בה'תרנ\"ח (1898) בפולין. בגיל 17 נישא. במרוצת הזמן, ביקר מספר פעמים בארץ ישראל. לאחר מלחמת העולם השנייה, התגורר עם משפחתו בצרפת ואחר כך התיישב באנטוורפן, בלגיה ועסק בנדל\"ן. ב-1977, לאחר פטירת אחיו, ר' אברהם מרדכי אלתר, הוכתר כאדמו\"ר. במשך השנים, הנהיג תקנות מחמירות לחסידיו והוביל מאבקים חרדיים שונים.\nשורשי חסידות גור נעוצים בחסידות פשיסחא – שהוקמה בידי ר' יעקב יצחק, תלמיד החוזה מלובלין. לאחר פטירתו של הראשון, התגברה המחלוקת בין תלמידי החוזה מלובלין - ר' יעקב יצחק הורביץ - לבין חסידי פשיסחא, בנוגע להליכות ושיטת הלימוד המקובלת. ר' מנחם מנדל מקוצק, מייסד חסידות קוצק ומתלמידי החוזה מלובלין, תבע מחסידיו קו קיצוני יותר והתנזרות מוחלטת מחומריות. לאחר פטירתו, מינו רוב חסידיו את ר' יצחק מאיר אלתר, מתומכי הרבי מקוצק, לאדמו\"ר, והוא ייסד את חסידות גור בעיירה גורה קלוואריה (משם נגזר המינוח \"גור\"), בתחילת המאה ה-19. בתמונה: בית המדרש הראשי של חסידות גור בפולין (אינו פעיל כיום).\nז' בתמוז ה'תשס\"ד (2004) - נפטרה נעמי שמר, משוררת ומוזיקאית ישראלית. נולדה ב-1930 בקיבוץ קבוצת כנרת. מגיל צעיר גילתה עניין במוזיקה ולמדה פסנתר. ב-1951 סיימה את לימודיה באקדמיה למוזיקה בירושלים והחלה לכתוב שירי ילדים. את שירותה הצבאי עשתה בלהקת הנח\"ל. לאחר שחרורה החלה לכתוב שירים ללהקות שונות, בהן \"בצל ירוק\" ולהקות צבאיות. ב-1967 נתבקשה לכתוב שיר לפסטיבל הזמר שייערך ביום העצמאות, בדיעבד, הפך השיר למזוהה עם שחרור ירושלים במלחמת ששת הימים, שפרצה פחות מחודש לאחר מכן. נעמי אף הוסיפה לשיר בית נוסף בעקבות הניצחון. ב-1983 זכתה בפרס ישראל לזמר העברי. נעמי שמר נחשבת לפזמונאית הלאומיות, ורבים משיריה הפכו לנכסי צאן ברזל בזמר העברי, בהם: \"ירושלים של זהב\", \"חורשת האקליפטוס\", \"שירת העשבים\" ו\"לו יהי\".\nט' בתמוז ה'ד' (1244) או ה'ב' (1242) - שריפת התלמוד בפריז: בעקבות ויכוח פריז שהתנהל בין חכמי יהדות צרפת, בראשות רבי יחיאל מפריז, לבין חכמים נוצרים, שנסוב סביב יחס התלמוד לגויים, מובאים ספרי התלמוד, על גבי כרכרות, לכיכר העירייה של פריז (כיום) ונשרפים. על שריפה המונית זו חיבר המהר\"ם מרוטנבורג את הקינה \"שאלי שרופה באש\" – הכוללת את השורה ”עוד תגזרי לשרוף דת אש וחקים ולכן אשרי שישלם לך כגמוליך“ – הנאמרת בתשעה באב. בשנים הבאות אירעו עוד שרפות מרוכזות של התלמוד, בהן, שרפת התלמוד באיטליה ובפולין. יצוין כי במשנה (תענית, פרק ד', משנה ו') מובא שבשבעה עשר בתמוז ”שרף אפוסטמוס את התורה“.\nט' בתמוז ה'תשנ\"ז (1997) - אסון המכביה: בהתמוטטות גשר מעל נהר הירקון בעת טקס הפתיחה של המכביה ה-15, נהרגים ארבעה ספורטאים אוסטרלים ונפצעים 69. בעת הנפילה, השתחררו חומרים רעילים מתחתית הנהר, שהחמירו את מצב הפצועים. בעקבות האסון, חמישה הורשעו בגרימת מוות ברשלנות, ונוצר מתח בין יהדות אוסטרליה למדינת ישראל. חרף האסון, טקס הפתיחה נמשך במתכונת מקוצרת.\nי' בתמוז ה'תשע\"ב (2012) - נפטר יצחק שמיר, ראש ממשלת ישראל השביעי. נולד ב-1915 ברוז'ינוי, כיום בבלארוס. בצעירותו, הצטרף לתנועת בית\"ר ולמד משפטים בוורשה. ב-1935 עלה לארץ ישראל והצטרף לשורות האצ\"ל, ולאחר מכן ללח\"י. בהמשך, כיהן כמפקד הלח\"י ונעצר לא פעם על ידי הבריטים. ב-1946 נמלט ממחנה המעצר באריתריאה, יחד עם גולי אצ\"ל ולח\"י נוספים, לג'יבוטי (שהייתה תחת שליטת צרפת), וב-1948, ערב קום המדינה, חזר ארצה. ב-1955 גויס על ידי איסר הראל למוסד ומילא שם תפקידים חשובים. ב-1970 הצטרף למפלגת החרות (שהתמזגה מאוחר יותר עם גח\"ל והליכוד) וכיהן כיו\"ר הכנסת וכשר החוץ בממשלת מנחם בגין (1977–1983). עם התפטרותו של בגין מונה לראש הממשלה וב-1984–1988 קיים ממשלת אחדות עם שמעון פרס מהמערך. ב-1990, בעקבות כישלונו של פרס להקים ממשלה צרה עם החרדים (מהלך שכונה \"התרגיל המסריח\"), הקים ממשלה חדשה. ב-1991, במלחמת המפרץ, נקט בקו מדיני מבליג, והשתתף בוועידת מדריד (לקידום תהליך השלום בין ישראל לפלסטינים ולמדינות ערב), על אף התנגדותו לאירוע. ב-1996 פרש מהכנסת.\nיז' בתמוז ג'תתכ\"ח (70 לספירה) - לאחר מצור ממושך, ובשיאו של המרד הגדול, מבקיעים הרומאים, בהנהגת המצביא טיטוס, והקיסר אספסיאנוס, את חומות העיר ירושלים ומפילים בה חללים רבים. על פי התלמוד הירושלמי, ביום זה הובקעו גם חומות ירושלים בימי בית ראשון על ידי הבבלים (586 לפנה\"ס או 422 לפנה\"ס על פי הכרונולוגיה המקראית; וראו ערך \"השנים החסרות\"), בהנהגת נבוכדנצאר השני (בשונה מהמסופר בספר ירמיהו, הגורס ט' בתמוז). בתמונה: חורבן ירושלים - ציור של דייוויד רוברטס, 1850.\nיח' בתמוז ה'תשנ\"ה (1995) - נפטר מרדכי (מוטה) גור, הרמטכ\"ל העשירי של צה\"ל וחבר הכנסת. נולד ב-1930 בירושלים. לפני קום המדינה התנדב לפלמ\"ח. לאחר מכן פיקד על מספר פעולות תגמול שבוצעו בראשית שנות המדינה. ב-1966 מונה למפקד חטיבה 55 של הצנחנים, שכבשה, במלחמת ששת הימים, את ירושלים המזרחית ופרצה לעיר העתיקה. קריאתו של גור \"הר הבית בידינו\" נחרתה זה מכבר בזיכרון הקולקטיבי הישראלי של המלחמה. ב-1969 מונה לאלוף פיקוד הצפון, וב-1974, בעקבות פרישתו של הרמטכ\"ל הקודם דוד אלעזר, לאחר פרסום מסקנות ועדת אגרנט, מונה גור לרמטכ\"ל במקומו. ב-1981, כמה שנים לאחר פרישתו מצה\"ל, נבחר לכנסת מטעם המערך, וכיהן, תחת ממשלת שמעון פרס כשר הבריאות (1984–1986). בערוב ימיו אובחן כחולה סופני, ומשכך, ב-1995 התאבד ביריית אקדח.\nכ' בתמוז ה'תרס\"ד (1904) - נפטר בנימין זאב הרצל, עיתונאי ומשפטן, \"חוזה מדינת היהודים\". נולד ב-1860 בבודפשט; ב-1878 עבר עם משפחתו והשלים שם לימודי משפטים. ב-1889 נישא ליוליה נשאואר. הרצל שימש ככתב העיתון Neue Freie Presse וסקר את פרשת אלפרד דרייפוס. הוא פעל במישור הדיפלומטי, אל מול השלטון העות'מאני, להשגת זיכיון על אדמות ארץ ישראל למען התיישבות יהודים. ב-1897 כינס את הקונגרס הציוני הראשון בבזל והציג את מטרת התנועה הציונית, לפיה יש \"להקים בית לאומי עבור העם היהודי בארץ ישראל, שיהיה מובטח על בסיס משפט העמים\". ב-1903, בקונגרס הציוני השישי, הציג את תוכנית אוגנדה (מתן אוטונומיה יהודית מידי הבריטים על אדמות מזרח אפריקה), שעוררה פולמוס ותסיסה בקרב אנשי הוועד הפועל הציוני. לאחר מכן הרצל הדגיש כי הוא שומר אמונים למדינה שתוקם בארץ ישראל. הרצל נחשב למייסד הציונות כתנועה לאומית, ואת חזונו למדינת היהודים שרטט בספרו המפורסם \"מדינת היהודים\". כמו כן, כתב את \"אלטנוילנד\", המהווה רומן אוטופי הפורס את חזונו של הרצל. ב-1949 הועלו עצמותיו מווינה לירושלים, לבקשתו.\nכא' בתמוז ה'תרצ\"ד (1934) - נפטר חיים נחמן ביאליק, מגדולי המשוררים העבריים, שזכה בתואר \"המשורר הלאומי\". נולד ב-1873 בראדי (כיום באוקראינה). בילדותו התייתם מאביו ועבר לגור אצל סביו האדוק בז'יטומיר, שם ספג ערכים יהודים שהשפיעו במידה רבה על יצירותיו. בגיל 17 הלך ללמוד בישיבת וולוז'ין, אולם כעבור זמן מה עזב ועבר לאודסה, שם למד ספרות והתוודע ל\"אחד העם\". שירו הראשון, \"אל הציפור\", יצא ב-1892. ב-1893, לאחר מות סביו, נישא למניה אוורבוך. ב-1900 מצא באודסה משרת הוראה, עד 1904, כשעבר להתגורר בוורשה ושימש כעורך ספרותי. ב-1921 עזב את ברית המועצות לברלין, וב-1924 עלה לארץ ישראל והתגורר בתל אביב. הוא נפטר בווינה, מסיבוכי ניתוח. במרוצת חייו, כתב שירים ומסות רבים ואף תרגם ספרים לעברית. בין שיריו המוכרים: \"הכניסיני תחת כנפך\", \"בעיר ההרגה\" (נכתב בעקבות פרעות קישינב), \"המתמיד\" ו\"היא יושבה לחלון\".\nכא' בתמוז ה'תשל\"ג (1973) - פרשת לילהאמר: בלילהאמר, נורווגיה, סוכני מוסד הורגים בטעות צעיר מרוקאי לאחר שסברו כי הוא חסן עלי סלאמה. סלאמה היה מראשי ארגון \"ספטמבר השחור\", שהיה אחראי, בין היתר, על טבח הספורטאים הישראלים באולימפיאדת מינכן ב-1972. בעקבות הטבח, יצאה מדינת ישראל במבצע לחיסול חברי הארגון. הנוגעים בדבר נתפסו ונשפטו בפני בית דין מיוחד באוסלו אשר גרם למתיחות ביחסי ישראל–נורווגיה. כעבור 22 חודשים שוחררו כלל העצורים וב-1979 חוסל סלאמה בביירות. בתמונה: העיירה לילהאמר.\nכא' בתמוז ה'תשנ\"ה (1995) - שלושה בני נוער נמחצים למוות במהלך \"פסטיבל ערד\". באותו ערב התקיים מופע הפרידה של להקת משינה. אלפי בני נוער צבאו על שער הכניסה ונוצרה תדחוקת קהל. מרוב לחץ, קרס אחד השערים בהופעות החימום ונהרגו שני צעירים ועוד אחת נפצעה אנושות, ומתה כעבור זמן מה בבית החולים. ממצאי ועדת החקירה שהוקמה בעקבות האסון גילו שורה של מחדלים וכשלי בנייה חמורים ומארגני הפסטיבל נקנסו ונעצרו.\nכג' בתמוז ה'תש\"ו (1946) - פיצוץ מלון המלך דוד: במסגרת תנועת המרי העברי, וכפעולת תגמול נגד \"השבת השחורה\", מפוצץ האצ\"ל, בתמיכת מפקדת ההגנה, את האגף הדרומי של מלון המלך דוד בירושלים (נחנך ב-1931), מעוז המפקדה הצבאית של המנדט הבריטי בארץ ישראל. בפיצוץ נהרגו 91, מתוכם כ-15 יהודים. הפעולה גררה גינויים מרחבי העולם, כולל גינוי מפי נציגי היישוב היהודי. מאז הפיגוע, הוסיפו הבריטים להקשיח את עמדתם כלפי היישוב היהודי, בראשות חיים ויצמן, ויש אומרים כי הוא זירז את עזיבת הבריטים מארץ ישראל. בדיעבד, התברר כי היינריך ריינהולד, סוכן שתול של הבולשת הבריטית בשורות האצ\"ל, ידע על הפעולה אולם ככל הנראה לא הספיק להתריע על כך בפני הבריטים.\nכג' בתמוז ה'תש\"ט (1949) - עם חתימת הסכם שביתת הנשק האחרון, עם סוריה, תמה רשמית מלחמת העצמאות. השיחות על שביתת הנשק, שנודעו כ\"הסכמי רודוס\", נפתחו ב-12 בינואר באי רודוס שביוון, בחסות ראלף באנץ', מתווך המשא־ומתן מטעם האו\"ם. תחילה, נחתם הסכם עם מצרים, לאחר מכן לבנון, ירדן וסוריה. עיראק, שנטלה חלק בלחימה, לא השתתפה בשיחות, הווה אומר שבאופן רשמי, עיראק עודנה במצב מלחמה עם ישראל. בעיצומן של השיחות, כבש צה''ל את הערבה ואילת במסגרת מבצע עובדה.\nכה' בתמוז ה'תשל\"ה (1975) - בפיצוץ מקרר תופת בכיכר ציון בירושלים נרצחים 15 בני אדם ונפצעים 60. בשעות הבוקר הובא המקרר על ידי מחבל פלסטיני והתפוצץ סביבות השעה 10. לפני כן, עוד הספיקו לדווח עליו כחפץ חשוד. רק כעבור למעלה משנה נתפסה חוליית הטרור – שהוקמה ביוזמת אחמד ג'בארה – שתכננה את הפיגוע. את האחריות על הפיגוע נטל ארגון הפת\"ח.\nכה' בתמוז ה'תשנ\"ז (1997) - בפיגוע התאבדות כפול בשוק מחנה יהודה נרצחים 16 בני אדם ונפצעים 178. הפיגוע אירע בסביבות השעה 13, ובוצע על ידי שני מחבלים מתאבדים פלסטינים מטעם חמאס, שהתחפשו לחרדים. בעקבות פיגוע נוסף שאירע בשוק כחודש לאחר מכן, הוחלט על חיסולם של מנהיגי חמאס, ח'אלד משעל ומוסא אבו מרזוק (שבוטל בשל היותו אזרח אמריקאי ומתוך חשש כי חיסולו יפגע ביחסי ארצות הברית–ישראל). ניסיון ההתנקשות (החובבני משהו) בח'אלד משעל בירדן נכשל וגרם למשבר דיפלומטי בין ישראל לירדן. ישראל נאלצה לשחרר את מנהיג החמאס אחמד יאסין ועוד כ-70 אסירים פלסטינים נוספים, תמורת ארבעת סוכני המוסד שנעצרו לאחר שנחשפו.\nכו' בתמוז ה'תש\"ל (1970) - מבצע רימון 20: במסגרת מלחמת ההתשה מצליח חיל האוויר הישראלי להפיל חמישה מטוסי מיג-21 של חיל האוויר הסובייטי, שנרתם לטובת מצרים. לאחר ביקורו במוסקבה, ביקש נאצר, נשיא מצרים, מהרוסים סיוע למאמץ המלחמתי מול העליונות האווירית של ישראל. במארב מתוחכם, בליווי וכיסוי מודיעיני, השתתפו 16 מטוסי מיראז' של חיל האוויר הישראלי והתחזו למטוסי תקיפה. המטוסים טסו צמוד אחד לשני, ברביעיות, על מנת לבלבל את המצרים והסובייטים, כדי שיוצגו על המכ\"ם כמטוס אחד. בקרב האווירי השתתפו בפועל 14 מטוסים ישראליים ו-24 מטוסים מצריים–סובייטיים. 3 טייסים סובייטים נהרגו בהתקפה ומטוס ישראלי אחד נפגע בזנבו אך הצליח לנחות בשלום. בתמונה: זוג מטוסי מיג-21.\nכח' בתמוז ה'תשי\"ד (1954) - בטקס זיכרון לצנחני היישוב, שנערך בקיבוץ מעגן, מתרסק מטוס קל מסוג פייפר קב. באסון נהרגו 17 ונפצעו 25. באירוע נכח ראש ממשלת ישראל דאז, משה שרת, וקהל של כ-2,500 איש. מארגני הטקס תכננו מטס של חיל האוויר בעיצומו של הטקס, אך משנענו בסירוב, הציע קלוב התעופה את שירותיו. התכנון היה להצניח אגרת ברכה מהנשיא שלא השתתף בטקס, מאחד המטוסים, כדי שתיקרא במהלך הטקס. האיגרת נתקעה בגלגל השמאלי של המטוס, והטייס, שניסה לחלץ את האיגרת, איבד שליטה על המטוס והתרסק אל תוך הקהל. לאחר מעשה, התברר כי את האיגרת ניסח קלוב התעופה ולא הנשיא.\nכח' בתמוז ה'תשס\"ה (2005) - עדן נתן-זאדה, חייל עריק בצה''ל, פותח באש עם נשקו לעבר נוסעים ערביים באוטובוס קו 165 בשפרעם ורוצח ארבעה. החייל ערק מצה\"ל בעקבות התנגדותו לתוכנית ההתנתקות. לאחר שרוקן מחסנית, הצליחו נוסעי האוטובוס להשתלט עליו ולאזוק אותו. עם תום הפיגוע, התפתחו מהומות ענק שיצאו מכלל שליטת כוחות הביטחון, והיורה נהרג בלינץ' שביצעו בו מתפרעים. נעצרו שבעה פורעים חשודים בלינץ', על שישה מהם נגזרו עונשי מאסר בפועל.\nכח' בתמוז ה'תשע\"ב (2012) - נפטר הרב יוסף שלום אלישיב, מנהיג הציבור הליטאי. נולד בה'תר\"ע (1910) בשיאוליאי, ליטא, כבן יחיד. ב-1924 עלה עם משפחתו לארץ ישראל והשתקע בשכונת מאה שערים בירושלים. הוא למד תורה באופן עצמאי בבתי מדרש. ב-1930 נישא, בשידוכו של הרב קוק, לשיינה, בתו של הרב אריה לוין. לאחר מכן כיהן כרב בבתי מדרש שונים בירושלים. ב-1950 מונה לדיין בבית הדין הרבני הגדול (ממנו פרש לאחר זמן מה). עם הזמן, התבסס כ\"פוסק הדור\" ולסמכות העליונה של מפלגת דגל התורה שהקים הרב שך. הרב אלישיב היה אוטודידקט מובהק. הוא לא הרבה להופיע בציבור והעדיף להסתגר. את מרב זמנו הקדיש ללימוד התורה. בתו של הרב אלישיב, בת שבע, נישאה לרב חיים קנייבסקי.\nכט' בתמוז ד'תתס\"ה (1105) - נפטר רש\"י – רבנו שלמה יצחקי – גדול מפרשני התנ\"ך והתלמוד. נולד בטרואה (טרויש), צרפת. בצעירותו למד תודה ככל הנראה מפי אביו. בצעירותו נסע ללמוד בישיבה במגנצא שבגרמניה, בה לימד רבנו גרשום. עם חזרתו לצרפת, השתלב בחיי הקהילה היהודית ומונה לדיין ופוסק הלכה. על פי השמועות, למחייתו, התפרנס מגידול כרמים. במרוצת הזמן, התבסס מעמדו של רש\"י, ושאלות רבות הופנו אליו מרחבי צרפת. את פירושיו הראשונים ליקט בחוברות שכונו \"קונטרסים\" (בעלי התוספות אף מכנים את פירושו \"פירוש הקונטרס\"); הוא אף רשם פיוטים. לאחר פטירתו נקבר, על פי המסורת, בטרויש. לרש\"י היו שלוש בנות, ועל פי האגדה הן היו מניחות תפילין. לעיתים, מפשט רש\"י את פירושיו בשילוב מילים/משפטים בצרפתית עתיקה (השפה השלטת בצרפת של אותה תקופה) בתעתיק לעברית. בהיעדר כללי הגייה של צרפתית עתיקה, שיטה זו מעניקה לבלשנים הצצה לפונטיקה של הצרפתית של אותם זמנים. אגב, כתב רש\"י (או גופן רש\"י) הומצא במאה ה-15, ואין כל קשר אליו מלבד העובדה ש\"פירוש רש\"י לתורה\" הודפס לראשונה בגופן זה.\nכט' בתמוז ה'ת\"ש (1940) - נפטר זאב ז'בוטינסקי, מנהיג ציוני, ראש תנועת בית\"ר, וממכונני הציונות הריוויזיניסטית. נולד ב-1880 באודסה (כיום באוקראינה). בילדותו, למד בבית ספר רוסי, לצד לימודים פרטיים בעברית. הוא ניחן בכישרון כתיבה מזהיר והיה מלומד בשפות רבות, ובמרוצת חייו כתב ספרים שירים. ב-1903 הצטרף להסתדרות הציונית. במלחמת העולם הראשונה, הקים יחד עם יוסף טרומפלדור את הגדודים העבריים, שלחמו לצד הבריטים לשחרור ארץ ישראל משלטון הטורקים. ב-1920 נאסר על ידי הבריטים, אך שוחרר כעבור זמן קצר. הוא התנגד למדיניות הפייסנית של חיים ויצמן ותבע בחינה מחדש (ריוויזיה) וקו נחרץ נגד המנדט הבריטי. הוא הקים את ברית הציונים הריוויזיניסטים (צה\"ר – שתתמזג לימים לתנועת החרות של מנחם בגין) וייסד את תנועת הנוער בית''ר. כמו כן שימש כמפקד העליון של האצ\"ל. ב-1928 עבר ז'בוטינסקי להתגורר בארץ ישראל, אך ב-1930, בעת ביקורו בלונדון, נשללה ממנו אשרת הכניסה לארץ ישראל. ב-1940 הגיע לניו יורק, שם נפטר מהתקף לב, בעת ביקור במחנה קיץ של תנועת בית''ר.\nא' באב ה'תש\"ז (1947) - אוניית המעפילים אקסודוס – יציאת אירופה תש\"ז מגיעה לחופי ארץ ישראל. מסע ההעפלה נוהל בחשאיות על ידי המוסד לעלייה ב', והאונייה – שהוחכרה לבריטניה מארצות הברית ונרכשה מידי האחרונה – נשאה על סיפונה כ-4,500 פליטים, רובם שורדי השואה, ממחנות עקורים באירופה. ב-11 ביולי הפליגה הספינה מנמל סט שבדרום צרפת. מרגע יציאתה, נערך מעקב צמוד אחר האונייה וב-18 ביולי נלכדה בידי הבריטים, שהפגיזו את הספינה. בתום מאבק שניטש באמצעות כלי נשק מאולתרים, נהרגו שלושה ונפצעו כ-10. אקסודוס עגנה בנמל חיפה, שם הועברו המעפילים לשלוש אוניות בריטיות וגורשו בחזרה לאירופה, תחילה לצרפת ואז לגרמניה. התקרית עוררה דעת קהל בעולם לתמיכה ביישוב היהודי והוקעת הבריטים.\nה' באב ה'של\"ב (1572) - נפטר רבי יצחק לוריא, המכונה \"האר”י הקדוש\", מגדולי המקובלים ומחשובי הוגי תורת הקבלה. נולד בירושלים לרבי שלמה לוריא, המיוחס לדוד המלך. בילדותו התייתם מאביו ונאלץ לנדוד עם אמו למצרים. לאחר נישואיו, נחשף לתורת הקבלה והחל לעסוק בה ולרדת לעומקה מתוך התבודדות. מסופר כי בתקופה זו זכה ל\"גילוי אליהו הנביא\". ב-1570 עלה עם משפחתו לצפת והצטרף לבית מדרשו של הרב משה קורדוברו. לאחר פטירתו, כינס סביבו תלמידים, בהם הרב חיים ויטאל, והתוודע כמקובל. לאר\"י הייתה השפעה מכרעת על עיצוב תורת הקבלה. הוא פיתח מושגי מפתח כגון \"שבירת הכלים\" ו\"תורת הצמצום\", ומשנתו נפרסה מאוחר יותר בספר \"עץ החיים\" שכתב אחד מתלמידיו, הרב חיים ויטאל. הוא אף חיבר פיוטים כגון \"אזמר בשבחין\" ו\"אסדר לסעודתא\", המושרים בחלק מהקהילות בסעודות השבת. נפטר בגיל 38 ונקבר בבית העלמין בצפת.\nה' באב ה'תשכ\"ט (1969) - מלחמת ההתשה: כוחות צה''ל פושטים על האי גרין (מבצע בולמוס 6) שבצפון מפרץ סואץ. במלחמת העולם השנייה הוקמו בונקרים על גבי האי, אשר שימשו את הבריטים בהגנה על תעלת סואץ. לאחר מספר תקריות בקו ההגנה הישראלי ופשיטה מצרית על חניון טנקים, בה נהרגו 8, החליטה ממשלת ישראל לתקוף את האי, שעל פי נתונים מודיעיניים כלל מכ\"ם בקרת אש, תותחי נ\"מ, כוחות קומנדו ומקלעים רבים. באישון לילה, פשטו כ-70 כוחות מסיירת מטכ\"ל ושייטת 13, על האי, בפיקודו של תא\"ל רפאל איתן, בפעולה שנמשכה כשעה ורבע. בלחימה, צה''ל ספג 6 הרוגים ו-11 פצועים, לאחד מהם הוענק עיטור הגבורה..בארץ, נחלקו הדעות בנוגע להכרחיות של המבצע.\nז' באב ה'תשנ\"ג (1993) - צה''ל פותח במבצע דין וחשבון נגד החזבאללה. לאחר כמה חודשי הסלמה שלוו ברצף אירועים חמורים בגבול הצפון, הורתה ממשלת ישראל לתקוף יעדי חזבאללה בלבנון. כוחות צה''ל, בהשתתפות חיל האוויר וחיל הים, פשטו על בסיסי מחבלים ותקפו כפרים בדרום לבנון, המזוהים עם חזבאללה. לאחר שבוע של לחימה, הושגה הפסקת אש, בתיווך ארצות הברית. בהתקפה, נהרגו 118 אזרחים לבנונים וחייל ישראלי אחד. בעקבות המבצע שיעים רבים מתושבי דרום לבנון נעו צפונה. ב-1996, לאחר הסלמה נוספת, יצא צה''ל למבצע ענבי זעם.\nצום תשעה באב: ביום זה אירעו מספר אירועים טרגיים שנצרבו בזיכרון הקולקטיבי היהודי. הצום מכונה בתנ\"ך \"צום החמישי\". על פי המשנה, נוסף על חורבן שני בתי המקדש, ביום זה: נגזר על דור המדבר שלא ייכנסו לארץ ישראל בעקבות חטא המרגלים; נלכדה ביתר: עיר יהודית קדומה שנפלה לידי אדריאנוס בשיא מרד בר כוכבא; נחרשה העיר [ירושלים]: לאחר כיבושה של עיר, נהגו הרומאים כאקט סמלי לחרוש מסביב לעיר שכבשו. הם ייסדו על חורבות ירושלים את העיר הרומית \"איליה קפיטלינה\" והקימו שם מקדש לאל יופיטר.\nנוסף על האירועים המוזכרים במקורות, במהלך ההיסטוריה היהודית, ביום זה אירעו אירועים טרגיים נוספים, בהם: גירוש יהודי אנגליה בהוראתו של אדוארד הראשון, מלך אנגליה (1290; טכנית, צו זה לא בוטל מעולם); גירוש יהודי צרפת בהוראת פיליפ הרביעי; תום הזמן שניתן למגורשי ספרד לעזוב את המדינה (1492; בהוראת איזבלה ופרדיננד, מלכי ספרד); תחילת \"האקציה הגדולה\": המוני יהודים מועברים מגטו ורשה למחנה טרבלינקה (1942).\nט' באב ג'של\"ח (586 לפנה\"ס על פי הכרונולוגיה במחקר ההיסטורי; 422 לפנה\"ס על פי הכרונולוגיה המקראית, וראו ערך \"השנים החסרות\") - נחרב בית המקדש הראשון על ידי נבוכדנצר השני, מלך בבל. על פי המקורות היהודיים, בית המקדש עמד על תלו במשך 410 שנים. ב-720 לפנה\"ס החריבו האשורים את ממלכת ישראל ותושביה הוגלו. ב-701 לפנה\"ס ערך סנחריב מלך אשור מסע לארץ ישראל וקרא לתושבי ירושלים להיכנע. חזקיהו מלך יהודה סירב להיכנע. בספר מלכים ב' מסופר כי מלאך ה' היכה במחנה אשור וסנחריב נאלץ להסיט את צבאו למצרים כדי לדכא מרד. בהמשך, הובסה ממלכת אשור על ידי האימפריה הנאו-בבלית. נבוכדנצר עלה על יהודה, צר על ירושלים והחריבהּ. צדקיהו המלך נמלט אך נלכד בערבות יריחו, עוור והוגלה לבבל. ביהודה מינו הבבלים את גדליה בן אחיקם לנציב יהודה, אך הוא נרצח על ידי ישמעאל בן נתניה.\nט' באב ג'תתכ\"ח (70 לספירה) - נחרב בית המקדש השני על ידי הרומאים, בהנהגת המצביא טיטוס, לימים קיסר האימפריה הרומית. לאחר 70 שנות גלות בבל, התיר כורש השני לגולי בבל לשוב לארצם ולבנות את בית המקדש. הבית השני עמד על תלו, על פי המקורות היהודיים, במשך 420 שנה, והוא שופץ והורחב על ידי הורדוס (72–4 לפנה\"ס). בשנת 63 לפנה\"ס, פלשו הרומאים, בפיקודו של פומפיאוס, לארץ ישראל, ופרסו חסותם על בית הורדוס. בשנת 66 פרץ המרד הגדול, שנמשך עד 73. טרם מינויו לקיסר רומא, פעל אספסיאנוס לדיכוי המרד. בשיא המרד, שלווה במלחמת אחים עקובה מדם, ביקעו הרומאים את חומות העיר ממערב, טבחו בתושביה היהודים והחריבו את בית המקדש. על חורבן ירושלים פיקד טיטוס בנו. הרומאים בזזו את אוצרות המקדש ובנו בכספי השלל את הקולוסיאום ברומא.\nהעשרה: השנים החסרות - בין המסורת היהודית של חז\"ל למחקר ההיסטורי שוררת עמימות המתבטאת בפער כרונולוגי של 169 שנים. פער זה משפיע על חישוב מאורעות היסטוריים ותיארוך כרוניקות של שושלות מלכים. דוגמה לכך היא חורבן בית המקדש הראשון: על פי כרונולוגיית חז\"ל, עמד בית במקדש על תלו במשך 420 שנה ונחרב בשנת 422 לפנה\"ס. מנגד, על פי הכרונולוגיה של המחקר ההיסטורי, עמד בית המקדש במשך כ-600 שנה ונחרב בשנת 587 לפנה\"ס. שנים אלו מתקזזות בשלב כלשהו בתקופת בית המקדש השני ומיישרות קו כבר בתקופת אלכסנדר מוקדון. עוד משליכות השנים החסרות על כרוניקת האימפריה הפרסית ומלכיה. לבעיה זו הוצעו מספר פתרונות אפשריים.\nי' באב ה'תשנ\"ד (1994) - 85 בני אדם נרצחים בפיגוע בבניין הקהילה היהודית בארגנטינה. הפיגוע בוצע על ידי מחבל מתאבד מטעם ארגון חזבאללה, שטען כי המתקפה בוצעה כנקמה על חיסולו של עבאס מוסאווי בידי צה''ל ב-1992. בהמשך, פרסם שירות הביטחון דוח כולל המפרט את מעורבותה של חזבאללה ואיראן במתקפה. בין היתר, פורסם כי מבצעי הפיגוע פעלו מתוך תשתית מבוססת של חזבאללה בקהילה השיעית במשולש הגבולות שבין ברזיל, ארגנטינה ופארגואי. היה זה מהפיגועים החמורים ביותר שבוצעו על אדמת ארגנטינה.\nי' באב ה'תשס\"ה (2005) - תוכנית ההתנתקות לפינוי יישובי גוש קטיף וצפון השומרון יוצאת לפועל. את המהלך יזם ראש ממשלת ישראל דאז אריאל שרון. ב-16 בפברואר 2005 אושרה תוכנית ההתנתקות בכנסת. התוכנית כללה פינוי חד צדדי של כלל יישובי גוף קטיף בחבל עזה ועוד 4 בצפון השומרון ומסירתה לידי הרשות הפלסטינית. כ-8,600 אזרחים יהודים פונו במסגרת ההתנתקות והיא עוררה שיח ציבורי שנוי במחלוקת. הצבע הכתום שהיה מזוהה עם מתנגדי ההתנתקות, הושפע מקמפיין התמיכה בויקטור יושצ'נקו, נשיא אוקראינה. התוכנית נערכה ב-6 מעגלים מרכזיים ובוצעה על ידי צה''ל והמשטרה. במהלך הפינוי נרשמו אירועים אלימים בין המפנים למפונים. ב-22 בספטמבר, עם תום פינוי בסיסי צה''ל בחבל עזה, נשלמה תוכנית ההתנתקות. על אף יישום תוכנית שיקום למפוני גוש קטיף וצפון השומרון, ועדת חקירה ממלכתית שדנה בסוגיה קבעה כי הממשלה כשלה כישלון חמור בשיקום המפונים. ב-2006 השתלטה תנועת חמאס על רצועת עזה והשליטה על תושביה את מרותה.\nיב' באב ה'תש\"ח (1948) - מועצת המדינה הזמנית מודיעה על הנפקת הלירה הישראלית, בידי בנק אנגלו-פלשתינה. עד 1927 הונהגה הלירה המצרית כהילך החוקי של המנדט הבריטי בארץ ישראל, עת הוחלפה בלירה הארץ-ישראלית (לא\"י) בידי מועצת המטבע פלשתינה (א\"י). הבנק, ששימש כמוסד הפיננסי המרכזי של היישוב היהודי בארץ ישראל, ואשר נוהל על ידי ההסתדרות הציונית, הוסב ב-1951 ל\"בנק לאומי\". באותה שנה הונפקו שטרות חדשים הנושאים את שמו של בנק לאומי. ב-1952 הונהגה הלירה הישראלית כמטבע הרשמי של מדינת ישראל. בפברואר 1980 הוחלפה הלירה בשקל. בעקבות משבר האינפלציה שפקד את הבנקים והמניות בתחילת שנות ה-80, החילה הממשלה את תוכנית ייצוב כלכלית, שבמסגרתה הונהג השקל החדש. השטר עם דיוקנו של איינשטיין הונפק בתחילת שנות ה-70.\nטו' באב ה'תרמ\"ב (1882) - נוסדת מושבת ראשון לציון, לימים עיר בישראל. ביוזמת זלמן דוד ליבונטין, נוסד ועד חלוצי יסוד המעלה בידי קבוצת עולים מהעלייה הראשונה (1883–1903), במטרה לרכוש קרקעות בארץ ישראל למען התיישבות וחקלאות. ליבונטין פנה לדודו העשיר, והלה קנה קרקעות מאדמת \"עיון קרא\". המושבה הלכה והתפתחה בעזרתו הנדיבה של הברון רוטשילד ועם הזמן נוסדו בה מוסדות חלוציים ומפעלים. במלחמת העצמאות, הפציץ חיל האוויר המצרי את ראשון לציון. בהפצצה נהרגו 25 איש. ב-1950 הוכרזה ראשון לציון כעיר וכיום היא הרביעית בגודלה בישראל. זאת ועוד, היא היישוב השני שנוסד בארץ ישראל בעת המודרנית, לאחר פתח תקווה (1878). מקור שם היישוב בספר ישעיהו: \"רִאשׁוֹן לְצִיּוֹן הִנֵּה הִנָּם וְלִירוּשָׁלַ‍ִם מְבַשֵּׂר אֶתֵּן\".\nטו' באב ה'תש\"ד (1944) - אנה פרנק ומשפחתה נתפסים בידי הגסטפאו באמסטרדם, הולנד. אנה נולדה ביוני 1929 בפרנקפורט, גרמני. בעקבות עליית הנאצים לשלטון ב-1933, עברה המשפחה לאמסטרדם, שם עסק אביה, אוטו פרנק, בתעשיית המזון. ב-1940 כבשה גרמניה את הולנד, וברקע הרוחות האנטישמיים, נאלץ אוטו למכור את מניות חברתו לחברו הקרוב יוהנס קליימן, שאף סייע לו ולמשפחתו להתחבא מפני הנאצים. המשפחה מצאה מחסה בבניין המשרדים של החברה, שנודע לימים כ\"בית אנה פרנק\". ליום הולדתה ה-13, קיבלה אנה את יומנה המפורסם והחלה לגלות כישורי כתיבה. ביומנה, מתארת אנה את חוויותיה בצל המלחמה מנקודת מבטה של נערה מתבגרת. בעזרת מלשין אלמוני, המשפחה נתפסה, נכלאה ונשלחה למחנה הריכוז ברגן-בלזן. אוטו האב שרד את השואה ועד סוף ימיו עסק בהנצחת מורשת בתו. הוא פרסם את יומנה של אנה, שזכה להצלחה מסחררת.\nטז' באב ה'תרמ\"ה (1885) - נפטר משה מונטיפיורי, פילנתרופ יהודי בריטי. נולד ב-1784 בליבורנו, איטליה. בהמשך, עבר עם משפחתו להתגורר בבריטניה. מונטיפיורי החל, עם אחיו, לסחור בשטרות ובמניות, והניב תשואה גבוהה. ב-1837 מונה ל\"שריף\" לונדון (מקביל לסגן ראש העיר). בהמשך הוכתר כאביר וזכה בתואר \"סר\". מתוקף תפקידו, פעל למען קהילות יהודיות ברחבי העולם בסיוע כספי ובשידול פוליטי לביטול גזרות, כגון עלילת דמשק. אשתו, יהודית, היה שותפה לו בפעלתנותו הציבורית. במרוצת חייו, ערך 7 ביקורים בארץ ישראל, ותמך במפעל ההתיישבות והחקלאות של היישוב הישן. ב-1860 הקים את משכנות שאננים, השכונה הראשונה בירושלים מחוץ לחומות, ובנה בקרבתה טחנת קמח. כהוקרה למאמציו הנכבדים, נקראו שכונות ורחובות בישראל על שמו. הוא נפטר בגיל 101.\nטז' באב ה'ת\"ש (1940) - לאון טרוקצי, מהפכן סובייטי יהודי, נפגע בידי מתנקש במקסיקו סיטי, בהוראתו של סטלין. נולד ב-1879 באימפריה הרוסית בשם לייב דוידוביץ', לזוג איכרים. בבית הספר התוודע למרקסיזם ונשנה בקסמו של הסוציאליזם. הוא ויתר על לימודיו באוניברסיטת אודסה לטובת פעילות מהפכנית נגד שלטון הצאר, בגינה נידון לגלות בסיביר, יחד עם אשתו. עם שחרורו, שינה את שמו ופגש את לנין בקונגרס מפלגת הסוציאל-דמוקרט הרוסית בלונדון. משהמשיך בפעילותו, הוגלה מרוסיה לכל חייו, אך הצליח לברוח מסיביר והתיישב בווינה, שם ערך את העיתון \"פראבדה\" של המפלגה הסוציאליסטית. בתחילת 1917 שב לרוסיה ועמד בראש המועצה שתכננה את מהפכת אוקטובר. לאחר מותו של לנין, עלה סטלין לשלטון ברית המועצות וריכז בידיו את מרבית הסמכויות. טרוקצי נמנה עם סייעת האופוזיציה במפלגה הקומוניסטית וחתר תחת סטלין. הוא הוגלה והגיע בסופו של דבר למקסיקו. ב-1940 התנקש בו סוכן הנ.ק.ו.ד. (המשטרה החשאית הסובייטית דאז) באמצעות גרזן קרח. למחרת מת מפצעיו.\nיז' באב ה'תרפ\"ט (1929) - ערביי ארץ ישראל פותחים בסדרת פרעות וטבח נגד היישוב, במה שנודע כ\"מאורעות תרפ\"ט\", בריכוזים יהודים כחברון וצפת. תרמו לפרוץ המאורעות מספר גורמים, אך ככלל, ניתן לקשור זאת עם פעולות בכותל המערבי שנתפסו כפרובוקטיביים והפרת הסטטוס-קוו, לצד רף הסתה גבוה מצד המופתי של ירושלים, אמין אל-חוסייני, להעלאת קרנו. נקודת השבר הסתמנה באוגוסט 1929, במהלך תפילת יום שישי במסגד אל-אקצא, שכללה דרשות לאומניות מסיתות. המון ערבי פשט על שכונות יהודיות בירושלים ועד מהרה התפשטו לריכוזים נוספים. בחברון נרצחו 67 יהודים, תוך מעשי ביזה ואונס. היישוב היהודי בחברון הוכחד. מנגד, חלק מתושביה הערבים של חברון סייעו בהצלת היהודים בהענקת מחסה למשפחות הנפרדות. בעקבות האירועים, כונסה ועדת שו שהטילה ופורסם הספר הלבן של פאספילד, שקרא לבלום את המשך ההתיישבות היהודית. בסה\"כ נרצחו 133 יהודים ונהרגו 116 ערבים, רובם משוטרים בריטים בניסיון לדכא את הפרעות.\nיז' באב ה'תש\"ף (2020) - נפטר הרב עדין אבן ישראל (שטיינזלץ), הוגה דעות וחוקר תלמוד. נולד בה'תרצ\"ז (1937) בירושלים. בנערותו, חזר בתשובה והתקרב לתנועת החסידות. במקביל ללימודיו בישיבה, למד מתמטיקה ופיזיקה באוניברסיטה העברית. בגיל 23 התמנה למנהל בית הספר הצעיר ביותר בישראל. ב-1965 הקים את המכון הישראלי לפרסומים תלמודיים, ובמשך שנים עמל על מיזם התלמוד המבואר להנגשת התלמוד, שראה אור ב-1967 ונשלם ב-2010. לצד שבחים, המיזם גרר ביקורת מפי רבנים, כגון הרב שך. במרוצת חייו, חיבר ספרי הגות וחסידות רבים והיה מרצה מבוקש במכללות ובמוסדות דתיים. בעצת רבו, הרבי מליובאוויטש, עִברת את שם משפחתו.\nכ' באב ה'תשס\"א (2001) - הפיגוע במסעדת סבארו: מחבל מתאבד מפוצץ עצמו במסעדת סבארו בירושלים. הפיגוע אירע בימי האינתיפאדה השנייה במסעדה ששכנה ליד צומת האיקסים ברחוב יפו. בפיגוע נרצחו 16 (חצי מהם ילדים) ונפצעו 140. את מטען הנפץ הטמין המחבל בגיטרה שנשא ונכנס כמה למסעדה. חמאס נטל אחריות על הפיגוע. הפעולה גררה גינויים מרחבי העולם, כולל הרשות הפלסטינית, אם כי היא לא פעלה למעצר חשודים המעורבים. בנוסף, נטלו חלק מספר גורמים נוספים בהוצאת הפיגוע לפועל, בהם המחבלת אחלאם תמימי שנמצאת ברשימת הטרוריסטים המבוקשים ביותר על ידי ה-FBI. במאי 2023 נקבע מותה של אחת הפצועות קשה ששקעה בתרדמת בעקבות הפיגוע.\nכ' באב ה'תשס\"ו (2006) - מסתיימת מלחמת לבנון השנייה. העילה לפרוץ המלחמה הייתה תקרית חטיפת החיילים אהוד גולדווסר ואלדד רגב, בידי ארגון חזבאללה, בהנהגת חסן נסראללה, אשר נהרגו בה 8 חיילים נוספים. היא נפתחה בתקיפה מסיבית של חיל האוויר (\"מבצע משקל גבולי\") על יעדים של חזבאללה, כשמנגד, האחרונה משגרת מטח רקטות לעבר יישובי הצפון. בשלב הבא, פשטו כוחות צה''ל, בהשתתפות אנשי מילואים, על כפרי דרום לבנון, בהשתלטות קרקעית נרחבת. ב-16 פגעה רקטה במוסך רכבת ישראל בחיפה ונהרגו 8 עובדים. עשרות אלפי תיירים ואזרחים נמלטו מלבנון. ב-26 ביולי השתלט צה''ל על בינת ג'בייל, שנחשב לקן הצרעות של חזבאללה, בקרב. ב-2 באוגוסט פתחה ישראל ב\"מבצע חד וחלק\", במהלכה פשטו כוחות צה''ל על בית חולים בכפר בעלבכ ששימש כמפקדת החזבאללה. ב-9 באוגוסט נהרגו 15 חיילים בחילופי אש בכפר רג'מין. ב-12 באוגוסט אישרה מועצת הביטחון של האו\"ם של החלטה 1701, שקראה להפסקת אש בין ישראל לחזבאללה ואסרה על הכנסת כלי נשק לדרום לבנו. על אף קבלת ההחלטה, המשיכה ישראל במערכה, כשב-1 באוקטובר נסוגו כוחות צה''ל כליל מדרום לבנון. המלחמה גבתה 44 אזרחים ו-121 חיילים הרוגים, בצד הישראלי, ולמעלה מ-1,000 הרוגים בצד הלבנוני. בנוסף, קרוב ל-4,000 רקטות נפלו בשטח ישראל. המלחמה גררה ביקורת רבה כלפי ממשלת ישראל. מן הראוי לציין את רועי קליין, קצין בצה\"ל שזינק על רימון בקרב בינת ג'בייל וכך הציל את חיי חייליו.\nכא' באב ה'תרע\"ח (1918) - נפטר הרב חיים סולובייצ'יק – שנודע כר' חיים מבריסק – הוגה שיטת הלימוד התורנית 'בריסק'. נולד בה'תרי\"ג (1853) בוולוז'ין לאביו, ר' יוסף דב, ששימש סגן ראש ישיבת וולוז'ין. בגיל 27, מונה ר' חיים לסגן ראש ישיבת וולוז'ין, הנצי\"ב. ב-1892 נסגרה הישיבה והוא מונה לרב העיר בבריסק (כיום ברסט שבבלארוס). נקבר בבית הקברות היהודי בוורשה. התנגד בתקיפות לציונות ולתנועת המוסר. נכדו, הרב יוסף דוב סולובייצ'יק, נחשב לאחד מגדולי ההוגים היהודים בעת המודרנית וממנהיגי הציונות הדתית. ר' חיים פיתח את שיטת בריסק בלימוד גמרא, הדוגלת בניתוח והעמקה מהותית בשורש סוגיה, מבלי להתבסס בהכרח על סימוכין ממקורות אחרים. זאת ועוד, תלמידיו פיתחו את \"חוג בריסק\", המתאפיינים בניהול אורח חיים מתוך קפידה והחמרה הלכתית.\nכא' באב ה'תשי\"ז (1957) - נפטר רבי אהרן רוקח, האדמו\"ר ה-4 של חסידות בעלז. נולד בה'תר\"ם (1880) בבלז שבאוקראינה (אז חלק מפולין). אביו, ר' יששכר דב שימש כאדמו\"ר ה-3 בשושלת. ב-1926 נפטר האחרון ור' אהרן ירש את כס המנהיגות. בגיל 14 נישא לבת דודו. ב-1939, פרוץ מלחמת העולם השנייה, כבשה גרמניה את בלז ור' אהרן נמלט עם אחיו להונגריה, ומשם, כעבור מספר חודשים, ובסיוע הסוכנות היהודית, הגיע לארץ ישראל דרך טורקיה ודמשק. כעבור חודשיים החלו הנאצים בהשמדת יהודי הונגריה. בטרם עזיבתם את המדינה, נשא אחיו של האדמו\"ר דרשה שנויה במחלוקת שעסקה בגורל הצפוי לחסידים בהונגריה. משפחתו נספתה כולה בשואה. הוא התיישב בתל אביב ופעל לשיקום החסידות לאחר השואה.\nכב' באב ה'תש\"ב (1942) - הנריק גולדשמיט – הנודע בשם העט שלו יאנוש קורצ'אק – נשלח למחנה ההשמדה בטרבלינקה. קורצ'אק היה רופא, סופר ופעיל חברתי יהודי-פולני, שנולד ב-1878 בוורשה. אביו, שלקה במחלת נפש, נפטר ב-1891. ב-1905 השלים את לימודי הרפואה שלו באוניברסיטת ורשה. במלחמת העולם הראשונה גויס לצבא הצאר ושימש כרופא. במקביל למקצועו, כתב מאמרים ודעות בעיתונים והגיש תוכנית רדיו. ב-1912 ייסד וניהל, יחד עם סטפניה וילצ'ינסקה, בית יתומים בוורשה. ב-1940 נאלצו היתומים לעבור לגטו ורשה, ועל אף שניתנה לו אפשרות להינצל, בחר יאנוש לא לעזוב את הילדים ועבר לגטו. בטרם עזיבתם לטרבלינקה, צעד יאנוש בגאון עם חניכיו לכיכר השילוחים. כמחנך, דגל בשיטת חינוך פרוגרסיבית, הדוגלת במתן הגדרה עצמית והעצמה לילד. הוא אף חיבר מספר ספרי ילדים שתורגמו לכמה שפות. לאחר מותו הוענק לו צלב אבירי מסדר תחיית פולין.\nכב' באב ה'תשס\"ג (2003) - בפיגוע התאבדות בקו 2 בירושלים נרצחים 23 ונפצעים 130. הפיגוע בוצע על ידי מחבל פלסטיני מזוהה חמאס מחברון. הוא עלה לאוטובוס מחופש לאדם חרדי ופוצץ עצמו בשכונת שמואל הנביא. ארגון חמאס נטל אחריות על הפיגוע. בעקבות המתקפה, פתח צה''ל במצוד נרחב אחר תשתית חמאס בחברון, שפעיליה נעצרו וסוכלו.\nכו' באב ה'תשל\"ט (1979) - נפטר הרב יואל טייטלבוים, האדמו\"ר מסאטמר. נולד בה'תרמ\"ז (1887) באימפריה האוסטרו-הונגרית. אביו, חנניה יום טוב ליפא טייטלבוים, שימש כאדמו\"ר חסידות סיגֵט. בגיל 17 נישא לחווה (הוא נישא בשנית לאחר פטירתה בשנות ה-30). במלחמת העולם הראשונה, עבר ר' יואל לעיר סאטו מארה (ביידיש: סאטמער), רומניה, וייסד את חצר החסידות. כעבור שנים, מונה לרבה של סאטמר. בשנות ה-30 ערך ביקור בארץ ישראל. במלחמת העולם השנייה, בעקבות \"תכתיב וינה\", העניקו הנצאים להונגריה חלק משטחה של רומניה. מתוך ניסיון להימלט מאימת הנאצים – לאחר שהראשון כשל – נבחר, יחד עם עוד רבנים, ליטול חלק ברכבת ההצלה השנויה המחלוקת של קסטנר. לאחר שהייה בשווייץ, עלה לארץ ישראל והתגורר בירושלים. לאחר מכן היגר לארצות הברית, התיישב בשכונת ויליאמסבורג, ניו יורק, ושיקם את חצר החסידות. עוד מראשית ימיה, נודע ר' יואל בהתנגדותו הקיצונית לציונות. בספרו \"ויואל משה\" מנמק מדוע הקמת מדינת ישראל מנוגדת להלכה, תוך הסתמכות על \"שלוש השבועות\".\nכח' באב ה'תרנ\"ג (1893) - נפטר הרב נפתלי צבי יהודה ברלין – הנצי\"ב מוולוז'ין – בוורשה. נולד בה'תקע\"ז (1816) במיר. בגיל 11 החל ללמוד בישיבת וולוז'ין. ב-1853 התמנה הנצי\"ב לראש ישיבת וולוז'ין תחת חתנו שנפטר בגיל צעיר. את מרבית מרצו הקדיש לטובת הישיבה, ומשנסגרה בשנת 1893, הידרדר מצב בריאותו ונפטר כעבור שנה. הוא היה פעיל בתנועת חובבי ציון ותמך בחלוציות הציונית. נישא פעמיים, בראשונה לריינה-בתיה, ובשנייה לבתו של הרב יחיאל מיכל אפשטיין\" בעל \"ערוך השולחן\". מאפיין בולט בשיטת לימודו היה התעמקות במדרשי התנאים וחיבורי הגאונים, וגיבש את הגיגיו במספר ספרים, בהם \"העמק שאלה\" ו\"העמק דבר\". על שמו נקרא קיבוץ עין הנצי\"ב. מילדיו המוכרים, הרב חיים ברלין, ראש ישיבת וולוז'ין ורבה של מוסקבה, והרב מאיר בר-אילן, ממייסדי האינצקלופדיה התלמודית.\nג' באלול ה'תרצ\"ה (1935) - נפטר הרב אברהם יצחק הכהן קוק, הרב הראשי האשכנזי הראשון בארץ ישראל ומייסד ישיבת מרכז הרב. נולד בת'רכ\"ה (1865) בלטביה. טרם עלייתו לארץ ישראל ב-1904, שימש כרב בלטביה. לאחר עלייתו, מונה לרבה של יפו והמושבות; בפרוץ מלחמת העולם הראשונה, נאלץ הרב קוק לנדוד מגרמניה לבריטניה, שם שהה תקופה ושימש כרב בקהילת מחזיקי הדת בלונדון; לאחר שובו לארץ ישראל, כיהן כרבה של ירושלים; עם הקמת הרבנות הראשית ב-1921, התמנה לרב הראשי האשכנזי לארץ ישראל, לצד הרב הראשי הספרדי, הרב יעקב מאיר. ב-1924 ייסד את ישיבת מרכז הרב בירושלים. כמבשר הציונות הדתית, הביע הרב קוק תמיכה בתנועה הציונית ובמודרניזם, מתוך תפיסה ש\"הישן יתחדש והחדש יתקדש\" (אנטיתזה לאמירתו של החתם סופר \"חדש אסור מהתורה\"). כמו כן, עמד על שאלות רבות בנוגע למצוות התלויות בארץ. משנתו הרוחנית והשקפותיו לוקטו בספרים רבים, בהם \"אורות הקודש\", \"אורות\" ו\"מאמרי הראי\"ה\".\nג' באלול ה'תשנ\"ז (1997) - אסון השייטת: 12 לוחמי שייטת 13 נופלים בפעילות מבצעית בלבנון. חודש לאחר ש\"מבצע טרף קל\" הוכתר בהצלחה, במהלכו סיכלו לוחמי סיירת גולני 7 מחבלים מארגון חזבאללה בלבנון, פשטו 16 לוחמים על חופי לבנון – במסגרת \"מבצע שירת הצפצפה\" – כדי לסכל בכיר לבנוני מארגון אמל ליד העיירה אנצריה. במהלך ההסתערות, נפגע חלק מהכוח ממטען צד ונתקל באש חיה מחזבאללה. במהלך הלילה התנהל מבצע לחילוץ הגופות והפצועים. גופתו של רס\"ל איתמר אליה נותרה בשטח, והושבה ב-1998 בתום משא ומתן לחילופי שבויים וגופות מחבלים מלבנון. ועדות חקירה שהוקמו בעקבות התקרית קבעו כי המארב שטמן חזבאללה לכוחות תוכנן מראש וכי המבצע החשאי נחשף מבעוד מועד.\nד' באלול ה'תרנ\"א (1891) - נפטר צבי גרץ, היסטוריון יהודי בולט, מחבר סדרת הספרים \"דברי ימי ישראל\", במינכן. נולד 1817 במחוז פוזן, כיום בפולין. בנעוריו, למד בישיבה, בשילוב לימודי חול באופן עצמאי. בטרם נרשם ללימודים אקדמאים (ומאחר שלא קיבל את אישור השלטונות לכך), למד אצל הרש\"ר הירש ושימש כעוזרו. הוא סיים את לימודיו באוניברסיטת ברסלאו וכתב דוקטורט בפילוסופיה. לאחר מכן ניהל שני בתי ספר יהודיים ושימש כמרצה בבית המדרש לרבנים בברסלאו. ב-1872 ביקר בארץ ישראל. השקפתו של גרץ עלתה בקנה אחד עם האסכולה הפוזיטיבית היסטורית של זכריה פרנקל, מבשר היהדות הקונסרבטיבית, ומשכך, ספג מטר ביקורות מפי רבנים אורתודוקסים. בנוסף, יצא נגד התנועה הרפורמית. גרץ עמל על כרוניקת \"דברי ימי ישראל\", המהווה סדרה בת 11 כרכים המתעדת את תולדות עם ישראל, תוך הבלטת הפן הלאומי.\nו' באלול ה'ת\"ש (1940) - מלחמת העולם השנייה: חיל האוויר האיטלקי מפציץ את תל אביב. איטליה הפשיסטית, שכרתה ברית עם גרמניה הנאצית, הפגיזה את תל אביב, שחסתה בצל המנדט הבריטי בארץ ישראל. המתקפה בוצעה על ידי מפציצים מדגם סבויה מרקטי SM.79, ונהרגו למעלה ממאה תושבים. בתגובה, הפציץ חיל האוויר הבריטי של האיים הדודקאנסיים שהיו תחת שליטה איטלקית (כיום שייכים ליוון). קדמה להפצצה סדרה של הפגזות על העיר חיפה, בה נהרגו עשרות תושבים, ונגרם נזק משמעותי לבתים ולמפעלים. ביוני 1941 הפציצו מטוסי חיל האוויר של צרפת של וישי את תל אביב.\nיא' באלול ה'תשנ\"ד (1994) - נפטר ישעיהו ליבוביץ, איש אשכולות ומדען ישראלי, בירושלים. נולד ב-1903 בריגה. בילדותו, למד מפי מורים פרטיים. ב-1919, בעקבות מלחמת האזרחים ברוסיה, עברה משפחתו להתגורר בברלין. בגיל 18 התקבל לאוניברסיטת הומבולדט של ברלין, וב-1924 קיבל תואר דוקטור בכימיה. ב-1935 עלה לארץ ישראל והצטרף כחבר סגל באוניברסיטה העברית. בהמשך, התמנה לפרופסור מן המניין. במלחמת העצמאות פיקד על מחלקה בפלגוה הדתית של ההגנה. במרוצת חייו, פרסם מאמרים וספרים במדע, פילוסופיה ומוסר. הוא הביע דעותיו בנושאים שונים שעל סדר היום, כגון פוליטיקה, דת ואתיקה, חלקם שנויים במחלוקת. בשל דעותיו הנחרצות והקיצוניות זכה לכינוי \"נביא הזעם של מדינת ישראל\". כך למשל, ב-1992, היה מועמד לפרס ישראל, אך ויתר על כך, בין היתר בשל ביקורת חריפה שספג בעקבות שימוש בביטוי \"יודו-נאצים\".\nיג' באלול ה'תרס\"ט - נפטר הרב יוסף חיים מבגדאד – \"הבן איש חי\" (על שם ספרו) – רב פוסק ומקובל, ליד בגדאד. נולד בה'תקצ\"ה (1835) בבגדאד. סבו, הרב משה חיים, שימש כרבה הראשי של בגדאד, לצד בנו – אבי הבן איש חי – שהיה ממנהיגי הקהילה היהודית. מסופר כי בילדותו, נדר נדר להקדיש חייו לתורה. בגיל 14 התקבל לבית מדרש לרבנים, ובגיל 17 נישא לרחל. לאחר פטירת אביו ב-1859 מונה לרב הראשי של בגדאד. בכהונתו, נשא דרשות רבות, שיגר פסקי הלכה וכתב למעלה מ-50 ספרים. ב-1869 ביקר בארץ ישראל וסייר בין קברי צדיקים. ספרו הבולט, \"בן איש חי\", מתאפיין בהנגשת ההלכה בשילוב אגדות, מדרשים וקבלה. לאחר פטירתו, הועלה ארונו לארץ ישראל ונקבר בהר הזיתים בירושלים.\nיח' באלול ה'שס\"ט (1609) - נפטר ר' יהודה ליווא בן בצלאל – המהר\"ל מפראג – רב, מקובל והוגה דעות, בפראג. שנת לידתו אינה ברורה, אך מקובל לתארך זאת לשנת ה'רע\"ב (1512). הוא נולד בפוזנן, פולין, לנצר רבנים, אחרון מבין ארבעה אחים. ב-1553 התמנה כאב בית דין במיקולוב, וב-1573 עבר לפראג וייסד בית כנסת. לאחר שנים מספר, שב המהר\"ל בשנית לפראג וכיהן כרבה של פראג. מתוקף מעמדו, הוא הוזמן לחצרו של רודולף השני, קיסר האימפריה הרומית הקדושה. לאחר מכן שב לפוזנן ושימש כרב פולין גדול (מחוז בפולין). הוא חזר לפראג בשלישית ומונה לאב בית הדין וראש הישיבה המקומית. הוא נטמן בבית העלמין היהודי בפראג (בתמונה). לצד עיסוקו בתורה ובקבלה, גילה בקיאות רבה במדע ובפילוסופיה ויישם רעיונות אלה בספריו הרבים, הבולטים שבהם: נצח ישראל, תפארת ישראל ונתיבות עולם. במרוצת חייו נישא פעמיים. סביבו נרקמה אגדת הגולם מפראג.\nכד' באלול ה'תרצ\"ג (1933) - נפטר רבי ישראל מאיר הכהן – \"החפץ חיים\" – ראש ישיבת ראדין ופוסק הלכה. נולד בעיירה ז'טל באימפריה הרוסית. שנת לידתו שנויה במחלוקת. בגיל 10 עבר עם משפחתו לווילנה, שם נודע כ\"עילוי\" (ביטוי לתלמיד חכם מוכשר). בגיל 14 נפטר אביו ובגיל 17 נישא לאחותו החורגת. הזוג עבר להתגורר בראדין, בקרבת וילנה, שם הקים ר' ישראל, ב-1868, את \"ישיבת ראדין\". לפרנסתו, ניהל יחד עם אשתו מכולת. בין היתר, פעל במישור הציבורי לביצור חומות ההלכה, בדגש על הלכות איסור לשון הרע, וכתב ספרים, הבולטים שבהם: סדרת \"משנה ברורה\" ו\"שמירת הלשון\". זאת ועוד, נמנה עם מייסדי אגודת ישראל והתנגד לתנועה הציונית. הוא נפטר בשנות התשעים לחייו.\nכה' באלול ה'תשע\"ו (2016) - נפטר שמעון פרס, הנשיא ה-9 וראש הממשלה ה-8 של מדינת ישראל. נולד ב-1923 בווישנבה, פולין. ב-1934 עלה עם משפחתו לארץ ישראל. בשנות ה-40 הצטרף להגנה. ב-1952 התמנה למנכ\"ל משרד הביטחון והידק את קשרי החוץ עם צרפת וקידם את פיתוח הקרייה למחקר גרעיני. ב-1959 נבחר ברשימת מפא\"י לכנסת, ובפילוג שנוצר בינה לבין רפ\"י נמנה עם תומכי בן גוריון. ב-1974, בממשלת [יצחק רבין](https://t.me/historicalstatus/428), מונה לשר הביטחון. לאחר התפטרות רבין כיהן כיו\"ר מפלגת העבודה. מאחר שלא הושגה תוצאה מכריעה בבחירות 1984, קיימו יצחק שמיר, יו\"ר הליכוד, ופרס, ממשלת אחדות; כך היה גם בבחירת 1988, עד ניסיון הפלתהּ הכושל – שכונה \"[התרגיל המסריח](https://t.me/historicalstatus/585)\" – וכינון ממשלה צרה עם המפגלות החרדיות. ב-1992 נבחר רבין בשנית ופרס שימש בממשלתו כשר החוץ; הוא היה מאדריכלי הסכמי אוסלו וזכה על כך, יחד עם רבין, בפרס נובל. לאחר רצח רבין ב-1995 החליף את מקומו, וב-1996 הפסיד לבנימין נתניהו. ב-2005 הצטרף למפלגת קדימה וב-2007 נבחר לנשיא המדינה, עד 2014.\nמלחמת יום הכיפורים: סמוך לשעה 14:00 פתחו כוחות מצרים וסוריה בהתקפה משולבת על ישראל, בחצי האי סיני וברמת הגולן. ערב המלחמה, דבק אגף המודיען ב\"קונספציה\", ומעיקרה – קיימת סבירות נמוכה שצבאות ערב יתקפו את ישראל כל עוד אין מאזן ארטילרי בין הצבאות. זאת על אף התרעות למתקפה רחבת היקף ששיגרו מודיעים, בהם סוכן המוסד אשרף מרואן, חתנו של גמאל עבד אלנאצר. הנחה שגויה זו הייתה בעכוריו של מערך המודיעין בישראל ותרם לכשל המודיעיני ערב המלחמה. יממה לפני פרוץ המלחמה הוחל בגיוס מילואים נרחב, משסברו כי היא תפרוץ רק בשעה 18:00. בשלהי 1968 הוקם לאורך הגדה המזרחית של התעלה מערך מבוצר של 32 מוצבים שכונה \"קו בר-לב\" (על שם הרמטכ\"ל חיים בר-לב). ערב המלחמה רק 16 מתוכם אוישו.\nהחזית הדרומית: בצהרי יום הכיפורים ה'תשל\"ד – 6 באוקטובר 1973 – פתח צבא מצרים בהפגזה ארטילרית כבדה על הגדה המזרחית של תעלת סואץ, ולמחרת, כוחות מצריים רבים (5 דיוויזיות חי\"ר) צלחו את התעלה לעבר חצי האי סיני באמצעות סירות גומי וראשי גשרים, עם כ-400 טנקים. במקביל, הפציץ חיל האוויר המצרי מטרות ישראליות. בסך הכול צלחו את התעלה כ-100,000 חיילים מצרים. כלל המוצבים, מלבד מוצב בודפשט, נפלו לידי המצרים בראשית המלחמה. בליל 7 באוקטובר יזם חיל האוויר הישראלי מתקפה מוצלחת במפרץ סואץ. 3 אוגדות שריון של צה''ל גויסו למערכה (אוגדה 143, אוגדה 162 ואוגדת סיני). ב-8 באוקטובר ניהלו מתקפת נגד כושלת שגבתה הרוגים רבים. בימים הבאים, תקף צה''ל יעדים אסטרטגיים בעומק מצרים.\nב-14 באוקטובר נערך קרב משוריין מהגדולים בהיסטוריה, בהשתתפות למעלה מ-1,000 טנקים, אשר היווה נקודת מפנה במעבר ממגננה להתקפה. הוא הוכרע בניצחון ישראלי וסלל את הדרך למעבר תעלת סואץ. כמו כן, בזירה המדינית, הושקה רכבת אווירית טעונה באמצעי לחימה מארצות הברית. ב-15 באוקטובר החל מבצע אבירי לב לצליחת התעלה ובליל ה-16 צלחו כוחות צנחנים את התעלה ותפסו ראש גשר מצרי; בקרב החווה הסינית (15–18 באוקטובר), שניהלה בעיקר חטיבה 14 של אוגדה 143, נפתח מסדרון שדרכו הונחו גשרים ניידים לחציית התעלה. עם החצייה הראשונה, פשטו כוחות צה\"ל על בסיסי טילים מצריים. ב-17 באוקטובר הונחו ראשוני הגשרים בידי חיל ההנדסה. חיל השריון צלח את התעלה והרחיב את ראש הגשר בגדה המערבית של התעלה. במקביל, תקף חיל האוויר מערך טילי קרקע-אוויר של צבא מצרים.\nבגדה המערבית של התעלה ניטשו קרבות עקובים מדם, בהם קרב סרפאום שהוכרע בניצחון מצרי וקרב אורחה שבו אבטח צה\"ל את ראש הגשר מצפון. כוחות צה\"ל חדרו אל עומק מצרים, וב-22 באוקטובר הגיעו לקילומטר ה-101 מקהיר, תוך כיתור הארמייה המצרית השלישית, זאת על אף החלטה 338 של מועצת הביטחון של האו\"ם שקראה להפסקת אש בין הצדדים. ב-25 באוקטובר נרשמה הפסקת אש בחזית הדרומית. הסכם הפרדת הכוחות בין ישראל למצרים נחתם ב-18 בינואר 1974.\nהחזית הצפונית: מצרים וסוריה תזמנו שתיהן התקפה משולבת על ישראל, כשסוריה ניסתה לבסס אחיזתה מחדש על רמת הגולן, שנכבשה בידי ישראל במלחמת ששת הימים. 3 דיוויזיות חיל רגלים ו-2 דיוויזיות משוריינות פתחו במתקפה על רמת הגולן, תוך חיפוי אווירי של חיל האוויר הסורי, שתקף מטרות ישראליות בצפון. מוצב החרמון (שנודע במורשת הקרב כ\"עיניים של המדינה\") נפל בשעה 16:00. הסורים הצליחו להבקיע את קווי ההגנה בדרום ויישובי דרום הגולן פונו מתושביהם. בהגנה על הגזרה עסקה בעיקר אוגדה 36 המשוריינת (ומספר אוגדות מילואים), שהתחלקה רובה לחטיבה 7 וחטיבה 188, הן נשאו בעול הבלימה בצפון ובדרום הרמה בהתאמה; ככלל, המערכה בדרום הרמה הייתה קשה יותר בשל היתרון הטופוגרפי שהיה לסורים.\nמ-6 ועד 10 באוקטובר ריכז צה\"ל מאמץ לבלימת הכוחות הסוריים: הקרבות המרכזיים התנהלו באזור חושניה ובקרבת מחנה נפח. ב-8 באוקטובר נערך ניסיון כושל לכבוש מחדש את מוצב החרמון. הקרב המכריע בשלב הבלימה ניטש ב-9 באוקטובר ב\"עמק הבכא\", שבו נחל הצבא הסורי תבוסה מוחצת. בד בבד, תקף חיל האוויר הישראלי מטרות בסוריה, בהן בניין המטכ\"ל בדמשק. ב-10 באוקטובר הצליח צה''ל לדחוק את צבא סוריה אל מעבר לקו הסגול. ב-11 באוקטובר עבר צה''ל ממגננה למתקפה והחל לנוע אל עומק סוריה באזור שכונה \"המובלעת הסורית\".\nבימים הבאים, תקף חיל האוויר מטרות - תוך ניהול קרבות אוויריים - וכוחות מיוחדים של צה\"ל ביצעו מבצעי פשיטה בעומק סוריה; ישראל רשמה לעצמה ניצחונות מכריעים. ב-21 באוקטובר נכבש מחדש מוצב החרמון בידי חטיבת גולני. בזירה הימית, הייתה יד חיל הים הישראלי על העליונה, משנערך מבחינה מודיעינית זה מכבר, ותקף בהצלחה ספינות מלחמה לאורך קו החוף הסורי והמצרי (כגון קרב לטקיה, תקיפת נמל פורט סעיד ועוד). ב-24 באוקטובר נרשמה הפסקת אש בחזית הצפונית. הסכם הפרדת הכוחות בין ישראל לסוריה נחתם ב-31 במאי 1974, וישראל נסוגה מהמובלעת הסורית שהחזיקה.\nעל אף הסברה הרווחת כי ישראל ניצחה במלחמה, היא היכתה את אזרחיה בהלם ותדהמה. בתום המלחמה, הוקמה ועדת אגרנט לחקירת נסיבות פרוץ המלחמה והכשל המודיעיני. היא הטילה את כובד האחריות על הצמרת הצבאית וניקתה את הצמרת המדינית, מה שחולל משבר אמון ציבורי שהוביל לפיטורם של ראש הממשלה, גולדה מאיר, ושר הביטחון, משה דיין. בצד הישראלי נרשמו למעלה מ-2,500 חללים, ובצד מדינות ערב כ-20,000 הרוגים.\nיא' בחשוון ה'תשנ\"ו (1995) - נרצח יצחק רבין, ראש ממשלת ישראל (1974–1977 ו־1992–1995), על ידי יגאל עמיר, עם תום העצרת למען השלום בכיכר מלכי ישראל בתל אביב. מעט לפני השעה 22, בעודו צועד לעבר רכב השרד שלו מוקף במאבטחים, נורו 3 כדורים לעבר רבין, שהובהל למרכז הרפואי איכילוב, שם מת מפצעיו. על הרוצח יגאל עמיר, פעיל ימני-קיצוני, סטודנט למשפטים באוניברסיטת בר אילן, נגזר מאסר עולם ועוד 6 שנים על פציעת מאבטח (בהמשך התווספו לו עוד 8 שנות מאסר). יצחק רבין נולד ב-1 במרץ 1922 בירושלים, להוריו, נחמיה ורוזה. ב-1940 סיים את לימודיו בבית הספר החקלאי כדורי וב-1941 הצטרף לשורות הפלמ\"ח. במלחמת העצמאות היה מפקד חטיבת הראל. לאחר הקמת צה\"ל, שימש מפקד במספר מוקדי כוח ועלה בסולם הדרגות של השרשרת הפיקודית, וב-1964 מונה לרמטכ\"ל, שהוביל את ישראל לניצחון במלחמת ששת הימים ב-1967. לאחר שחרורו מצה\"ל מונה לשגריר ישראל בארצות הברית. בסוף 1973 נבחר לכנסת וב-1974, לאחר התפטרות גולדה מאיר בעקבות מסקנות ועדת אגרנט לחקירת נסיבות פרוץ מלחמת חודש, מונה לראש הממשלה, בתפקיד זה כיהן עד 1977. בממשלת האחדות של פרס-שמיר, כיהן כשר הביטחון, עד פירוק הממשלה בעקבות \"התרגיל המסריח\" ב-1990. ב-1992 נבחר בשנית לראש הממשלה והוביל קו מדיני-פציפיסטי, במסגרתו חתם ב-1993 על הסכמי אוסלו עם מנהיג אש\"ף יאסר ערפאת (רבין, פרס וערפאת זכו בעקבות זאת בפרס נובל לשלום), מהלך שעורר ביקורת רבה ומחאות רבתי בקרב חוגי הימין, והעמיק את הקיטוב בין שני המחנות הפוליטיים. ב-1994 חתם על הסכם השלום עם ירדן. ב-4 בנובמבר 1995 נרצח בכיכר מלכי ישראל.\nטז' בחשוון ה'תרצ\"ט (1938) - ליל הבדולח (Kristallnacht): פוגרום עקוב מדם פורץ בכל רחבי גרמניה הנאצית נגד בתי כנסת ובתי עסק של יהודים. האמתלה לפרוץ המהומות הייתה התנקשות של דיפלומט גרמני, בפריז בידי צעיר יהודי בשם הרשל גרינשפן, לאחר שנודע לי כי משפחתו הוגלתה לפולין. על אף שהפוגרום תואר כהתפרצות ספונטנית, יומנו של גבלס, שר התעמולה הנאצי, מעיד על יוזמה מאורגנת שתוכננה מראש ואשר מערך הכבאות והשיטור נטלו בו חלק פעיל. נזקי הרכוש נאמדו במאות מיליוני מארק גרמני. על פי דו\"ח נאצי, בתום המהומות נמנו 91 הרוגים ונהרסו למעלה מ-1000 בתי כנסת וחנויות. על פי אומדנים אחרים, ממדי ההרס והקורבנות גבוהים בהרבה.\nיט' בכסלו ה'תקנ\"ט (1798) - חג הגאולה המציין את יום השחרור של רבי שניאור זלמן מלאדי – אדמו\"ר הזקן – מייסד תנועת חב\"ד. מתנגדי תנועת החסידות הלשינו בפני שלטון הצאר כי הרבי מורד במלכות ומסייע לאימפריה העות'מאנית (הלשנה שהתבססה על מפעל צדקה בארץ ישראל שיזם); הוא נאסר במבצר פטרופבלובסקיה, סנקט פטרבורג, למשך 53 ימים עד ששוחרר במאמצי החסידים. יום זה נקבע ליום טוב בקרב חסידי חב\"ד, שנוהגים לציין יום זה בהתוועדות חסידית, להתחיל מחדש את ספר התניא ולאחל \"לשנה טובה בלימוד החסידות ובדרכי החסידות תיכתב ותיחתם\". יום זה נחוג בסימן התעוררות מחודשת בהפצת תורת החסידות. בנוסף, יום זה הוא יום פטירתו של רבי דוב בער \"המגיד ממזריטש\", רבו של אדמו\"ר הזקן ותלמידו של הבעל שם טוב.\nכד' בכסלו ה'תשע\"ד (2013) - נפטר אריק איינשטיין, זמר ושחקן ישראלי. איינשטיין נולד ב-1939 בתל אביב. את דרכו המוזיקלית החל איינשטיין בעת שירותו הצבאי בלהקת הנח\"ל; לאחר שחרורו ב-1959, החל את דרכו המוזיקלית-קומיקאית והצטרף להרכב 'בצל ירוק'. מאוחר יותר ל'שלישיית גשר הירקון', לצד בני אמדורסקי ויהורם גאון ובלהקת החלונות הגבוהים, לצד שמוליק קראוס וג'וזי כץ. ב-1966 יצא אלבום הסולו שלו - שר בשבילך. ב-1969 חבר לשלום חנוך והוציא את 'פוזי', הנחשב לאלבום הרוק הישראלי הראשון. במרוצת הקריירה שלו, שיתף פעולה עם מגוון אמנים ויוצרים, בהם אורי זוהר (לימים, בתו של אריק, שחזרה בתשובה, תינשא לבנו של אורי), שלום חנוך, מיקי גבריאלוב, יוני רכטר ויצחק קלפטר (שנפטר לאחרונה). מאז 1981 הפסיק איינשטיין להופיע על במה בפני קהל (ראו בשיר \"אוהב להיות בבית\"). כמו כן, שיחק אריק במספר סרטי קאלט ישראליים. איינשטיין נחשב לאחד מגדולי הזמרים בישראל ורבים משיריו הפכו לנכסי צאן ברזל במוזיקה הישראלית. בין יצירותיו המוכרות: \"עטור מצחך\", \"אני ואתה\", \"עוף גוזל\" ו\"סע לאט\".\nכד' בכסלו ה'תשע\"ח (2017) - נפטר הרב אהרן יהודה ליב שטינמן, ממנהיגי הציבור הליטאי ונשאי מועצת גדולי התורה; נולד בה'תרע\"ה (1914) בקמניץ, בלארוס; בשנות ה-30, על מנת לחמוק מגיוס לצבא פולין, שינה את שמו משטימן לשטינמן, ונמלט לשווייץ, שם כיהן כר\"מ (=ריש מתיבתא - כינוי לרב המלמד בישיבה) בישיבת 'עץ חיים' במונטרה. בבריסק, נסמך להוראה. ב-1945, שנה לאחר שנישא, עלה לארץ ישראל. במרוצת השנים, כיהן כראש ישיבה במספר ישיבות, בהן כולל פוניבז' וישיבת 'ארחות תורה'. היה אחד ממנהיגי דגל התורה וגורם רב השפעה בציבור החרדי-ליטאי. הוא נפטר בגיל 103. בצוואתו, ביקש הרב שלא להספידו. נטמן בבית הקברות פוניבז' בבני ברק.\nחנוכה – תיאור שמונת קרבות החשמונאים:\nקרב מעלה לבונה (166 לפנה\"ס) - הראשון מבין הקרבות שניטשו בין המקבים לסלאוקים. אפולוניוס, נציב מחוז השומרון בארץ ישראל (קוילה-סוריה), נשלח לדכא את נס מרד החשמונאים שהרים מתתיהו והמשיכו בניו. אפולוניוס נשלח בצבא גדול מאזור שכם דרומה לאזור בית לחם וגופנה. המקבים ארבו לצבא אפולוניוס באזור מעלה לבונה והסתערו על הלוחמים, כשהם מפילים בהם חללים רבים. המארב יצר תבהלה והצבא הסלאוקי נס על נפשו. אפולוניוס נפל בקרב ומסופר כי יהודה המכבי נטל את חרבו והשתמש בו בקרבות הבאים. ניצחון מזהיר זה המחיש את כישוריו הצבאיים של יהודה המכבי ועורר את רוחם של יהודים נוספים להצטרף לשורותיו.\nקרב בית חורון (166 לפנה\"ס) - השני מבין הקרבות שניטשו בין המקבים לסלאוקים. כאמור, כישוריו הצבאיים של יהודה המכבי הורמו על נס מאז הניצחון בקרב מעלה לבונה. לאחר מכן, סירון נשלח מאנטיוכיה לפקד על אחד הלגיונות. הוא נע עם צבאו ממישור החוף להרי ירושלים. המקבים, שהיו מודעים למהלך, התחפרו באחת הגבעות, תוך שהם צופים בצבא של סירון מתקדם לעברם במעלות הרי המרכז, בבחינת 'רואים ואינם נראים'. יהודה ואנשיו הסתערו על צבא סירון והטילו פחד ואימה שגרמו לסלאוקים לנוס על נפשם.\nקרב אמאוס (165 לפנה\"ס) - השלישי מבין הקרבות שניטשו בין המקבים לסלאוקים. לאחר שתי מפלות הצבא הסלאוקי, נשלחו גורגיאס וניקנור בצבא גדול מעמק איילון לדכא את המרד. הם התקדמו במעלה הוואדי מזרחה מצפון (כיום ציר 443) כשבמקביל, יהודה ואנשיו מקיימים תפילה במצפה (מזוהה, על פי רוב החוקרים, כנבי סמואל), וחומקים מהם מערבה בדרך היקפית מדרום (אזור לטרון, על ציר כביש 1) לכיוון המחנה של ליסיאס, מפקד אחד הלגיונות והעוצר של אנטיוכוס החמישי 'אאופטור'. הם עטו על מחנה ליסיאס הרדום בשעת לילה מאוחרת והציתו אותו, תוך הטלת מורא על הסלאוקים, שנרדפו על ידי יהודה ואנשיו עד אזור גזר. בינתיים, המציאות טפחה על פני גורגיאס וצבאו כשלא מצאו את יהודה וצבאו והם שבו על עקבותם למחנה באמאוס, רק כדי לגלות מחנה בוער וחרב. מרוב פחד, נסו הסלאוקים לכל עבר.\nקרב בית צור (164 לפנה\"ס) - לאחר שנכשלו בדיכוי המרד מכיוון צפון וממערב, יצא ליסיאס בצבא גדול וממוסד, עם שריון ופילים, על מנת לתקוף מדרום, דרך לוד, גזר ומרשה, שתושביהן היו ידידותיים להלניסטים. הסלאוקים נתקלו בצבא יהודה המכבי בבית צור, שם פשטו המקבים על הסלאוקים מאזור יהודה והרגו בהם אלפים (5,000 במספר על פי ספר מקבים א'). בתום העימות, טיהרו החשמונאים את בית המקדש וחנכו מחדש את המזבח (כה' בכסלו). ליסיאס פנה למישור הדיפלומטי וניסה לנהל משא ונתן עם המורדים, תוך הבטחה לחופש דת והכרה חלקית באוטונומיה יהודית. קרב זה העלה את קרנם של החשמונאים, והם יצאו למסע עונשין בעמים הסובבים שהיו מתנכלים ליהודים. משנודע לו על מותו של אנטיוכוס הרביעי 'אפיפנס', נאלץ ליסיאס לשוב לאנטיוכיה ובחר לוותר על המשך המערכה. בית צור מזוהה עם 'חרבת טביקה', צפונית-מערבית לעיירה הפלסטינית חלחול (צפונית לחברון). על שם האתר, הוקמה ב-1984 ההתיישבות כרמי צור.\nקרב בית זכריה (163 או 162 לפנה\"ס) – לאחר קרב בית צור, הטילו המקבים מצור על מצודת החקרא, שהיתה מעוז הסלאוקים בזמן המרד. משחשש ליסיאס על ניתוק יהודה מהממלכה הסלאוקית, הוחלט לשלוח כוחות בסדר גודל חסר תקדים, עם פלנקס ופילים. זאת על אף שבמסגרת חוזה הכניעה של הממלכה הסלאוקית במלחמתה עם הרפובליקה הרומית בקרב מגנסיה (190 לפנה\"ס), נאסר על הסלאוקים שימוש בפילי מלחמה. ליסיאס וצבאו הגיחו מצפון, ביצעו תפנית דרך מזרח ועלו לירושלים בכיוון דרום מערב. בדרך, עצרו ליד בית צור והטילו עליה מצור. משנודע ליהודה על כך, חש עם אנשיו מירושלים להסרת המצור, שם ניגף צבא החשמונאים מפני העליונות הטכנולוגית של הסלאוקים (על אף שבהתחלה נזקפה לזכותו התקפה מוצלחת). באפיזודה מצערת, אלעזר, אחיו של יהודה נפל בקרב כשניסה לדקור את אחד הפילים בבטנו ונרמס תחתיו. במערכה, נחלו החשמונאים תבוסה, אך זכו למימוש זכויות דתיות. על שמו של אלעזר החורני נקרא היישוב 'אלעזר' (נוסד ב-1975) בגוש עציון. בית זכריה מזוהה עם היישוב הפלסטיני 'חרבת זכריה', דרומית לבית לחם.\nקרב כפר שלמא (162 לפנה\"ס) - דמטריוס הראשון, אחי אנטיוכוס הרביעי והיורש החוקי של אביו סלאוקוס הרביעי, לא ראה בעין יפה את המדיניות הפייסנית של אנטיוכוס החמישי וליסיאס כלפי היהודים. הוא רצח את שניהם ותפס את השלטון. דמטריוס שם פעמיו לחדש את דיכוי המרד ביהודה ושלח את בקכידס, \"מושל בעבר הנהר\" על פי ספר מקבים א'. האחרון שלח את המצביא ניקנור, שניסה לפתות את יהודה המכבי בדרכי עורמה כדי לרצוח אותו. מזימתו התגלתה, והוא נתקל ביהודה אנשיו בקרבת כפר שלם, המזוהה כיום עם חרבת סלמא, דרומית לרמאללה. ניקנור ניגף ונאלץ לשוב לירושלים ולהתבצר בחקרא. בתמונה: יהודה וצבאו עומדים לפני ניקנור.\nקרב חדשה (161 לפנה\"ס) - עם עלייתו לשלטון, מינה דמטריוס את אלקימוס ככהן גדול במקום מנלאוס המתיוון (שנטל את הכהונה מאחיו יאסון), מהלך שחולל קרע בקרב מחנה מתתיהו, בין התומכים באלקימוס לבין תומכי יהודה המכבי. אלקימוס פנה לדמטריוס \"לטפל\" במתנגדים והלה שלח את צבאו לעימות אל מול יהודה המכבי ואנשיו. בפסקה הקודמת הוזכר \"קרב כפר שלמא\" שניטש בעקבות מינויו של אלקימוס. קרב זה היה הניסיון השני של ניקנור להביס את צבא המורדים. הם תקפו את ניקנור מדרום בדרכו לירושלים ב\"עדסה\", המזוהה כיום, על פי חלק מהחוקרים, עם גבעון החדשה, ליד גבעת זאב. ניקנור נהרג בקרב ויום מותו, יג' באדר נקבע על פי מגילת תענית לחג. בלשון התלמוד הבבלי (תענית, יח', ב'): \"ניקנור אחד מאפרכי יוונים היה ובכל יום ויום היה מניף ידו על יהודה וירושלים ואומר אימתי תפול בידי וארמסנה וכשגברה מלכות בית חשמונאי ונצחום קצצו בהונות ידיו ורגליו ותלאום בשערי ירושלים ואמרו פה שהיה מדבר בגאוה וידים שהיו מניפות על ירושלים תעשה בהם נקמה\".\nקרב אלעשה (160 לפנה\"ס) - ניצחון יהודה המכבי בקרב חדשה הבטיח לו את השליטה ברחבי יהודה, למעט החקרא שבירושלים. בתום דיכוי מרד בבלל, נפנה דמטריוס הראשון ושלח את בקכידס בשנית להשליט מרות. הצבא הסלאוקי נכנס ליהודה ממזרח, הדרים דרך בעל חצור וחנה בבארה, המזוהה כיום עם אל-בירה שבפאתי רמאללה. המקבים נתקלו בצבא הסלאוקי החמוש היטב באלעשה, המזוהה עם מבואותיה הדרומיים של רמאללה. המערכה נערכה בשלושה שלבים, כבסופה הובסו המקבים ויהודה המכבי נהרג. את מקומו תפס אחיו יונתן הוופסי. ניצחון הסלאוקים בקרב השיב לידי דמטריוס את השליטה במרכזי האוכלוסיה היהודה והחשמונאים נאלצו להעתיק את מעוזם מהרי גופנה למדבר תקוע. לאחר שנים, בעקבות סכסוכים פנימיים בממלכה הסלאוקית, נאלץ דמטריוס לפנות ליונתן בבקשת עזרה, תמורת ביסוס צבאו ואף מינויו לתפקיד מושל ארץ יהודה ועבר הירדן. ב-142 לפנה\"ס הצליחו החשמונאים להשיג עצמאות ליהודה, שנמשכה עד שנת 63 לפנה\"ס, עת כבש פומפיוס את ארץ יהודה.\nל' בכסלו ה'תשס\"ט (2008) - צה\"ל פותח במבצע עופרת יצוקה, שנועד לפגוע בתשתית חמאס ברצועת עזה וליצור הרתעה ביטחונית, כתגובה על מטחי רקטות שנורו אל עבר יישובי הדרום. המבצע נמשך 22 ימים וגבה את חייהם של 13 ישראלים ולמעלה מ-1,400 עזתיים, רובם מחבלים.\n2\n: יצוין כי הן התנועה הציונית והן הממלכה החג'אזית, בהנהגת חוסיין בן "בפיגוע התאבדות באיסטנבול, טורקיה, נרצחים 4 בני אדם, מתוכם 3 ישראלים, ונפצעים עשרות. הפיגוע בוצע על ידי ארגון דאע\"ש. באותה שנה אירעו מספר פיגועים ומתקפות נגד יעדים בטורקיה, בהם הפיגוע בנמל התעופה אטאטורק (41 הרוגים), ניסיון ההפיכה הצבאית (למעלה מ-300 הרוגים) והפיגוע הכפול באיסטנבול (45 הרוגים). ב-2003 הותקפו 2 בתי כנסת ויעדים בריטים בסדרת פיגועים בעיר, על ידי אל-קעידה. במתקפות נרצחו 57.", "c": "Turkey", "la": 39.0, "lo": 35.0}, {"y": 2016, "d": "12 ביוני 2016", "t": "פיגוע ירי המוני מתרחש במועדון הלהט\"ב פולס באורלנדו, פלורידה", "x": "פיגוע ירי המוני מתרחש במועדון הלהט\"ב פולס באורלנדו, פלורידה. בפיגוע נרצחו 49 בני אדם ונפצעו 58. היה זה פיגוע הירי הקטלני בתולדות ארצות הברית עד הטבח בסטריפ של לאס וגאס ב-2017 (60 הרוגים). מבַצע הפיגוע הוא עומר מאטין, מוסלמי ממוצא אפגני, יליד ניו יורק, שעבד כמאבטח ונשא נשק ברישיון. הוא חוסל בהסתערות היחידות המיוחדות ללוחמה בטרור של המשטרה (SWAT).  ארגון דאע\"ש נטל אחריות לפיגוע.", "c": "United States", "la": 39.0, "lo": -98.0}, {"y": 2020, "d": "4 באוגוסט 2020", "t": "פיצוץ עז שמקורו בנמל ביירות מחריד את העיר ביירות בלבנון וגורם לנזק עצום", "x": "פיצוץ עז שמקורו בנמל ביירות מחריד את העיר ביירות בלבנון וגורם לנזק עצום. שריפה שפרצה במחסן זיקוקים התפשטה להאנגר שבו אוחסן אמוניום חנקתי ואירע פיצוץ בעוצמה של קילוטון TNT (לשם השוואה, פצצת האטום שהוטלה על הירושימה ב-1945 הייתה שקולה ל-15 קילוטון). מדינות רבות, כולל ישראל, הציעו סיוע ללבנון. האירוע חולל משבר אמון פוליטי, וראש ממשלת לבנון, חסן דיאב, הודיע על התפטרותו. בפיצוץ נהרגו 218 ונפצעו אלפים.", "c": "Lebanon", "la": 33.9, "lo": 35.8}, {"y": 2021, "d": "15 באוגוסט 2021", "t": "העיר קאבול נופלת לידי שלטון הטאליבן באפגניסטן", "x": "העיר קאבול נופלת לידי שלטון הטאליבן באפגניסטן. ב-1979 פלשה ברית המועצות לאפגניסטן ונתקלו, בתמיכת ארצות הברית, בהתנגדות מצד \"המג'אהדין\"; בתום 10 שנות לחימה, נסוגו הסובייטים. ב-1994 הקימו מולא עומר ותלמידי מדרסה (מוסד דת אסלאמי) את ארגון הטליבאן (בערבית: \"תלמידים\"), שצבר פופולריות רבה בצל מלחמת אזרחים שפקדה את המדינה. ב-1996 השתלט הטאליבן על אפגניסטן, למורת רוחם של שאר המיליציות, שהקימו נגדם, בראשות אחמד סעדה, את קואליציית \"הברית הצפונית\". הם כוננו משטר אסלאמי קיצוני והעניקו מחסה לבן לאדן, מנהיג ארגון אלקעידה העולה. הטאליבן שלטו עד 2001, עת פלשה ארצות הברית לאפגניסטן, למוטט את שלטונה, עקב מתקפות 11 בספטמבר – במסגרת \"המלחמה בטרור\".\nארצות הברית התקינה ממשל פרו-מערבי בראשות חאמיד כרזאי, כשכל אותה העת אחזו אנשי הטאליבן ביישובים אחדים במדינה. באפריל 2021 הודיע נשיא ארצות הברית ג'ו ביידן כי ארצות הברית תיסוג לחלוטין מהמדינה עד 11 בספטמבר, באופן סמלי. לקראת המועד המיוחל, השתלטו הטליבאן ללא קרב על מרבית ערי אפגניסטן ובירתה. המוני אפגנים צבאו על נמל התעופה הבינלאומי של קאבול, בתקווה להיחלץ מהמדינה. אלפי אזרחים אכן פונו בידי חיל האוויר האמריקני. מראות אלה הופצו בתקשורת ורבים מתחו קווי דמיון בין זה לנפילת סייגון במלחמת וייטנאם ב-1975. ב-30 באוגוסט פונו אחרוני החיילים מהמדינה.", "c": "Afghanistan", "la": 33.0, "lo": 66.0}, {"y": 2022, "d": "24 בפברואר 2022", "t": "נשיא רוסיה, ולדימיר פוטין, מכריז על \"מבצע צבאי מיוחד לפירוז אוקראינה\" ורוסיה פולשת לאוקראינה", "x": "נשיא רוסיה, ולדימיר פוטין, מכריז על \"מבצע צבאי מיוחד לפירוז אוקראינה\" ורוסיה פולשת לאוקראינה. שורש הסכסוך בין אוקראינה לרוסיה נעוץ במשבר היסטורי עוד מימי ברית המועצות, כשב-1918, שלהי מלחמת העולם הראשונה, נחתם חוזה ברסט ליטובסק, שהבטיח עצמאות למדינות שהיו חלק מהאימפריה הרוסית, בהן אוקראינה. במרוצת הזמן סופחה אוקראינה לברית המועצות וב-1991, בעקבות פירוקה, קיבלה עצמאות והחלה להתקרב למערב. רוסיה, שראתה באוקראינה נכס אסטרטגי ומשאבי, שאפה לכונן בה משטר פרו-רוסיה בכל זמן נתון, למורת רוחם של האזרחים, שפתחו ב-2013 בגל מחאות נגד משטר ויקטור ינוקוביץ' שנודע בקרבתו לרוסיה. הוא הודח מתפקידו ב-2014.\nבאותה שנה, התגלע סכסוך בין המדינות על חצי האי קרים, ורוסיה הכריזה על סיפוחו. ב-2019 נבחר וולודימיר זלנסקי, שנחשב לפרו מערבי, לנשיא אוקראינה. ב-21 בפברואר, בטרם הפלישה, הכריז פוטין כי רוסיה מכירה באזורים הבדלניים דונייצק ולוהנסק. עם שחר, החלה המתקפה ממזרח ומדרום, ובימים שאחרי, הפגיזה רוסיה את הערים קייב, חרקוב, אודסה, דונבאס ומריופול (שניזוקה קשות). המלחמה עוררה דעת קהל ברחבי העולם לתמוך באוקראינה, ומדינות רבות הביעו עמה הזדהות. נשיא אוקראינה, וולודימיר זלנסקי, הפגין עממיות וזכה לאהדה ציבורית כשגילה תושיה צבאית וסירב לעזוב את המדינה. הסכסוך יצר משבר פליטים חמור, כשמיליוני תושבים נאלצו לעזוב את המדינה, רובם לפולין.\nבאפריל נטען כי רוסיה ביצעה טבח עם בבוצ'ה, עם מאות נספים. בספטמבר רשמה לעצמה אוקראינה הישג, כשהצליחה לשחרר את חרקיב. במקביל, הכריזה רוסיה על סיפוח דרום ומזרח אוקראינה. בנובמבר שוחררה חרסון. בפברואר 2023 ערך ג'ו ביידן ביקור ראשון בקייב מאז הפלישה הרוסית והבטיח סל סיוע צבאי. על פי מקורות מערביים, נכון לתחילת 2023, רוסיה גבתה 180,000 אבדות, ואוקראינה – למעלה מ-100,000.", "c": "Russia", "la": 58.0, "lo": 40.0}, {"y": 2022, "d": "8 בספטמבר 2022", "t": "אליזבת השנייה, מלכת הממלכה המאוחדת של בריטניה וצפון אירלנד (ועוד מדינות), הלכה לעולמה בגיל 96", "x": "אליזבת השנייה, מלכת הממלכה המאוחדת של בריטניה וצפון אירלנד (ועוד מדינות), הלכה לעולמה בגיל 96. אליזבת נולדה ב-21 באפריל 1926 בלונדון, להוריה, ג'ורג' השישי (מלך בריטניה מ-1936 ועד 1952) ואליזבת האם. במלחמת העולם השנייה התגוררה עם אחותה הנסיכה מרגרט, בטירת בלמורל. ב-1945 התגייסה אליזבת לצבא הבריטי כנהגת משאית ומכונאית, והשתחררה בדרגה המקבילה לסֶגֶן בצה''ל. ב-1947 נישאה לנסיך פיליפ דוכס אדינבורו. ב-14 בנובמבר 1948 נולד בנם הבכור צ'ארלס, מלך בריטניה הנוכחי. ב-6 בפברואר 1952, עקב מותו של אביה, המלך ג'ורג', הוכתרה אליזבת כמלכת אנגליה. ממרום 70 שנות מלכותה זכתה לחזות באירועי מפתח היסטוריים וראתה 15 ראשי ממשלה בריטיים (ו-14 נשיאים אמריקאים). ב-1997 נהרגה דיאנה נסיכת ויילס, אשתו הראשונה של הנסיך צ'ארלס, בתאונת דרכים. ב-2021 מת בעלה פיליפ, דוכס אדינבורו, בגיל 99.", "c": "United Kingdom", "la": 52.5, "lo": -1.5}], ERAS=[{"s": -9999, "n": "העולם העתיק – הרפובליקה הרומית וההלניזם (≈100 לפנה\"ס)", "own": 0, "p": [["הרפובליקה הרומית", "#c0392b", ["Italy", "Spain", "Portugal", "Tunisia", "Greece", "Macedonia", "Albania", "Croatia", "Slovenia", "Bosnia and Herz.", "Montenegro"]], ["מצרים התלמית", "#e6b800", ["Egypt", "Libya"]], ["הממלכה החשמונאית", "#2e86c1", ["Israel", "Palestine", "Jordan", "Lebanon"]], ["המ const ANCH=[-200,0,500,1000,1300,1500,1700,1800,1900,1945,1991,2026];

const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const he=c=>HE[c]||c;
const fy=y=>y<0?(-y)+' לפנה"ס':String(y);
function v2y(v){const i=Math.min(Math.floor(v/100),ANCH.length-2),f=(v-i*100)/100;return Math.round(ANCH[i]+(ANCH[i+1]-ANCH[i])*f)}
function y2v(y){for(let i=0;i<ANCH.length-1;i++)if(y<=ANCH[i+1])return Math.max(0,i*100+100*(y-ANCH[i])/(ANCH[i+1]-ANCH[i]));return 1100}
function win(y){for(let i=0;i<ANCH.length-1;i++)if(y<=ANCH[i+1])return Math.max(3,(ANCH[i+1]-ANCH[i])/5);return 8}
const eraOf=y=>{let e=ERAS[0];for(const x of ERAS)if(x.s<=y)e=x;return e};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const own=c=>'hsl('+((hash(c)*137.508)%360)+',52%,'+(css('--bg')<'#80'?'42%':'62%')+')';
function polity(c,era){for(const p of era.p)if(p[2].includes(c))return {n:p[0],c:p[1],all:p[2]};return era.own?{n:'מדינה עצמאית',c:own(c),all:[c]}:{n:'אזורים ללא שלטון מאוחד / עמים מקומיים',c:'#bfc4cc',all:[c]}}
const geoJ=echarts.getMap('world').geoJson.features, NAMES=geoJ.map(f=>f.properties.name);
function bbox(name){const f=geoJ.find(x=>x.properties.name===name);if(!f)return null;const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;let best=polys[0];for(const p of polys)if(p[0].length>best[0].length)best=p;let a=[1e9,1e9,-1e9,-1e9];for(const [x,y] of best[0]){a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)]}return a}
function dive(name){const b=bbox(name);if(!b)return;const w=b[2]-b[0],h=b[3]-b[1];chart.setOption({geo:{center:[(b[0]+b[2])/2,(b[1]+b[3])/2],zoom:Math.max(1.6,Math.min(14,Math.min(300/w,150/h)*.55))}})}
const chart=echarts.init($('map'));
function inWin(e){return Math.abs(e.y-year)<=win(year)}
function match(e){return !q||(e.t+e.x).includes(q)}
function render(){
 const era=eraOf(year),pol={},w=win(year);

  geo:{map:'world',roam:true,zoom:1.15,center:[10,25],aspectScale:.85,regions,label:{show:false},scaleLimit:{min:1,max:30},itemStyle:{borderColor:css('--bd')}},

 else if(q){list=EV.map((e,i)=>({e,i})).filter(({e})=>match(e));head='תוצאות חיפוש: '+q;sub=list.length+' אירועים'}
 else{list=EV.map((e,i)=>({e,i})).filter(({e})=>inWin(e));head='אירועים סביב '+fy(year);sub=list.length+' אירועים ('+fy(Math.round(year-w))+' עד '+fy(Math.round(year+w))+')'}
 $('cnt').textContent=vis.length+' סימונים על המפה';
 $('side').innerHTML='<h2>'+head+'</h2><div class="sub">'+sub+'</div>'+list.slice(0,120).map(({e,i})=>'<details class="ev'+(i===focus?' on':'')+'" id="e'+i+'"'+(i===focus?' open':'')+'><summary><div class="d">'+e.d+(e.c?' <span class="tag" data-c="'+e.c+'">'+he(e.c)+'</span>':'')+'</div><div>'+e.t+'</div></summary><p>'+e.x.replace(/</g,'&lt;')+'</p><button class="go" data-y="'+e.y+'">⏱ קפיצה לתקופה</button></details>').join('')+(list.length>120?'<div class="sub">מוצגים 120 הראשונים – צמצמו עם החיפוש.</div>':'')||'<div class="sub">אין אירועים בחלון הזמן הזה – הזיזו את הציר.</div>';

}
function reset(){chart.setOption({geo:{center:[10,25],zoom:1.15}})}
function setYear(y){year=y;$('sl').value=y2v(y);focus=-1;render();chips()}
function chips(){const cur=eraOf(year);$('chips').innerHTML=ERAS.map((e,i)=>'<button class="'+(e===cur?'on':'')+'" data-i="'+i+'">'+e.n.replace(/\s*\(.*$/,'')+'</button>').join('')}
$('chips').onclick=e=>{const i=e.target.dataset.i;if(i!=null){const s=[-100,117,750,1300,1500,1800,1914,1960,2010][i];setYear(s)}};
$('sl').oninput=e=>{year=v2y(+e.target.value);focus=-1;render();chips()};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('reset').onclick=()=>{sel=null;wide=false;reset();render()};
$('side').onclick=e=>{const t=e.target;if(t.dataset.y!=null){q='';$('q').value='';setYear(+t.dataset.y)}if(t.dataset.c){sel=t.dataset.c;wide=false;dive(sel);render()}};
chart.on('click',p=>{if(p.componentType==='series'){focus=p.data.i;const e=EV[focus];if(e.c)dive(e.c);if(!q&&!inWin(e)){year=e.y;$('sl').value=y2v(e.y);chips()}sel=null;render()}else if(p.componentType==='geo'){sel=p.name;wide=false;dive(sel);render()}});

setYear(1945);
