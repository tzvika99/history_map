<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>אטלס ההיסטוריה העולמית · מהדורת מובייל ומוזיקה</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
<style>
:root {
  --bg: #f6f4ef;
  --card: #ffffff;
  --ink: #1d2330;
  --mut: #6b7280;
  --line: #dcd8cd;
  --sea: #cfe3ee;
  --bd: #ffffff;
  --acc: #b4442b;
  --acc-soft: #b4442b1a;
  --gold: #d97706;
  --emerald: #059669;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --card: #1c212c;
    --ink: #e8e6e1;
    --mut: #9aa3b2;
    --line: #2e3646;
    --sea: #132535;
    --bd: #12151c;
    --acc: #e8805f;
    --acc-soft: #e8805f26;
    --gold: #f59e0b;
    --emerald: #10b981;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c;
  --card: #1c212c;
  --ink: #e8e6e1;
  --mut: #9aa3b2;
  --line: #2e3646;
  --sea: #132535;
  --bd: #12151c;
  --acc: #e8805f;
  --acc-soft: #e8805f26;
  --gold: #f59e0b;
  --emerald: #10b981;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
}

/* Header */
header {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
  z-index: 30;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
h1 { font-size: 17px; margin: 0; white-space: nowrap; }
.badge {
  font-size: 11px;
  background: var(--acc-soft);
  color: var(--acc);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 700;
}
.hdr-tools {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-inline-start: auto;
  flex: 1;
  justify-content: flex-end;
}
#q {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg);
  color: var(--ink);
  width: min(260px, 100%);
  font: inherit;
  font-size: 13.5px;
}
.icon-btn {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: 0.15s;
}
.icon-btn:hover, .icon-btn.active {
  border-color: var(--acc);
  background: var(--acc-soft);
  color: var(--acc);
}

/* Main Layout */
main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 410px;
  position: relative;
}
#mapw {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#map { position: absolute; inset: 0; }

/* Floating Map Overlays */
#era {
  position: absolute;
  top: 10px;
  inset-inline-start: 10px;
  max-width: calc(100% - 130px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 11px;
  font-weight: 600;
  font-size: 13px;
  box-shadow: 0 4px 12px #0002;
  pointer-events: none;
}
.map-btns {
  position: absolute;
  top: 10px;
  inset-inline-end: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#leg {
  position: absolute;
  bottom: 12px;
  inset-inline-start: 10px;
  max-width: min(280px, 65%);
  max-height: 36%;
  overflow: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  box-shadow: 0 4px 12px #0002;
}
#leg div { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
#leg i { width: 11px; height: 11px; border-radius: 3px; flex: none; }

/* Aside / Multi-Tab Panel */
aside {
  border-inline-start: 1px solid var(--line);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 20;
}
.sheet-handle {
  display: none;
  padding: 7px 0 3px;
  cursor: pointer;
  text-align: center;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.sheet-handle span {
  display: inline-block;
  width: 42px;
  height: 5px;
  border-radius: 4px;
  background: var(--mut);
  opacity: 0.45;
}
.panel-tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 4px 8px;
  gap: 4px;
}
.panel-tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--mut);
  padding: 8px 6px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.panel-tabs button.on {
  background: var(--acc-soft);
  color: var(--acc);
}
.tab-view {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  min-height: 0;
}
.tab-view.on { display: flex; flex-direction: column; }

/* Events Tab */
aside h2 { font-size: 15.5px; margin: 0 0 3px; }
.sub { color: var(--mut); font-size: 12.5px; margin-bottom: 10px; }
.ev {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 8px;
}
.ev.on { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-soft); }
.ev summary { cursor: pointer; list-style: none; }
.ev summary::-webkit-details-marker { display: none; }
.d {
  color: var(--acc);
  font-weight: 700;
  font-size: 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.tag {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 7px;
  color: var(--mut);
  font-weight: 400;
  cursor: pointer;
}
.ev p { white-space: pre-line; margin: 8px 0 4px; font-size: 13.5px; line-height: 1.6; }
.go {
  margin-top: 4px;
  border: 0;
  background: none;
  color: var(--acc);
  cursor: pointer;
  padding: 0;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
}

/* Music Section */
.music-hero {
  background: linear-gradient(135deg, #b4442b22, #d9770622);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
}
.music-hero h3 { margin: 0 0 4px; font-size: 15px; }
.music-hero p { margin: 0; font-size: 12.5px; color: var(--mut); }
.music-form {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
  display: grid;
  gap: 8px;
}
.music-form input, .music-form select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
}
.music-form-row { display: grid; grid-template-columns: 1fr 110px; gap: 6px; }
.btn-primary {
  background: var(--acc);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.track-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 10px;
}
.track-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.track-title { font-weight: 700; font-size: 14px; }
.track-meta { font-size: 12px; color: var(--mut); margin-top: 2px; }
.track-embed {
  margin-top: 8px;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
}
.track-embed iframe { width: 100%; border: 0; display: block; }
.track-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  font-size: 12px;
}

/* Chat Section */
.chat-box {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 8px;
}
.msg {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 11px;
  max-width: 88%;
  align-self: flex-start;
  font-size: 13.5px;
}
.msg.me {
  background: var(--acc-soft);
  border-color: var(--acc);
  align-self: flex-end;
}
.msg small {
  display: block;
  color: var(--mut);
  font-size: 11px;
  margin-bottom: 2px;
}
.msg .ar-txt {
  font-size: 16px;
  font-family: "Traditional Arabic", "Geeza Pro", Tahoma, sans-serif;
  direction: rtl;
}
.chat-Composer {
  display: flex;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.chat-Composer input {
  flex: 1;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
}

/* Opposite-Side Arabic Keyboard */
#ar-kb {
  position: fixed;
  z-index: 95;
  background: var(--card);
  border: 2px solid var(--acc);
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 10px 30px #0005;
  width: min(440px, 94vw);
  display: none;
  user-select: none;
  transition: all 0.2s ease;
}
#ar-kb.show { display: block; }
/* Desktop: Chat is on RIGHT (start in RTL is right), so Keyboard docks on LEFT (opposite side!) */
#ar-kb.dock-opposite {
  bottom: 90px;
  left: 18px;
  right: auto;
}
#ar-kb.dock-alt {
  top: 68px;
  left: 18px;
  bottom: auto;
}
.kb-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  padding: 0 4px;
  font-size: 12px;
  color: var(--mut);
}
.kb-preview {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 9px;
  margin-bottom: 6px;
  font-size: 16px;
  min-height: 32px;
  direction: rtl;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.kb-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  direction: rtl;
}
.kb-key {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 7px;
  padding: 7px 2px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
.kb-key:active { background: var(--acc); color: #fff; }
.kb-key.wide { grid-column: span 2; font-size: 12px; }
.kb-key.space { grid-column: span 4; font-size: 12px; }

/* Footer Timeline */
footer {
  border-top: 1px solid var(--line);
  padding: 8px 14px calc(8px + var(--safe-bot));
  background: var(--card);
  z-index: 30;
}
#yr-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
#ylab { font-size: 20px; color: var(--acc); min-width: 90px; }
#sl { width: 100%; accent-color: var(--acc); height: 22px; cursor: pointer; }
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 16px;
  padding: 3px 10px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
}
.chips button.on { background: var(--acc); border-color: var(--acc); color: #fff; }

/* Responsive Smartphone Mode */
@media (max-width: 860px) {
  header { padding: 6px 10px; }
  h1 { font-size: 15px; }
  .badge { display: none; }
  main {
    display: flex;
    flex-direction: column;
  }
  #mapw { flex: 1; min-height: 200px; }
  #leg { max-width: 58%; max-height: 28%; font-size: 11px; bottom: 8px; }
  aside {
    border-inline-start: 0;
    border-top: 2px solid var(--line);
    height: 46vh;
    transition: height 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -4px 18px #0002;
  }
  aside.sheet-min { height: 88px; }
  aside.sheet-max { height: 78vh; }
  .sheet-handle { display: block; }

  /* On smartphone: When chat is at the bottom sheet, dock the Arabic keyboard at the TOP over the map so it never blocks the chat! */
  #ar-kb.dock-opposite {
    top: calc(52px + var(--safe-top));
    bottom: auto;
    left: 3vw;
    right: 3vw;
    width: 94vw;
  }
  #ar-kb.dock-alt {
    bottom: 65px;
    top: auto;
    left: 3vw;
    right: 3vw;
    width: 94vw;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>🌍 אטלס ההיסטוריה העולמית</h1>
    <span class="badge">מובייל + מוזיקה ערבית</span>
  </div>
  <div class="hdr-tools">
    <input id="q" type="search" placeholder="חיפוש (נפוליאון, קהיר, מלחמה...)">
    <button class="icon-btn" id="btn-today" title="אירועים שהתרחשו בחודש זה">📅 היום</button>
    <button class="icon-btn" id="btn-kb" title="מקלדת ערבית צפה בצד הנגדי">⌨️ ערבית</button>
    <button class="icon-btn" id="btn-theme" title="מצב כהה / בהיר">🌓</button>
  </div>
</header>

<main>
  <div id="mapw">
    <div id="map"></div>
    <div id="era"></div>
    <div class="map-btns">
      <button class="icon-btn" id="reset">🔄 איפוס מפה</button>
      <button class="icon-btn" id="btn-random">🎲 הפתע אותי</button>
    </div>
    <div id="leg"></div>
  </div>

  <aside id="drawer">
    <div class="sheet-handle" id="sheet-toggle" title="הגדל / הקטן תצוגה"><span></span></div>
    <div class="panel-tabs">
      <button class="on" data-tab="ev-tab">📜 אירועים (<span id="ev-badge">0</span>)</button>
      <button data-tab="music-tab">🎵 מוזיקה ערבית</button>
      <button data-tab="chat-tab">💬 צ'אט ודיון</button>
    </div>

    <!-- TAB 1: Historical Events -->
    <div class="tab-view on" id="ev-tab">
      <div id="side"></div>
    </div>

    <!-- TAB 2: Arabic Music Hub -->
    <div class="tab-view" id="music-tab">
      <div class="music-hero">
        <h3>🎶 פסקול המזרח וההיסטוריה</h3>
        <p>שתפו והאזינו לקלאסיקות בערבית (יוטיוב, ספוטיפיי או סאונדקלאוד) שמחוברות למדינות ולתקופות על המפה.</p>
      </div>

      <form class="music-form" id="music-form">
        <input type="text" id="m-title" placeholder="שם השיר והאמן (למשל: أم كلثوم - الأطلال)" required>
        <input type="url" id="m-url" placeholder="קישור מ-YouTube / Spotify / SoundCloud" required>
        <div class="music-form-row">
          <select id="m-country">
            <option value="Egypt">מצרים (Egypt)</option>
            <option value="Lebanon">לבנון (Lebanon)</option>
            <option value="Syria">סוריה (Syria)</option>
            <option value="Iraq">עיראק (Iraq)</option>
            <option value="Morocco">מרוקו (Morocco)</option>
            <option value="Saudi Arabia">ערב הסעודית</option>
            <option value="Palestine">פלסטין / א"י</option>
            <option value="Israel">ישראל</option>
            <option value="Algeria">אלג'יריה</option>
            <option value="Tunisia">תוניסיה</option>
            <option value="Jordan">ירדן</option>
            <option value="Turkey">טורקיה</option>
            <option value="Spain">ספרד (אל-אנדלוס)</option>
          </select>
          <input type="number" id="m-year" placeholder="שנה (1966)" value="1966">
        </div>
        <div style="display:flex;gap:6px">
          <button type="submit" class="btn-primary" style="flex:1">➕ הוסף ושתף שיר</button>
          <button type="button" class="icon-btn" id="m-use-kb" title="הקלד שם שיר בערבית">⌨️ מקלדת</button>
        </div>
      </form>

      <div id="music-list"></div>
    </div>

    <!-- TAB 3: Chat with Opposite-Side Keyboard Support -->
    <div class="tab-view" id="chat-tab">
      <div class="sub" style="display:flex;justify-content:space-between;align-items:center">
        <span>המקלדת הערבית נפתחת בצד הנגדי כדי לא להסתיר את השיחה.</span>
        <button class="go" id="chat-kb-btn">⌨️ פתח מקלדת</button>
      </div>
      <div class="chat-box" id="chat-box"></div>
      <form class="chat-Composer" id="chat-form">
        <input type="text" id="chat-in" placeholder="כתוב הודעה בעברית או בערבית..." autocomplete="off">
        <button type="submit" class="btn-primary">שלח</button>
      </form>
    </div>
  </aside>
</main>

<!-- Floating Arabic Keyboard (Docked on the OPPOSITE side of the chat!) -->
<div id="ar-kb" class="dock-opposite">
  <div class="kb-bar">
    <span>⌨️ מקלדת ערבית חכמה (בצד הנגדי לצ'אט)</span>
    <div style="display:flex;gap:6px">
      <button class="go" id="kb-flip" title="החלף מיקום מקלדת">⇅ הזז מיקום</button>
      <button class="go" id="kb-close" style="color:var(--ink)">✕ סגור</button>
    </div>
  </div>
  <div class="kb-preview">
    <span id="kb-buf-txt" style="color:var(--mut);font-size:13px">הקלד בערבית לשדה הפעיל...</span>
    <button class="go" id="kb- phrases">✨ ביטוי מוכן</button>
  </div>
  <div class="kb-grid" id="kb-grid"></div>
</div>

<footer>
  <div id="yr-row">
    <button class="icon-btn" id="btn-play" title="נגן ציר זמן אוטומטי">▶ ניגון</button>
    <b id="ylab"></b>
    <span id="cnt" class="sub" style="margin:0"></span>
  </div>
  <input id="sl" type="range" min="0" max="1100" value="900">
  <div class="chips" id="chips"></div>
</footer>

<script>
// --- 1. HISTORICAL EVENTS DATA ---

const HE={"Spain":"ספרד","Israel":"ישראל","Palestine":"הרשות הפלסטינית","Germany":"גרמניה","France":"צרפת","United Kingdom":"בריטניה","United States":"ארצות הברית","Russia":"רוסיה","Cambodia":"קמבודיה","Vietnam":"וייטנאם","Italy":"איטליה","Greece":"יוון","Turkey":"טורקיה","Egypt":"מצרים","Syria":"סוריה","Iraq":"עיראק","Iran":"איראן","Kuwait":"כווית","Saudi Arabia":"ערב הסעודית","Jordan":"ירדן","Lebanon":"לבנון","Tunisia":"תוניסיה","Libya":"לוב","Morocco":"מרוקו","Algeria":"אלג'יריה","India":"הודו","Pakistan":"פקיסטן","Bangladesh":"בנגלדש","China":"סין","Japan":"יפן","Korea":"קוריאה","Philippines":"הפיליפינים","Singapore":"סינגפור","Australia":"אוסטרליה","New Zealand":"ניו זילנד","South Africa":"דרום אפריקה","Ghana":"גאנה","Ethiopia":"אתיופיה","Poland":"פולין","Ukraine":"אוקראינה","Austria":"אוסטריה","Hungary":"הונגריה","Bulgaria":"בולגריה","Mexico":"מקסיקו","Argentina":"ארגנטינה","Ireland":"אירלנד","Netherlands":"הולנד","Afghanistan":"אפגניסטן","Czech Rep.":"צ'כיה","Bosnia and Herz.":"בוסניה","Canada":"קנדה"};

const ANCH=[-200,0,500,1000,1300,1500,1700,1800,1900,1945,1991,2026];
let year=1967, sel=null, q='', focus=-1, wide=false, playTimer=null, sheetState=0;
let activeInput = null;

const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const he=c=>HE[c]||c;
const fy=y=>y<0?(-y)+' לפנה"ס':String(y);

function v2y(v){const i=Math.min(Math.floor(v/100),ANCH.length-2),f=(v-i*100)/100;return Math.round(ANCH[i]+(ANCH[i+1]-ANCH[i])*f)}
function y2v(y){for(let i=0;i<ANCH.length-1;i++)if(y<=ANCH[i+1])return Math.max(0,i*100+100*(y-ANCH[i])/(ANCH[i+1]-ANCH[i]));return 1100}
function win(y){for(let i=0;i<ANCH.length-1;i++)if(y<=ANCH[i+1])return Math.max(5,(ANCH[i+1]-ANCH[i])/4);return 10}
const eraOf=y=>{let e=ERAS[0];for(const x of ERAS)if(x.s<=y)e=x;return e};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const own=c=>'hsl('+((hash(c)*137.508)%360)+',52%,'+(document.documentElement.dataset.theme==='dark'?'38%':'62%')+')';

function polity(c,era){
  for(const p of era.p)if(p[2].includes(c))return {n:p[0],c:p[1],all:p[2]};
  return era.own?{n:'מדינה עצמאית',c:own(c),all:[c]}:{n:'אזורים ללא שלטון מאוחד / עמים מקומיים',c:'#bfc4cc',all:[c]};
}

const geoJ=echarts.getMap('world').geoJson.features, NAMES=geoJ.map(f=>f.properties.name);
function bbox(name){
  const f=geoJ.find(x=>x.properties.name===name);if(!f)return null;
  const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
  let best=polys[0];for(const p of polys)if(p[0].length>best[0].length)best=p;
  let a=[1e9,1e9,-1e9,-1e9];
  for(const [x,y] of best[0]){a=[Math.min(a[0],x),Math.min(a[1],y),Math.max(a[2],x),Math.max(a[3],y)]}
  return a;
}
function dive(name){
  const b=bbox(name);if(!b)return;
  const w=b[2]-b[0],h=b[3]-b[1];
  chart.setOption({geo:{center:[(b[0]+b[2])/2,(b[1]+b[3])/2],zoom:Math.max(1.8,Math.min(12,Math.min(300/w,150/h)*.55))}});
}

const chart=echarts.init($('map'));
function inWin(e){return Math.abs(e.y-year)<=win(year)}
function match(e){return !q||(e.t+e.x+he(e.c||'')).toLowerCase().includes(q.toLowerCase())}

function render(){
  const era=eraOf(year),pol={},w=win(year);
  $('ylab').textContent=fy(year);
  $('era').textContent=era.n;
  const regions=NAMES.map(n=>{
    const p=polity(n,era);pol[n]=p;
    return {
      name:n,
      itemStyle:{areaColor:p.c,borderColor:css('--bd'),borderWidth:.6},
      emphasis:{itemStyle:{areaColor:p.c,borderColor:css('--ink'),borderWidth:1.6}},
      select:{itemStyle:{areaColor:p.c}}
    };
  });
  if(sel){
    const s=new Set(wide?pol[sel].all:[sel]);
    regions.forEach(r=>{if(s.has(r.name))r.itemStyle={...r.itemStyle,borderColor:css('--ink'),borderWidth:2.2}});
  }
  window._pol=pol;

  // Event Pins + Music Pins on Map
  const vis=EV.map((e,i)=>({e,i})).filter(({e})=>e.la!=null&&(q?match(e):inWin(e)));
  const pins=vis.map(({e,i})=>({
    name:e.t,
    value:[e.lo+((i*37)%11-5)*.15,e.la+((i*17)%9-4)*.12],
    i,
    kind:'ev',
    itemStyle:{color:i===focus?'#ffd400':css('--acc')}
  }));

  chart.setOption({
    backgroundColor:css('--sea'),
    tooltip:{
      trigger:'item',
      confine:true,
      formatter:p=>p.componentType==='series'
        ? '<b>'+(EV[p.data.i].d)+'</b><br>'+p.name
        : '<b>'+he(p.name)+'</b><br>'+(pol[p.name]||{}).n
    },
    geo:{
      map:'world',
      roam:true,
      zoom:1.25,
      center:[25,28],
      aspectScale:.85,
      regions,
      label:{show:false},
      scaleLimit:{min:1,max:28},
      itemStyle:{borderColor:css('--bd')}
    },
    series:[{
      type:'scatter',
      coordinateSystem:'geo',
      symbolSize:13,
      data:pins,
      itemStyle:{borderColor:'#fff',borderWidth:1.5,shadowBlur:5,shadowColor:'#0006'},
      zlevel:3
    }]
  });

  // Legend
  const used=[...new Map(NAMES.map(n=>[pol[n].n,pol[n].c])).entries()].filter(([n])=>era.p.some(p=>p[0]===n));
  $('leg').innerHTML=(era.own?'<div style="color:var(--mut)">כל מדינה עצמאית בצבע משלה</div>':'')+
    (era.p.length?used.map(([n,c])=>'<div><i style="background:'+c+'"></i>'+n+'</div>').join(''):'<div style="color:var(--mut)">בעולם העכשווי כל מדינה צבועה בנפרד</div>');

  // Event List
  let list, head, sub;
  if(sel){
    const s=new Set(wide?pol[sel].all:[sel]);
    list=EV.map((e,i)=>({e,i})).filter(({e})=>s.has(e.c));
    head=wide?pol[sel].n:he(sel);
    sub=list.length+' אירועים בכל התקופות'+(pol[sel].all.length>1?' · <button class="go" id="wd">'+(wide?'חזרה למדינה בלבד':'הצג את כל '+pol[sel].n)+'</button>':'')+' · <button class="go" id="cl">נקה בחירה</button>';
  } else if(q){
    list=EV.map((e,i)=>({e,i})).filter(({e})=>match(e));
    head='תוצאות חיפוש: '+q;
    sub=list.length+' אירועים נמצאו';
  } else {
    list=EV.map((e,i)=>({e,i})).filter(({e})=>inWin(e));
    head='אירועים סביב '+fy(year);
    sub=list.length+' אירועים ('+fy(Math.round(year-w))+' עד '+fy(Math.round(year+w))+')';
  }

  $('cnt').textContent=vis.length+' סימונים על המפה';
  $('ev-badge').textContent=list.length;
  $('side').innerHTML='<h2>'+head+'</h2><div class="sub">'+sub+'</div>'+
    (list.slice(0,100).map(({e,i})=>
      '<details class="ev'+(i===focus?' on':'')+'" id="e'+i+'"'+(i===focus?' open':'')+'>'+
        '<summary><div class="d">'+e.d+(e.c?' <span class="tag" data-c="'+e.c+'">'+he(e.c)+'</span>':'')+'</div><div>'+e.t+'</div></summary>'+
        '<p>'+e.x.replace(/</g,'<')+'</p>'+
        '<button class="go" data-y="'+e.y+'">⏱ קפיצה לשנת '+fy(e.y)+'</button>'+
      '</details>'
    ).join('') || '<div class="sub">אין אירועים בחלון הזמן הזה – הזיזו את הציר או לחצו על "הפתע אותי".</div>');

  if($('wd'))$('wd').onclick=()=>{wide=!wide;render()};
  if($('cl'))$('cl').onclick=()=>{sel=null;wide=false;reset();render()};
  const f=$('e'+focus);if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function reset(){chart.setOption({geo:{center:[25,28],zoom:1.25}})}
function setYear(y){year=y;$('sl').value=y2v(y);focus=-1;render();chips()}
function chips(){
  const cur=eraOf(year);
  $('chips').innerHTML=ERAS.map((e,i)=>'<button class="'+(e===cur?'on':'')+'" data-i="'+i+'">'+e.n.replace(/\s*\(.*$/,'')+'</button>').join('');
}

// --- 4. ARABIC MUSIC HUB (YOUTUBE / SPOTIFY / SOUNDCLOUD EMBEDDER) ---
let tracks = JSON.parse(localStorage.getItem('atlas_arabic_music') || 'null') || DEFAULT_MUSIC;

function getEmbedHtml(url){
  try {
    const u = new URL(url);
    // YouTube
    if(u.hostname.includes('youtube.com') || u.hostname.includes('youtu.be')){
      let vid = u.searchParams.get('v');
      if(!vid && u.hostname.includes('youtu.be')) vid = u.pathname.slice(1);
      if(vid) return `<iframe height="175" src="https://www.youtube.com/embed/${vid}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
    }
    // Spotify
    if(u.hostname.includes('spotify.com')){
      const embedUrl = url.replace('open.spotify.com/', 'open.spotify.com/embed/');
      return `<iframe height="152" src="${embedUrl}" allow="encrypted-media" loading="lazy"></iframe>`;
    }
    // SoundCloud
    if(u.hostname.includes('soundcloud.com')){
      return `<iframe height="130" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23b4442b" loading="lazy"></iframe>`;
    }
  } catch(e){}
  return `<div style="padding:10px;background:var(--bg);font-size:12.5px"><a href="${url}" target="_blank" rel="noopener" style="color:var(--acc)">🔗 פתח קישור האזנה חיצוני</a></div>`;
}

function renderMusic(){
  $('music-list').innerHTML = tracks.map((tr, idx) => `
    <div class="track-card">
      <div class="track-head">
        <div>
          <div class="track-title" dir="auto">${tr.title}</div>
          <div class="track-meta">📍 ${he(tr.country)} · שנת ${tr.year} ${tr.note ? '· '+tr.note : ''}</div>
        </div>
        <button class="tag" data-mc="${tr.country}" data-my="${tr.year}">הצג במפה</button>
      </div>
      <div class="track-embed">${getEmbedHtml(tr.url)}</div>
      <div class="track-actions">
        <button class="go" data-share="${idx}">📤 שתף שיר בצ'אט</button>
        <a href="${tr.url}" target="_blank" rel="noopener" class="go" style="text-decoration:none">🔗 מקור</a>
      </div>
    </div>
  `).join('');
}

$('music-form').onsubmit = e => {
  e.preventDefault();
  const title = $('m-title').value.trim();
  const url = $('m-url').value.trim();
  const country = $('m-country').value;
  const yr = parseInt($('m-year').value, 10) || 1970;
  if(!title || !url) return;
  tracks.unshift({ title, url, country, year: yr, note: "נוסף על ידי משתמש" });
  localStorage.setItem('atlas_arabic_music', JSON.stringify(tracks));
  $('m-title').value = '';
  $('m-url').value = '';
  renderMusic();
  dive(country);
  setYear(yr);
};

$('music-list').onclick = e => {
  const mc = e.target.dataset.mc;
  const my = e.target.dataset.my;
  if(mc){
    sel = mc; wide = false;
    dive(mc);
    if(my) setYear(+my);
  }
  const sh = e.target.dataset.share;
  if(sh != null){
    const tr = tracks[+sh];
    addChatMessage('משתף מוזיקה 🎵', `האזינו ל-${tr.title} (${he(tr.country)}, ${tr.year}): ${tr.url}`, true);
    switchTab('chat-tab');
  }
};

// --- 5. CHAT & OPPOSITE-SIDE ARABIC VIRTUAL KEYBOARD ---
const CHAT_SEED = [
  { who: "מומחה להיסטוריה", txt: "אהלן! ברוכים הבאים לאטלס. שימו לב שכשפותחים את המקלדת הערבית, היא מעוגנת בצד הנגדי של המסך כדי ששדה ההקלדה והשיחה תמיד יישארו פנויים.", me: false },
  { who: "חובב מוזיקה", txt: "מוזמנים למדור המוזיקה להאזין לאום כולתום ופיירוז או להדביק קישור מספוטיפיי ויוטיוב! מרחבא 🎶 مرحبا بكم في أطلس التاريخ", me: false }
];
let messages = JSON.parse(localStorage.getItem('atlas_chat') || 'null') || CHAT_SEED;

function renderChat(){
  const box = $('chat-box');
  box.innerHTML = messages.map(m => `
    <div class="msg ${m.me ? 'me' : ''}">
      <small>${m.who}</small>
      <div class="ar-txt" dir="auto">${m.txt.replace(/</g,'<')}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function addChatMessage(who, txt, me=true){
  messages.push({ who, txt, me });
  localStorage.setItem('atlas_chat', JSON.stringify(messages));
  renderChat();
}

$('chat-form').onsubmit = e => {
  e.preventDefault();
  const v = $('chat-in').value.trim();
  if(!v) return;
  addChatMessage('אני', v, true);
  $('chat-in').value = '';
  $('kb-buf-txt').textContent = 'הקלד בערבית לשדה הפעיל...';
};

// Build Arabic Keyboard Layout
const AR_KEYS = [
  'ض','ص','ث','ق','ف','غ','ع','ه','خ','ح',
  'ج','ד','ش','س','ي','ب','ل','ا','ت','ن',
  'م','ك','ط','ئ','ء','ؤ','ر','لا','ى','ة',
  'و','ز','ظ','أ','إ','آ','؟','،'
];
// Fix standard Arabic Dal
AR_KEYS[11] = 'د';

function initArabicKeyboard(){
  const grid = $('kb-grid');
  grid.innerHTML = AR_KEYS.map(k => `<button type="button" class="kb-key" data-k="${k}">${k}</button>`).join('') +
    `<button type="button" class="kb-key space" data-k=" ">רווח (مسافة)</button>` +
    `<button type="button" class="kb-key wide" data-k="BACK">⌫ מחיקה</button>`;

  grid.onclick = e => {
    const k = e.target.dataset.k;
    if(!k) return;
    const target = activeInput || $('chat-in');
    if(k === 'BACK'){
      target.value = target.value.slice(0, -1);
    } else {
      target.value += k;
    }
    $('kb-buf-txt').textContent = target.value || 'הקלד בערבית לשדה הפעיל...';
    if(target.id === 'q'){
      q = target.value.trim();
      render();
    }
    target.focus();
  };
}
initArabicKeyboard();

// Track which input is active so the Arabic keyboard types into it without blocking the view
['chat-in', 'm-title', 'q'].forEach(id => {
  $(id).addEventListener('focus', e => { activeInput = e.target; });
});

function toggleKeyboard(forceShow){
  const kb = $('ar-kb');
  const show = typeof forceShow === 'boolean' ? forceShow : !kb.classList.contains('show');
  kb.classList.toggle('show', show);
  $('btn-kb').classList.toggle('active', show);
}

$('btn-kb').onclick = () => toggleKeyboard();
$('chat-kb-btn').onclick = () => { activeInput = $('chat-in'); toggleKeyboard(true); };
$('m-use-kb').onclick = () => { activeInput = $('m-title'); toggleKeyboard(true); };
$('kb-close').onclick = () => toggleKeyboard(false);
$('kb-flip').onclick = () => {
  const kb = $('ar-kb');
  kb.classList.toggle('dock-opposite');
  kb.classList.toggle('dock-alt');
};

const READY_PHRASES = [
  'يا سلام على الموسيقى العربية 🎶',
  'مرحبا بكم في أطلس التاريخ 🌍',
  'القاهرة عاصمة الفن والطرب',
  'أغنية رائعة من الزمن الجميل ✨'
];
let phraseIdx = 0;
$('kb- phrases').onclick = () => {
  const target = activeInput || $('chat-in');
  target.value = READY_PHRASES[phraseIdx % READY_PHRASES.length];
  phraseIdx++;
  $('kb-buf-txt').textContent = target.value;
};

// --- 6. NAVIGATION, TABS & SURPRISE FEATURES ---
function switchTab(tabId){
  document.querySelectorAll('.panel-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-view').forEach(v => v.classList.toggle('on', v.id === tabId));
}
document.querySelector('.panel-tabs').onclick = e => {
  const btn = e.target.closest('button');
  if(btn && btn.dataset.tab) switchTab(btn.dataset.tab);
};

// Mobile Bottom Sheet cycle (Normal -> Expanded -> Minimized)
$('sheet-toggle').onclick = () => {
  const dr = $('drawer');
  sheetState = (sheetState + 1) % 3;
  dr.classList.remove('sheet-min', 'sheet-max');
  if(sheetState === 1) dr.classList.add('sheet-max');
  if(sheetState === 2) dr.classList.add('sheet-min');
  setTimeout(() => chart.resize(), 260);
};

// Surprise 1: Auto-Play History Time Machine
$('btn-play').onclick = () => {
  if(playTimer){
    clearInterval(playTimer);
    playTimer = null;
    $('btn-play').textContent = '▶ ניגון';
    $('btn-play').classList.remove('active');
  } else {
    $('btn-play').textContent = '⏸ עצור';
    $('btn-play').classList.add('active');
    playTimer = setInterval(() => {
      let v = +$('sl').value + 8;
      if(v > 1100) v = 0;
      $('sl').value = v;
      year = v2y(v);
      render();
      chips();
    }, 350);
  }
};

// Surprise 2: Random Historical Jump ("הפתע אותי")
$('btn-random').onclick = () => {
  const idx = Math.floor(Math.random() * EV.length);
  const ev = EV[idx];
  q = ''; $('q').value = '';
  sel = null;
  year = ev.y;
  $('sl').value = y2v(ev.y);
  focus = idx;
  if(ev.c) dive(ev.c);
  switchTab('ev-tab');
  render();
  chips();
};

// Surprise 3: This Month in History
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
$('btn-today').onclick = () => {
  const mName = MONTHS_HE[new Date().getMonth()];
  q = mName;
  $('q').value = mName;
  sel = null;
  switchTab('ev-tab');
  render();
};

// Dark/Light Mode Toggle
$('btn-theme').onclick = () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  render();
};

// Standard Map & Timeline Controls
$('chips').onclick=e=>{
  const i=e.target.dataset.i;
  if(i!=null){
    const s=[-100,117,750,1300,1500,1800,1914,1967,2010][i];
    setYear(s);
  }
};
$('sl').oninput=e=>{year=v2y(+e.target.value);focus=-1;render();chips()};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('reset').onclick=()=>{sel=null;wide=false;q='';$('q').value='';reset();render()};
$('side').onclick=e=>{
  const t=e.target;
  if(t.dataset.y!=null){q='';$('q').value='';setYear(+t.dataset.y)}
  if(t.dataset.c){sel=t.dataset.c;wide=false;dive(sel);render()}
};
chart.on('click',p=>{
  if(p.componentType==='series'){
    focus=p.data.i;
    const e=EV[focus];
    if(e.c)dive(e.c);
    if(!q&&!inWin(e)){year=e.y;$('sl').value=y2v(e.y);chips()}
    sel=null;
    switchTab('ev-tab');
    render();
  } else if(p.componentType==='geo'){
    sel=p.name;wide=false;dive(sel);render();
  }
});

window.addEventListener('resize',()=>chart.resize());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);

// Initialize Everything
renderMusic();
renderChat();
setYear(1967);
</script>
</body>
</html>
